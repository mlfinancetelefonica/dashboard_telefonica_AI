<body>
  <div id="__bundler_placeholder">Loading Telefónica y sus mercados núcleo...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e\" style=\"color:var(--blue-dark);\">3.078 M€<\u002Fdiv>\n      <div class=\"quote-sub\">EBITDA ajustado del 3T 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav class=\"tabs\">\n    <button data-t=\"vision\" class=\"active\">Visión general<\u002Fbutton>\n    <button data-t=\"resumen\">Contexto<\u002Fbutton>\n    <button data-t=\"finanzas\">Situación financiera<\u002Fbutton>\n    <button data-t=\"mercado\">Mercado y accionistas<\u002Fbutton>\n    <button data-t=\"riesgos\">Riesgos y oportunidades<\u002Fbutton>\n    <button data-t=\"acciones\">Calendario y fuentes<\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- ================= VISIÓN GENERAL ================= -->\n  <section class=\"panel active\" data-p=\"vision\">\n    <div class=\"kpis\">\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"><\u002Fpolyline><polyline points=\"16 7 22 7 22 13\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"nm\">Ingresos<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">24.825 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+2,8%<\u002Fspan> frente a ene–sep 2025<br>+1,0% a tipo de cambio constante<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">EBITDA ajustado<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">8.846 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+4,6%<\u002Fspan> frente a ene–sep 2025<br>35,6% de margen<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"><\u002Fpath><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">Flujo de caja libre<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">1.963 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+10,7%<\u002Fspan> frente a ene–sep 2025<br>≈ 3.100 M€ de previsión anual<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"><\u002Fline><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"><\u002Fline><polygon points=\"12 2 20 7 4 7\"><\u002Fpolygon><\u002Fsvg><\u002Fspan><span class=\"nm\">Deuda financiera neta<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">25.186 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">−10,8%<\u002Fspan> frente a sep-2025<br>2,63× EBITDAaL<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi warn\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 17 13.5 8.5 8.5 13.5 2 7\"><\u002Fpolyline><polyline points=\"16 17 22 17 22 11\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"nm\">Cotización<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">3,43 €<\u002Fdiv><div class=\"vsub\"><span class=\"dn\">−1,9%<\u002Fspan> a media mañana<br>+7,3% desde el 26-oct<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"nm\">Calificación de Fitch<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">BBB<\u002Fdiv><div class=\"vsub\">perspectiva estable<br>2-oct-2026<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sumcard\"><div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Resumen ejecutivo<\u002Fh2><\u002Fdiv>\n    <p class=\"lead\">Telefónica cerró los nueve primeros meses del año con señales positivas en rentabilidad, caja y reducción de deuda, frente a una evolución de los ingresos algo más débil de lo esperado. El EBITDA avanzó un 4,6% y la deuda neta bajó hasta 25.186 M€. De cara al conjunto de 2026, la compañía mejoró sus previsiones de EBITDA y flujo de caja libre, pero recortó las expectativas de crecimiento de ingresos. La acción cayó un 1,9%, hasta 3,43 €, y Fitch mantiene el rating BBB con perspectiva estable.<\u002Fp>\n    <p class=\"prose\">Telefónica, S.A. es la sociedad matriz del grupo y concentra su financiación. Este panel resume el grupo consolidado; el detalle de cada negocio está en las fichas de las filiales. Virgin Media O2, UGG y nexfibre no se suman a estas cifras porque son negocios conjuntos.<\u002Fp>\n    <div class=\"listbox\">\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Evolución del negocio.<\u002Fb> El tercer trimestre fue el mejor del año: ingresos +4,8% y EBITDA +6,2%. España y Brasil impulsan el crecimiento del grupo; Alemania, en cambio, sigue restándole.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Previsiones.<\u002Fb> La compañía eleva las previsiones de EBITDA, caja operativa y flujo de caja libre, pero reduce la de ingresos. Se espera, por tanto, un crecimiento más moderado de los ingresos, pero con una mayor generación de caja.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Deuda y desapalancamiento.<\u002Fb> La deuda se reduce hasta 25.186 M€, 1.638 M€ menos que en diciembre, y se sitúa en 2,63 veces el EBITDAaL. La reducción continúa, aunque todavía por encima del objetivo de 2,5 veces previsto para 2028. Fitch mantiene el BBB con perspectiva estable.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Brasil y efecto divisa.<\u002Fb> Brasil aporta el 39% del EBITDA y Vivo crece un 9,9% en moneda local. Hasta septiembre, la apreciación interanual del real ha elevado el crecimiento en euros, aunque su depreciación desde finales de octubre reducirá ese efecto.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-hi\"><\u002Fspan><span><b>Deuda desde la perspectiva de JPMorgan.<\u002Fb> JPMorgan estima que la deuda alcanza el 75% del valor del grupo al incluir también la deuda de las participadas y los arrendamientos. Con este cálculo, rebaja el precio objetivo de 3,70 a 3,20 € y recomienda infraponderar la acción.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Consolidación en España.<\u002Fb> Las conversaciones con Zegona por Vodafone España continúan, pero todavía sin oferta. A la falta de avances concretos se añade la incertidumbre regulatoria, ya que Berenberg considera improbable una aprobación de Bruselas sin grandes concesiones.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tefbox\" style=\"margin-top:4px;\">\n      <h2>Implicaciones<\u002Fh2>\n      <p class=\"intro\">La mejora de la caja y la reducción de deuda son positivas, pero el nivel de apalancamiento, la exposición a Brasil y una posible ampliación de capital siguen condicionando la valoración.<\u002Fp>\n      <div class=\"tefgrid\">\n        <div class=\"tf\"><span class=\"tl\">Dividendo con cargo a 2026<\u002Fspan><span class=\"tv\">0,15 € por acción<\u002Fspan><p>Con cargo a 2026 y pagadero en junio de 2027. Al precio del 12 de noviembre, supone una rentabilidad del 4,4%.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Capitalización frente a deuda<\u002Fspan><span class=\"tv\">≈ 0,8×<\u002Fspan><p>19.000 M€ de valor en bolsa frente a 25.186 M€ de deuda financiera neta: el peso de la deuda supera al valor del capital en bolsa.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Exposición a Brasil<\u002Fspan><span class=\"tv\">39% del EBITDA<\u002Fspan><p>Por su peso en el grupo, cada 1% de depreciación del real tendría un impacto aproximado del 0,4% en el EBITDA consolidado.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Riesgo de dilución<\u002Fspan><span class=\"tv\">Ampliación de capital<\u002Fspan><p>La dirección no descarta recurrir a una ampliación para financiar una adquisición relevante. De producirse, aumentaría el número de acciones y diluiría la participación de los actuales accionistas.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Valoración<\u002Fspan><span class=\"tv\">≈ 7,2× beneficio 2028<\u002Fspan><p>JPMorgan sitúa la valoración en unas 7,2 veces el beneficio estimado para 2028, frente a alrededor de 9 veces para el sector. El descuento refleja, entre otros factores, el peso de la deuda.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"bottom\"><strong>En conjunto.<\u002Fstrong> El grupo genera más caja y reduce deuda, con España y Brasil como motores del crecimiento y Alemania todavía restándolo. El margen para nuevas decisiones de capital sigue siendo estrecho: con un apalancamiento de 2,63×, por encima del objetivo de 2,5× para 2028, una compra en España o un deterioro de las participadas más endeudadas obligaría a elegir entre más deuda, una ampliación de capital o una menor remuneración al accionista.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CONTEXTO ================= -->\n  <section class=\"panel\" data-p=\"resumen\">\n    <p class=\"lead\">En los nueve primeros meses, Telefónica ha mejorado la generación de caja y ha reducido la deuda, mientras que los ingresos crecen en el límite inferior de la previsión, rebajada el 12 de noviembre. La valoración sigue pendiente de tres factores que las cifras consolidadas no recogen: la financiación de una posible compra en España, la evolución del real brasileño y la situación de las participadas más endeudadas. El cuadro siguiente desarrolla estos puntos en ese orden: resultados y caja, balance y mercado.<\u002Fp>\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Cuadro de seguimiento<\u002Fh2><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt mon\">\n        <thead><tr><th>Indicador<\u002Fth><th class=\"num\">Actual<\u002Fth><th>Referencia<\u002Fth><th>Desviación<\u002Fth><th>Estado<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr class=\"grp\"><td colspan=\"5\">Operación<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Telefónica revisó su previsión de ingresos el 12 de noviembre, con los resultados del tercer trimestre: los ingresos de 2026 crecerán entre un 1% y un 1,5% a tipo de cambio constante, frente al +1,5% a +2,5% que mantenía hasta entonces. Hasta septiembre crecen un 1,0%, justo en el suelo de la nueva horquilla, sin margen respecto al mínimo.\"><td class=\"ind\">Crecimiento de ingresos a tipo constante<\u002Ftd><td class=\"num\">+1,0% <span class=\"soft\">(ene–sep)<\u002Fspan><\u002Ftd><td class=\"soft\">Previsión anual 2026: +1% a +1,5% desde el 12 de noviembre; hasta entonces, +1,5% a +2,5%<\u002Ftd><td class=\"soft\">0 p.p. frente al mínimo anual<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a la previsión, rebajada el 12 de noviembre<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El 12 de noviembre Telefónica elevó la previsión de EBITDA para 2026 a «ligeramente por encima del +2,5%» a tipo de cambio constante; hasta entonces esperaba entre +1,5% y +2,5%. Hasta septiembre crece un 2,5%, en línea con el nuevo objetivo.\"><td class=\"ind\">Crecimiento del EBITDA a tipo constante<\u002Ftd><td class=\"num\">+2,5% <span class=\"soft\">(ene–sep)<\u002Fspan><\u002Ftd><td class=\"soft\">Previsión anual 2026: ligeramente por encima del +2,5% desde el 12 de noviembre; hasta entonces, +1,5% a +2,5%<\u002Ftd><td class=\"soft\">0 p.p. frente a la previsión anual<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a la previsión, elevada el 12 de noviembre<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La previsión anual de crecimiento de la caja operativa (OpCFaL), a tipo de cambio constante, se ha revisado al alza en dos ocasiones: de más del +2% a más del +3% en julio, y a más del +3,5% el 12 de noviembre. Entre enero y septiembre, el crecimiento acumulado alcanza el +4,2%, situándose 0,7 p.p. por encima del nuevo umbral de previsión anual.\"><td class=\"ind\">Crecimiento de la caja operativa a tipo constante<\u002Ftd><td class=\"num\">+4,2% <span class=\"soft\">(ene–sep)<\u002Fspan><\u002Ftd><td class=\"soft\">Previsión anual 2026: más del +3,5% desde el 12 de noviembre; hasta entonces, más del +3%, fijado en julio<\u002Ftd><td class=\"soft\">+0,7 p.p. frente a la previsión anual<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a la previsión anual<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Telefónica prevé invertir en 2026 en torno al 12% de sus ingresos, sin contar espectro. Hasta septiembre la inversión equivale al 12,1%, una décima por encima: prácticamente en la previsión.\"><td class=\"ind\">Inversión sobre ingresos<\u002Ftd><td class=\"num\">12,1%<\u002Ftd><td class=\"soft\">Previsión 2026: ≈ 12%<\u002Ftd><td class=\"soft\">+0,1 p.p.<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a la previsión<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El flujo de caja libre de enero a septiembre suma 1.963 M€, un 10,7% más que en el mismo periodo de 2025, unos 190 M€ más. La cifra de 2025 (≈ 1.774 M€) está calculada a partir de la variación publicada.\"><td class=\"ind\">Flujo de caja libre frente al año anterior<\u002Ftd><td class=\"num\">1.963 M€ <span class=\"soft\">(ene–sep)<\u002Fspan><\u002Ftd><td class=\"soft\">≈ 1.774 M€ en ene–sep 2025<\u002Ftd><td class=\"soft\">+10,7% (≈ +190 M€)<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a ene–sep 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El 12 de noviembre Telefónica elevó su previsión de flujo de caja libre para 2026 a unos 3.100 M€; hasta entonces eran unos 3.000 M€. Con 1.963 M€ hasta septiembre ha alcanzado el 63% del objetivo; restan unos 1.140 M€ por generar en el cuarto trimestre.\"><td class=\"ind\">Flujo de caja libre frente a la previsión<\u002Ftd><td class=\"num\">1.963 M€ <span class=\"soft\">(ene–sep)<\u002Fspan><\u002Ftd><td class=\"soft\">Previsión 2026: ≈ 3.100 M€ desde el 12 de noviembre; hasta entonces, ≈ 3.000 M€<\u002Ftd><td class=\"soft\">63% en nueve meses<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">depende del cuarto trimestre<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El beneficio neto ajustado del tercer trimestre fue de 629 M€, un 17% por encima de los ≈ 538 M€ que esperaba de media el consenso de analistas.\"><td class=\"ind\">Beneficio neto ajustado del tercer trimestre<\u002Ftd><td class=\"num up\">629 M€<\u002Ftd><td class=\"soft\">Consenso de analistas: ≈ 538 M€<\u002Ftd><td class=\"soft\">+17%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto al consenso<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr class=\"grp\"><td colspan=\"5\">Balance<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La deuda financiera neta bajó a 25.186 M€ a 30 de septiembre, 1.638 M€ menos que en diciembre de 2025 (26.824 M€). No incluye la deuda de los negocios conjuntos, como Virgin Media O2.\"><td class=\"ind\">Deuda financiera neta<\u002Ftd><td class=\"num\">25.186 M€<\u002Ftd><td class=\"soft\">26.824 M€ en diciembre de 2025<\u002Ftd><td class=\"soft\">−1.638 M€<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a diciembre 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La deuda neta equivale a 2,63 veces el EBITDAaL. El plan estratégico fija como objetivo 2,5 veces en 2028, por lo que se sitúa 0,13 por encima, coherente con la senda de reducción prevista.\"><td class=\"ind\">Deuda neta / EBITDAaL<\u002Ftd><td class=\"num\">2,63×<\u002Ftd><td class=\"soft\">Objetivo de 2,5× en 2028<\u002Ftd><td class=\"soft\">+0,13×<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a la senda del plan<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Fitch confirmó el 2 de octubre la calificación BBB de Telefónica, con perspectiva estable. No hay cambios respecto a la nota anterior.\"><td class=\"ind\">Calificación de Fitch<\u002Ftd><td class=\"num\">BBB<\u002Ftd><td class=\"soft\">Perspectiva estable<\u002Ftd><td class=\"soft\">Sin cambios<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">confirmada el 2 de octubre<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr class=\"grp\"><td colspan=\"5\">Mercado<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"A media mañana del 12 de noviembre la acción cotizaba a 3,43 €, un 17% por debajo de su máximo de las últimas 52 semanas (4,123 €). No es el precio de cierre.\"><td class=\"ind\">Cotización <span class=\"soft\">(12-nov, a media mañana)<\u002Fspan><\u002Ftd><td class=\"num dn\">3,43 €<\u002Ftd><td class=\"soft\">Máximo de 52 semanas: 4,123 €<\u002Ftd><td class=\"soft\">−17%<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto al máximo de 52 semanas<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El 26 de octubre JPMorgan rebajó su recomendación de neutral a infraponderar y bajó el precio objetivo de 3,70 € a 3,20 €. Lo justifica por el nivel de endeudamiento, incluido el de las participadas.\"><td class=\"ind\">Recomendación de JPMorgan<\u002Ftd><td class=\"num\">Infraponderar<\u002Ftd><td class=\"soft\">Neutral hasta el 26 de octubre<\u002Ftd><td class=\"soft\">Precio objetivo de 3,70 a 3,20 €<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a la anterior<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <div class=\"cards3\">\n      <div class=\"card\"><h3 style=\"color:var(--blue-dark);\">Aspectos favorables<\u002Fh3><ul>\n        <li><strong>Previsiones revisadas al alza<\u002Fstrong>: EBITDA, caja operativa y flujo de caja libre (≈ 3.100 M€), el 12 de noviembre.<\u002Fli>\n        <li><strong>Reducción de la deuda financiera neta<\u002Fstrong>: −1.638 M€ desde diciembre, la mayor reducción en nueve meses desde 2021.<\u002Fli>\n        <li><strong>Resultado neto atribuido positivo<\u002Fstrong>: 464 M€ entre enero y septiembre, frente a unas pérdidas de 1.080 M€ en el mismo periodo de 2025.<\u002Fli>\n        <li><strong>Liquidez disponible<\u002Fstrong>: 17.500 M€ y vida media de la deuda de 11,2 años, a septiembre.<\u002Fli><\u002Ful><\u002Fdiv>\n      <div class=\"card\"><h3 style=\"color:var(--red-dark);\">Focos de atención<\u002Fh3><ul>\n        <li><strong>Ingresos<\u002Fstrong>: previsión de crecimiento rebajada a +1%–1,5%.<\u002Fli>\n        <li><strong>Alemania<\u002Fstrong>: ingresos y EBITDA siguen cayendo, con más recortes previstos en 2027.<\u002Fli>\n        <li><strong>Brasil<\u002Fstrong>: real más débil y tipo de interés sin bajar, en el 13,75%.<\u002Fli>\n        <li><strong>Participadas endeudadas<\u002Fstrong>: Virgin Media O2, con 4,19× de apalancamiento, y UGG, en renegociación con los bancos.<\u002Fli><\u002Ful><\u002Fdiv>\n      <div class=\"card\"><h3>Cuestiones abiertas<\u002Fh3><ul>\n        <li><strong>Vodafone España<\u002Fstrong>: si habrá oferta, a qué precio y cómo se financiaría.<\u002Fli>\n        <li><strong>Cuarto trimestre<\u002Fstrong>: faltan ≈ 1.140 M€ de flujo de caja libre para cumplir la previsión anual.<\u002Fli>\n        <li><strong>Decisión de la CMA<\u002Fstrong> sobre nexfibre (15 de diciembre), de la que depende la caja de Virgin Media O2.<\u002Fli><\u002Ful><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= FINANZAS ================= -->\n  <section class=\"panel\" data-p=\"finanzas\">\n    <p class=\"lead\">La deuda financiera neta se reduce por tercer trimestre consecutivo y el grupo no afronta vencimientos relevantes hasta 2029. La liquidez disponible supera los 17.000 M€ y la vida media de la deuda es de 11,2 años, lo que permite atender el calendario de pagos sin depender de las condiciones de mercado a corto plazo. La ratio de deuda neta sobre EBITDAaL, de 2,63×, se mantiene por encima del objetivo de 2,5× fijado para 2028, que condiciona cualquier decisión de inversión o de adquisición.<\u002Fp>\n    <div class=\"hl\">\n      <div class=\"hl-g\"><div class=\"hl-t\">Crecimiento <span>enero–septiembre de 2026 frente al mismo periodo de 2025<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">+2,8%<\u002Fdiv><div class=\"hl-p\">Ingresos<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+4,6%<\u002Fdiv><div class=\"hl-p\">EBITDA ajustado<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+6,1%<\u002Fdiv><div class=\"hl-p\">Caja operativa<small>OpCFaL<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+21,6%<\u002Fdiv><div class=\"hl-p\">Beneficio neto<small>operaciones continuadas<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hl-g\"><div class=\"hl-t\">Cifras <span>enero–septiembre de 2026 · deuda a 30 de septiembre<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">1.333 M€<\u002Fdiv><div class=\"hl-p\">Beneficio neto<small>operaciones continuadas<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">1.963 M€<\u002Fdiv><div class=\"hl-p\">Flujo de caja libre<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">25.186 M€<\u002Fdiv><div class=\"hl-p\">Deuda financiera neta<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">2,63×<\u002Fdiv><div class=\"hl-p\">Deuda / EBITDAaL<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid2\">\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Peso de cada filial en el EBITDA<\u002Fh2><span class=\"st\">ene–sep 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card\">\n          <svg class=\"fig\" viewBox=\"0 0 520 216\" role=\"img\" aria-label=\"EBITDA ajustado de enero a septiembre de 2026 por filial: España 3.501 millones de euros, 39,6%; Brasil 3.473, 39,3%; Alemania y otros 1.872, 21,2%.\">\n            <g fill=\"none\">\n              <circle cx=\"120\" cy=\"110\" r=\"82\" stroke=\"#E8EEF7\" stroke-width=\"14\"><\u002Fcircle>\n              <circle cx=\"120\" cy=\"110\" r=\"82\" stroke=\"#0066FF\" stroke-width=\"14\" stroke-dasharray=\"204.03 515.22\" transform=\"rotate(90 120 110)\"><\u002Fcircle>\n              <circle cx=\"295\" cy=\"92\" r=\"66\" stroke=\"#E8EEF7\" stroke-width=\"12\"><\u002Fcircle>\n              <circle cx=\"295\" cy=\"92\" r=\"66\" stroke=\"#5C9BFF\" stroke-width=\"12\" stroke-dasharray= 86 en septiembre de 2026, 2,63 veces. El eje vertical empieza en 24.000 millones.\">\n            <g stroke=\"#E4E7EC\" stroke-width=\"1\">\n              <line x1=\"50\" y1=\"195\" x2=\"510\" y2=\"195\"><\u002Fline>\n              <line x1=\"50\" y1=\"145\" x2=\"510\" y2=\"145\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"95\" x2=\"510\" y2=\"95\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"45\" x2=\"510\" y2=\"45\" stroke-dasharray=\"3 4\"><\u002Fline>\n            <\u002Fg>\n            <g font-size=\"10.5\" fill=\"#98A2B3\" text-anchor=\"end\">\n              <text x=\"44\" y=\"198\">24.000<\u002Ftext><text x=\"44\" y=\"148\">25.000<\u002Ftext><text x=\"44\" y=\"98\">26.000<\u002Ftext><text x=\"44\" y=\"48\">27.000<\u002Ftext>\n            <\u002Fg>\n            <path d=\"M88,195V58.80Q88,53.80 93,53.80H127Q132,53.80 132,58.80V195Z\" fill=\"#0066FF\"><\u002Fpath>\n            <text x=\"110\" y=\"46.40\" font-size=\"11.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"middle\">26.824 M€<\u002Ftext>\n            <text x=\"110\" y=\"72.80\" font-size=\"11\" font-weight=\"600\" fill=\"#FFFFFF\" text-anchor=\"middle\">2,78×<\u002Ftext>\n            <path d=\"M208,195V132.90Q208,127.90 213,127.90H247Q252,127.90 252,132.90V195Z\" fill=\"#0066FF\"><\u002Fpath>\n            <text x=\"230\" y=\"120.50\" font-size=\"11.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"middle\">25.342 M€<\u002Ftext>\n            <text x=\"230\" y=\"146.90\" font-size=\"11\" font-weight=\"600\" fill=\"#FFFFFF\" text-anchor=\"middle\">2,72×<\u002Ftext>\n            <path d=\"M328,195V136.10Q328,131.10 333,131.10H367Q372,131.10 372,136.10V195Z\" fill=\"#0066FF\"><\u002Fpath>\n            <text x=\"350\" y=\"123.70\" font-size=\"11.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"middle\">25.278 M€<\u002Ftext>\n            <text x=\"350\" y=\"150.10\" font-size=\"11\" font-weight=\"600\" fill=\"#FFFFFF\" text-anchor=\"middle\">2,68×<\u002Ftext>\n            <path d=\"M448,195V140.70Q448,135.70 453,135.70H487Q492,135.70 492,140.70V195Z\" fill=\"#00358A\"><\u002Fpath>\n            <text x=\"470\" y=\"128.30\" font-size=\"11.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"middle\">25.186 M€<\u002Ftext>\n            <text x=\"470\" y=\"154.70\" font-size=\"11\" font-weight=\"600\" fill=\"#FFFFFF\" text-anchor=\"middle\">2,63×<\u002Ftext>\n            <g font-size=\"11\" fill=\"#475467\" text-anchor=\"middle\"><text x=\"110\" y=\"211\">dic 2025<\u002Ftext><text x=\"230\" y=\"211\">mar 2026<\u002Ftext><text x=\"350\" y=\"211\">jun 2026<\u002Ftext><text x=\"470\" y=\"211\">sep 2026<\u002Ftext><\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cap\">España y Brasil aportan casi el 80% de los 8.846 M€ de EBITDA ajustado, a partes iguales; la parte de Alemania y otros se obtiene por diferencia, porque Alemania no ha publicado su cifra de nueve meses. <strong>La deuda ha bajado 1.638 M€ en nueve meses<\u002Fstrong>, la mayor reducción en ese periodo desde 2021. El plan prevé reducir la deuda neta a 2,5 veces el EBITDAaL en 2028.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Principales magnitudes del grupo<\u002Fh2><span class=\"st\">millones de euros<\u002Fspan><\u002Fdiv>\n    <p class=\"prose\" style=\"margin:0 0 14px;\">«Var. Q3» compara el Q3 2026 con el Q3 2025, y «Var. ene–sep», el acumulado de enero a septiembre de 2026 con el mismo periodo de 2025; FY 2025 es el ejercicio completo y la previsión, la guía de la compañía para 2026.<\u002Fp>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Magnitud<\u002Fth><th class=\"num\">Q3 2026<\u002Fth><th class=\"num\">Var. Q3<\u002Fth><th class=\"num\">Ene–sep 2026<\u002Fth><th class=\"num\">Var. ene–sep<\u002Fth><th class=\"num\">FY 2025<\u002Fth><th>Previsión 2026<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Ingresos<\u002Ftd><td class=\"num\">8.433<\u002Ftd><td class=\"num up\">+4,8%<\u002Ftd><td class=\"num\">24.825<\u002Ftd><td class=\"num up\">+2,8%<\u002Ftd><td class=\"num\">35.120<\u002Ftd><td class=\"soft\">+1% a +1,5% (tipo constante)<\u002Ftd><\u002Ftr>\n          <tr><td>EBITDA ajustado<\u002Ftd><td class=\"num\">3.078<\u002Ftd><td class=\"num up\">+6,2%<\u002Ftd><td class=\"num\">8.846<\u002Ftd><td class=\"num up\">+4,6%<\u002Ftd><td class=\"num\">11.918<\u002Ftd><td class=\"soft\">Ligeramente por encima del +2,5% (tipo constante)<\u002Ftd><\u002Ftr>\n          <tr><td>Inversión (CapEx sin espectro)<\u002Ftd><td class=\"num\">1.097<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">3.005<\u002Ftd><td class=\"num soft\">+1,3%<\u002Ftd><td class=\"num\">4.340<\u002Ftd><td class=\"soft\">≈ 12% de los ingresos<\u002Ftd><\u002Ftr>\n          <tr><td>Caja operativa tras arrendamientos <span class=\"soft\">(OpCFaL)<\u002Fspan><\u002Ftd><td class=\"num\">1.364<\u002Ftd><td class=\"num up\">+10,6%<\u002Ftd><td class=\"num\">4.018<\u002Ftd><td class=\"num up\">+6,1%<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"soft\">Más del +3,5% (tipo constante)<\u002Ftd><\u002Ftr>\n          <tr><td>Beneficio neto de operaciones continuadas<\u002Ftd><td class=\"num\">860<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">1.333<\u002Ftd><td class=\"num up\">+21,6%<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"soft\">—<\u002Ftd><\u002Ftr>\n          <tr><td>Beneficio neto atribuido<\u002Ftd><td class=\"num\">802<\u002Ftd><td class=\"num up\">+191,1%<\u002Ftd><td class=\"num\">464<\u002Ftd><td class=\"num soft\">−1.080 en 2025<\u002Ftd><td class=\"num dn\">−4.318<\u002Ftd><td class=\"soft\">—<\u002Ftd><\u002Ftr>\n          <tr><td>Flujo de caja libre<\u002Ftd><td class=\"num\">1.018<\u002Ftd><td class=\"num up\">+220,1%<\u002Ftd><td class=\"num\">1.963<\u002Ftd><td class=\"num up\">+10,7%<\u002Ftd><td class=\"num\">≈ 2.900<\u002Ftd><td class=\"soft\">≈ 3.100<\u002Ftd><\u002Ftr>\n          <tr><td>Deuda financiera neta <span class=\"soft\">(fin de periodo)<\u002Fspan><\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">25.186<\u002Ftd><td class=\"num up\">−10,8%<\u002Ftd><td class=\"num\">26.824<\u002Ftd><td class=\"soft\">2,5× EBITDAaL en 2028<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= MERCADO ================= -->\n  <section class=\"panel\" data-p=\"mercado\">\n    <p class=\"lead\">Telefónica cotiza en la Bolsa de Madrid y cuenta con tres accionistas de referencia, con en torno al 10% del capital cada uno: el Estado, a través de la SEPI, CriteriaCaixa y STC. Dos de ellos tienen carácter público o semipúblico, por lo que las decisiones de capital de mayor alcance, como una ampliación o una adquisición en España, dependen tanto del consejo como de la posición de estos accionistas. El mercado ha recibido los resultados con cautela y ha dado más peso a la rebaja de la previsión de ingresos que a la mejora de la caja.<\u002Fp>\n\n    <div class=\"grid2\">\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Accionistas de referencia<\u002Fh2><span class=\"st\">% del capital · julio de 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card dark\">\n          <svg class=\"fig\" viewBox=\"0 0 520 206\" role=\"img\" aria-label=\"Accionistas de referencia de Telefónica en julio de 2026: SEPI 10%, CriteriaCaixa 10%, STC 10%, BBVA 1,97%; el resto, en torno al 68%, incluye a BlackRock.\">\n            <defs>\n              <radialGradient id=\"acc-sph\" cx=\"34%\" cy=\"28%\" r=\"78%\"><stop offset=\"0\" stop-color=\"#D9E9FF\"><\u002Fstop><stop offset=\".12\" stop-color=\"#86B5FF\"><\u002Fstop><stop offset=\".38\" stop-color=\"#3A7CF6\"><\u002Fstop><stop offset=\".68\" stop-color=\"#1A54DA\"><\u002Fstop><stop offset=\".88\" stop-color=\"#1440B0\"><\u002Fstop><st -weight=\"600\" fill=\"#FFFFFF\">1,97%<\u002Ftext><text x=\"440\" y=\"198\" font-size=\"11.5\" fill=\"#C4CDE0\">BBVA<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n          <p class=\"fig-cap\">El resto (≈ 68%) cotiza en bolsa; incluye a BlackRock, con un 3%–6% según la prensa. La superficie de cada esfera es proporcional a su participación.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Cotización<\u002Fh2><span class=\"st\">€ por acción · últimos doce meses<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card dark cot-card\"><div class=\"cot-price\">3,43 €<\u002Fdiv>\n          <svg class=\"fig\" viewBox=\"0 0 520 240\" role=\"img\" aria-label=\"Cotización de Telefónica en los últimos doce meses, trayectoria aproximada: máximo de 52 semanas 4,123 euros, mínimo 3,131 euros y 3,43 euros el 12 de noviembre. Precio objetivo de JPMorgan 3,20 euros, antes 3,70.\">\n            <defs><linearGradient id=\"cot-area\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3A7CF6\" stop-opacity=\".32\"><\u002Fstop><stop offset=\"1\" stop-color=\"#3A7CF6\" stop-opacity=\"0\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n            <line x1=\"22\" y1=\"106.1\" x2=\"368\" y2=\"106.1\" stroke=\"#7FD6CE\" stroke-opacity=\".45\" stroke-width=\"1\" stroke-dasharray=\"4 4\"><\u002Fline>\n            <line x1=\"22\" y1=\"182.2\" x2=\"368\" y2=\"182.2\" stroke=\"#7FD6CE\" stroke-width=\"1.8\"><\u002Fline>\n            <path d=\"M22,205.0 L22.0,139.6 L28.6,110.0 L35.1,100.8 L41.7,110.7 L48.2,104.0 L54.8,148.7 L61.3,144.9 L67.9,139.4 L74.5,149.0 L81.0,161.3 L87.6,156.3 L94.1,149.5 L100.7,118.4 L107.2,110.5 L113.8,124.5 L120.3,83.3 L126.9,110.5 L133.5,123.0 L140.0,124.7 L146.6,110.3 L153.1,82.7 L159.7,84.3 L166.2,80.7 L172.8,79.3 L179.4,82.0 L185.9,79.2 L192.5,69.0 L199.0,41.7 L205.6,69.9 L212.1,78.4 L218.7,68.8 L225.3,107.2 L231.8,113.5 L238.4,128.9 L244.9,132.6 L251.5,118.6 L >3,20 €<\u002Ftspan><\u002Ftext>\n            <text x=\"37.9\" y=\"226\" font-size=\"10\" fill=\"#8D98B0\" text-anchor=\"middle\">dic<\u002Ftext>\n            <text x=\"96.0\" y=\"226\" font-size=\"10\" fill=\"#8D98B0\" text-anchor=\"middle\">feb<\u002Ftext>\n            <text x=\"151.3\" y=\"226\" font-size=\"10\" fill=\"#8D98B0\" text-anchor=\"middle\">abr<\u002Ftext>\n            <text x=\"208.4\" y=\"226\" font-size=\"10\" fill=\"#8D98B0\" text-anchor=\"middle\">jun<\u002Ftext>\n            <text x=\"265.5\" y=\"226\" font-size=\"10\" fill=\"#8D98B0\" text-anchor=\"middle\">ago<\u002Ftext>\n            <text x=\"322.7\" y=\"226\" font-size=\"10\" fill=\"#8D98B0\" text-anchor=\"middle\">oct<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Hechos relevantes<\u002Fh2><span class=\"st\">movimientos que afectan al grupo<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Hecho<\u002Fth><th class=\"num\">Fecha<\u002Fth><th>Efecto<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Resultados de enero a septiembre y revisión de previsiones<\u002Ftd><td class=\"num\">12 nov 2026<\u002Ftd><td class=\"soft\">Suben las previsiones de EBITDA, caja operativa y flujo de caja libre (≈ 3.100 M€) y baja la de ingresos (+1% a +1,5%). La acción cede un 1,9% a media mañana. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>El Banco Central de Brasil mantiene el tipo de interés en el 13,75%<\u002Ftd><td class=\"num\">4 nov 2026<\u002Ftd><td class=\"soft\">Interrumpe cinco bajadas seguidas. El dólar se ha apreciado un 9% frente al real desde las elecciones. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Virgin Media O2 anuncia un plan de ahorro de ≈ 800 M£ anuales en 2029<\u002Ftd><td class=\"num\">3 nov 2026<\u002Ftd><td class=\"soft\">Revisa el reparto de 2026 a sus socios, Telefónica y Liberty Global, e informará en el primer trimestre de 2027. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>JPMorgan rebaja Telefónica a infraponderar, con precio objetivo de 3,20 €<\u002Ftd><td class=\"num\">26 oct 2026<\u002Ftd><td class=\"soft\">Cita la deuda, incluida la de Virgin Media O2 (6 veces el EBITDA y bonos con rentabilidad superior al 15%), el peso de los arrendamientos y el riesgo de una ampliación de capital para consolidar. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Reelección de Lula en Brasil<\u002Ftd><td class=\"num\">25 oct 2026<\u002Ftd><td class=\"soft\">El dólar se aprecia un 8,36% frente al real al día siguiente y Telefónica cae un 6,41%, hasta 3,198 €. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Berenberg ve improbable la compra de Vodafone España<\u002Ftd><td class=\"num\">5 oct 2026<\u002Ftd><td class=\"soft\">La cuota conjunta, del 46–47% en móvil y banda ancha, sería difícil de aceptar en Bruselas sin concesiones amplias. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Fitch confirma el BBB con perspectiva estable<\u002Ftd><td class=\"num\">2 oct 2026<\u002Ftd><td class=\"soft\">Destaca España y Brasil, el recorte del dividendo y prevé un apalancamiento inferior a 2,7 veces en 2028, según su métrica. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Reorganización de Telefónica España en B2B, B2C y Mayorista<\u002Ftd><td class=\"num\">30 sep 2026<\u002Ftd><td class=\"soft\">Integra Telefónica Tech y traslada funciones de soporte al corporativo. <strong>Favorable a medio plazo.<\u002Fstrong><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= RIESGOS ================= -->\n  <section class=\"panel\" data-p=\"riesgos\">\n    <p class=\"lead\">Los principales riesgos del grupo son financieros y de tipo de cambio, y las oportunidades proceden de la simplificación del perímetro y de la eficiencia. Los riesgos más inmediatos, la evolución del real y la reacción del mercado, son ajenos a la gestión. Los que dependen de la dirección se concentran en las decisiones de capital: el precio de una eventual consolidación y su financiación sin comprometer el objetivo de deuda ni diluir al accionista.<\u002Fp>\n    <div class=\"cards3 roblk\">\n      <div class=\"card roc\"><h3>Riesgos<\u002Fh3><ul class=\"rol\">\n        <li><b>Real brasileño.<\u002Fb> Con el 39% del EBITDA en Brasil, una depreciación sostenida reduce ingresos, EBITDA y dividendos en euros.<\u002Fli>\n        <li><b>Ingresos.<\u002Fb> La previsión de crecimiento se ha rebajado a +1%–1,5%: el EBITDA crece más por ahorro de costes que por aumento de los ingresos.<\u002Fli>\n        <li><b>Deuda de las participadas.<\u002Fb> Virgin Media O2 y UGG no consolidan su deuda, pero un deterioro de su situación financiera podría requerir aportaciones de Telefónica.<\u002Fli>\n        <li><b>Ampliación de capital.<\u002Fb> Una compra relevante en España podría financiarse en parte con acciones nuevas.<\u002Fli>\n        <li><b>Regulación.<\u002Fb> La Comisión Europea puede bloquear o condicionar una consolidación del mercado español, y la autoridad británica de competencia (CMA), la operación de nexfibre en el Reino Unido.<\u002Fli><\u002Ful><\u002Fdiv>\n      <div class=\"card roc\"><h3>Oportunidades<\u002Fh3><ul class=\"rol\">\n        <li><b>Ahorro de costes.<\u002Fb> Hasta 2.300 M€ de ahorro bruto anual en 2028 y 3.000 M€ en 2030.<\u002Fli>\n        <li><b>Ventas de activos.<\u002Fb> México (450 M$), Telxius (≈ 1.200 M€ de valoración objetivo) y Venezuela.<\u002Fli>\n        <li><b>Valoración con descuento.<\u002Fb> Un PER de 7,2 veces el beneficio estimado de 2028, frente a unas 9 veces del sector, ofrece recorrido si la deuda se reduce según lo previsto.<\u002Fli>\n        <li><b>Consolidación.<\u002Fb> Un mercado de tres operadores en España o Alemania mejoraría precios y márgenes.<\u002Fli><\u002Ful><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CALENDARIO Y FUENTES ================= -->\n  <section class=\"panel\" data-p=\"acciones\">\n    <p class=\"lead\">Publicados los resultados del 12 de noviembre, las próximas citas son la decisión de la CMA sobre nexfibre y el cierre del año.<\u002Fp>\n    <div class=\"rail\">\n      <div class=\"stop t-mid\"><span class=\"when\">8–9 de diciembre<\u002Fspan><h4>Banco Central de Brasil<\u002Fh4><p>Próxima decisión sobre el tipo de interés, hoy en el 13,75%.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-hot\"><span class=\"when\">15 de diciembre<\u002Fspan><h4>Decisión de la CMA sobre nexfibre<\u002Fh4><p>De ella dependen ≈ 1.100 M£ de caja para Virgin Media O2. nexfibre no ha ofrecido compromisos.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-hot\"><span class=\"when\">Febrero 2027<\u002Fspan><h4>Resultados anuales 2026<\u002Fh4><p>Cumplimiento del flujo de caja libre de ≈ 3.100 M€.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-mid\"><span class=\"when\">Primer trimestre de 2027<\u002Fspan><h4>Reparto de Virgin Media O2<\u002Fh4><p>Decisión sobre el pago de 2026 a sus socios.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">Junio 2027<\u002Fspan><h4>Pago del dividendo<\u002Fh4><p>0,15 € por acción con cargo a 2026.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">2028<\u002Fspan><h4>Objetivos del plan<\u002Fh4><p>Apalancamiento de 2,5× y hasta 2.300 M€ de ahorro bruto anual.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Fuentes<\u002Fh2><span class=\"st\">información pública consultada el 12 de noviembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"listbox refs\">\n      <ol>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/es/sala-comunicacion/prensa/telefonica-obtiene-bene

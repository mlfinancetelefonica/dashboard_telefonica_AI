y=\"104\">Vivo<\u002Ftext><text x=\"0\" y=\"148\">NIO<\u002Ftext>\n            <\u002Fg>\n            <rect x=\"0\" y=\"24\" width=\"355.2\" height=\"18\" rx=\"6\" fill=\"#C4CCD4\"><\u002Frect>\n            <text x=\"363.2\" y=\"38\" font-size=\"12\" font-weight=\"600\" fill=\"#101828\">59,2%<\u002Ftext>\n            <rect x=\"0\" y=\"68\" width=\"117\" height=\"18\" rx=\"6\" fill=\"#8B98A5\"><\u002Frect>\n            <text x=\"125\" y=\"82\" font-size=\"12\" font-weight=\"600\" fill=\"#101828\">19,5%<\u002Ftext>\n            <rect x=\"0\" y=\"112\" width=\"90.6\" height=\"18\" rx=\"6\" fill=\"#0066FF\"><\u002Frect>\n            <text x=\"98.6\" y=\"126\" font-size=\"12\" font-weight=\"600\" fill=\"#101828\">15,1%<\u002Ftext>\n            <rect x=\"0\" y=\"156\" width=\"37.2\" height=\"18\" rx=\"6\" fill=\"#8B98A5\"><\u002Frect>\n            <text x=\"45.2\" y=\"170\" font-size=\"12\" font-weight=\"600\" fill=\"#101828\">6,2%<\u002Ftext>\n            <text x=\"0\" y=\"196\" font-size=\"11\" fill=\"#98A2B3\">55,4 millones de accesos, más del 80% de fibra. «Otros», por diferencia.<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cap\">Datos del informe de competencia de Anatel (el regulador) del segundo trimestre de 2026. <strong>Vivo lidera en móvil y es segundo entre los grandes en fijo<\u002Fstrong>; en fijo, su estrategia es convertir a clientes móviles en clientes convergentes, más que competir en precio con los proveedores regionales.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Base de clientes<\u002Fh2><span class=\"st\">30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Servicio<\u002Fth><th class=\"num\">Accesos<\u002Fth><th class=\"num\">Var. interanual<\u002Fth><th>Detalle<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Accesos totales<\u002Ftd><td class=\"num\">120,2 M<\u002Ftd><td class=\"num up\">+3,0%<\u002Ftd><td class=\"soft\">118,8 millones en junio<\u002Ftd><\u002Ftr>\n          <tr><td>Móvil total<\u002Ftd><td class=\"num\">106,4 M<\u002Ftd><td class=\"num up\">+3,4%<\u002Ftd><td class=\"soft\">5G en 1.012 municipios, el 73% de la población<\u002Ftd><\u002Ftr>\n          <tr><td>Móvil de contrato<\u002Ftd><td class=\"num\">74,7 M<\u002Ftd><td class=\"num up\">+7,1%<\u002Ftd><td class=\"soft\">Bajas del 1,0% mensual; ingreso medio de R$ 53,80 (+0,6%)<\u002Ftd><\u002Ftr>\n          <tr><td>Prepago<\u002Ftd><td class=\"num\">31,7 M<\u002Ftd><td class=\"num dn\">−4,5%<\u002Ftd><td class=\"soft\">Bajas del 3,3% mensual, frente al 3,9% anterior<\u002Ftd><\u002Ftr>\n          <tr><td>Hogares pasados con fibra<\u002Ftd><td class=\"num\">32,4 M<\u002Ftd><td class=\"num up\">+6,4%<\u002Ftd><td class=\"soft\">32,0 millones en junio<\u002Ftd><\u002Ftr>\n          <tr><td>Hogares conectados a fibra<\u002Ftd><td class=\"num\">8,4 M<\u002Ftd><td class=\"num up\">+10,8%<\u002Ftd><td class=\"soft\">Penetración del 26%; bajas del 1,4% mensual<\u002Ftd><\u002Ftr>\n          <tr><td>Clientes convergentes (Vivo Total)<\u002Ftd><td class=\"num\">4,0 M<\u002Ftd><td class=\"num up\">+28%<\u002Ftd><td class=\"soft\">Fibra y móvil en un mismo paquete<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Entorno económico, competitivo y regulatorio<\u002Fh2><span class=\"st\">movimientos relevantes para la compañía<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Hecho<\u002Fth><th class=\"num\">Fecha<\u002Fth><th>Efecto<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Resultados del tercer trimestre: el beneficio sube un 30,1%, hasta R$ 2.456 M<\u002Ftd><td class=\"num\">10 nov 2026<\u002Ftd><td class=\"soft\">Ingresos +7,2% y EBITDA +10%. El beneficio incluye R$ 366 M por la venta de cobre y otros activos; los analistas esperaban R$ 2.140 M. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Conversaciones preliminares para comprar Vero, proveedor regional de fibra<\u002Ftd><td class=\"num\">nov 2026<\u002Ftd><td class=\"soft\">Reforzaría la banda ancha fija, donde Vivo tiene menos cuota. Sin acuerdo ni precio. <strong>Pendiente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>El Banco Central mantiene el tipo de interés oficial (Selic) en el 13,75%<\u002Ftd><td class=\"num\">4 nov 2026<\u002Ftd><td class=\"soft\">Decisión unánime que interrumpe cinco bajadas seguidas y eleva las previsiones de inflación. Tipos altos frenan el consumo y el crédito. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Lula gana la segunda vuelta de las elecciones presidenciales (51,79% frente al 48,21% de Flávio Bolsonaro)<\u002Ftd><td class=\"num\">25 oct 2026<\u002Ftd><td class=\"soft\">Al día siguiente, el dólar se aprecia un 8,36% frente al real, hasta R$ 5,406; la bolsa cae un 13,88%, con suspensión temporal de la sesión (circuit breaker), y los tipos de interés futuros suben unos 2 puntos. El 9 de noviembre el dólar estaba en R$ 5,51. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Anatel: Vivo estabiliza su cuota móvil; TIM sigue perdiendo<\u002Ftd><td class=\"num\">15 jul 2026<\u002Ftd><td class=\"soft\">Vivo, con 1,02 millones de altas netas, lidera el trimestre; Claro suma más de 2,2 millones en el semestre. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Reforma tributaria: entrada de CBS e IBS<\u002Ftd><td class=\"num\">2027<\u002Ftd><td class=\"soft\">Sustituyen de forma gradual a los impuestos actuales hasta 2033. El sector espera recuperar más impuestos pagados en sus compras, con complejidad operativa durante la transición. <strong>Favorable a medio plazo.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>El Supremo aplaza sin fecha el juicio sobre las tasas del Fistel<\u002Ftd><td class=\"num\">may 2026<\u002Ftd><td class=\"soft\">Recurso de los operadores (ADI 7787) contra el importe de las tasas. Vivo tiene R$ 7.500 M sin pagar de 2020 a 2026. <strong>Pendiente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Vivo compra el 100% de FiBrasil, la red neutra de fibra<\u002Ftd><td class=\"num\">18 may 2026<\u002Ftd><td class=\"soft\">El 24,99% restante, a Telefónica Infra, por R$ 458,7 M, tras comprar el 50% a CDPQ por R$ 858 M en noviembre de 2025. FiBrasil cubre 4,6 millones de hogares en 151 ciudades y deja de ser una participada separada del grupo. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Devolución de capital de R$ 4.000 M (R$ 1,25 por acción)<\u002Ftd><td class=\"num\">mar 2026<\u002Ftd><td class=\"soft\">Parte de los R$ 6.990 M pagados a los accionistas en 2026. <strong>Favorable para Telefónica.<\u002Fstrong><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= RIESGOS ================= -->\n  <section class=\"panel\" data-p=\"riesgos\">\n    <p class=\"lead\">El perfil de riesgo operativo de Vivo es bajo y el más favorable del grupo. Su exposición se concentra en variables que la compañía no controla: la política económica del nuevo mandato, el litigio del Fistel y, sobre todo, el tipo de cambio, que determina el valor en euros de su crecimiento y que en un trimestre puede tener un efecto mayor que la propia operación.<\u002Fp>\n\n    <div class=\"cards3 roblk\">\n      <div class=\"card roc\">\n        <h3>Riesgos<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Depreciación del real.<\u002Fb> Se ha producido tras las elecciones: reduce el valor en euros de los ingresos, del EBITDA y de los dividendos que recibe Telefónica, sin que cambie el negocio. En un escenario de caída del 10%, el EBITDA del grupo bajaría cerca de un 4%.<\u002Fli>\n          <li><b>Política fiscal y tipos altos.<\u002Fb> El banco central ha dejado de bajar los tipos, en el 13,75%; las dudas sobre el gasto público pueden mantener alta la inflación y frenar el consumo.<\u002Fli>\n          <li><b>Fallo desfavorable del Fistel.<\u002Fb> Obligaría a pagar hasta R$ 7.500 M, unas tres veces la caja neta sin arrendamientos.<\u002Fli>\n          <li><b>Competencia en fijo.<\u002Fb> Los proveedores regionales compiten en precio y suman cerca del 60% del mercado.<\u002Fli>\n          <li><b>Transición tributaria.<\u002Fb> Dos sistemas fiscales conviviendo desde 2027, con reglas pendientes de cerrar, como la devolución de impuestos a clientes de renta baja en prepago.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card roc\">\n        <h3>Oportunidades<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Convergencia.<\u002Fb> 4,0 millones de clientes Vivo Total frente a 74,7 millones de líneas de contrato: amplio margen para vender fibra a la base móvil.<\u002Fli>\n          <li><b>Fibra.<\u002Fb> Solo el 26% de los hogares pasados está conectado; cada nuevo cliente aprovecha una red ya construida.<\u002Fli>\n          <li><b>Nuevos negocios digitales.<\u002Fb> Crecen un 19,4% en doce meses y ya son el 12% de los ingresos, según Telefónica.<\u002Fli>\n          <li><b>Vuelta a las bajadas de tipos.<\u002Fb> Si la Selic retoma los recortes, favorecería el consumo y el valor en bolsa de las compañías con flujos estables.<\u002Fli>\n          <li><b>Reforma tributaria.<\u002Fb> Si se cumple lo previsto, el sector pagará menos impuestos no recuperables.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CALENDARIO Y FUENTES ================= -->\n  <section class=\"panel\" data-p=\"acciones\">\n    <p class=\"lead\">El calendario de los próximos meses está dominado por citas externas a la compañía: el Banco Central, tras el impacto electoral, y el Supremo.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Calendario de hitos<\u002Fh2><span class=\"st\">próximos doce meses<\u002Fspan><\u002Fdiv>\n    <div class=\"rail\">\n      <div class=\"stop t-mid\"><span class=\"when\">8–9 de diciembre<\u002Fspan><h4>Reunión del Banco Central<\u002Fh4><p>Decisión sobre la Selic, hoy en el 13,75% tras la pausa del 4 de noviembre.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">15 de diciembre<\u002Fspan><h4>Pago a los accionistas<\u002Fh4><p>R$ 325 M en intereses sobre capital propio.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-hot\"><span class=\"when\">Sin fecha<\u002Fspan><h4>Juicio del Fistel en el Supremo<\u002Fh4><p>Aplazado dos veces en mayo de 2026; R$ 7.500 M en juego para Vivo.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">Enero 2027<\u002Fspan><h4>Entrada de CBS e IBS<\u002Fh4><p>Comienza la fase principal de la reforma tributaria, con transición hasta 2033.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">Febrero 2027<\u002Fspan><h4>Resultados anuales y fin del programa de recompra<\u002Fh4><p>Hasta R$ 1.000 M en acciones propias, todavía sin utilizar.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">Hasta el 30 de abril de 2027<\u002Fspan><h4>Pago de los intereses declarados en 2026<\u002Fh4><p>R$ 3.195 M en intereses sobre capital propio.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Fuentes<\u002Fh2><span class=\"st\">información pública consultada el 12 de noviembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"listbox refs\">\n      <ol>\n        <li><span class=\"who\">Teletime.<\u002Fspan> <a href=\"https://teletime.com.br/10/11/2026/vivo-terceiro-trimestre-16-bilhoes/\" target=\"_blank\" rel=\"noreferrer\">Vivo ingresa R$ 16.000 M en el tercer trimestre<\u002Fa>. 10 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Exame.<\u002Fspan> <a href=\"https://exame.com/invest/mercados/vivo-lucra-30-mais-no-3o-tri-e-ganha-ate-com-a-rede-de-cobre-que-esta-desligando/\" target=\"_blank\" rel=\"noreferrer\">Vivo gana un 30% más en el tercer trimestre<\u002Fa>. 10 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">TI Inside.<\u002Fspan> <a href=\"https://tiinside.com.br/10/11/2026/lucro-da-vivo-cresce-301-e-alcanca-r-25-bilhoes-no-3o-trimestre/\" target=\"_blank\" rel=\"noreferrer\">El beneficio de Vivo crece un 30,1%<\u002Fa>. 10 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">IPNews.<\u002Fspan> <a href=\"https://ipnews.com.br/vivo-registra-lucro-liquido-de-r-25-bilhoes-no-3t26-alta-de-301/\" target=\"_blank\" rel=\"noreferrer\">Vivo registra un beneficio de R$ 2.500 M en el tercer trimestre<\u002Fa>. 10 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">The Motley Fool.<\u002Fspan> <a href=\"https://www.fool.com/earnings/call-transcripts/2026/11/11/telefonica-viv-q3-2026-earnings-call-transcript/\" target=\"_blank\" rel=\"noreferrer\">Transcripción de la conferencia de resultados del tercer trimestre<\u002Fa>. 11 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Capital Madrid.<\u002Fspan> <a href=\"https://www.capitalmadrid.com/2026/11/11/72750/telefonica-brasil-gana-un-23-3-mas-hasta-septiembre-hasta-852-millones.html\" target=\"_blank\" rel=\"noreferrer\">Telefónica Brasil gana un 23,3% más hasta septiembre<\u002Fa>. 11 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/es/sala-comunicacion/prensa/telefonica-obtiene-beneficio-neto-1-333-millones-euros-operaciones-continuadas-hasta-septiembre-216-revisa-al-alza-objetivos-ebitda-ajustado-opcfal-ajustado-flujo/\" target=\"_blank\" rel=\"noreferrer\">Resultados de enero a septiembre de 2026 del grupo<\u002Fa>. 12 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Gazeta Mercantil.<\u002Fspan> <a href=\"https://gazetamercantil.com/copom-mantem-selic-1375-novembro-2026\" target=\"_blank\" rel=\"noreferrer\">El Copom mantiene la Selic en el 13,75%<\u002Fa>. 4 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Remessa Online.<\u002Fspan> <a href=\"https://www.remessaonline.com.br/blog/ata-do-copom-novembro-2026/\" target=\"_blank\" rel=\"noreferrer\">Acta del Copom de noviembre y tipo de cambio<\u002Fa>. 10 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefônica Brasil.<\u002Fspan> <a href=\"https://api.mziq.com/mzfilemanager/v2/d/24165f81-24d6-4648-bf9f-66712905d5a2/a5722e85-0af4-69bb-d2b6-ca7775f2839f?origin=2\" target=\"_blank\" rel=\"noreferrer\">Resultados del segundo trimestre de 2026<\u002Fa>. 27 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefônica Brasil.<\u002Fspan> <a href=\"https://ri.telefonica.com.br/en/the-company/corporate-structure/\" target=\"_blank\" rel=\"noreferrer\">Estructura accionarial<\u002Fa>. 3 de agosto de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/06/rdos26t2-eng.pdf\" target=\"_blank\" rel=\"noreferrer\">Informe de resultados de enero a junio de 2026<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/04/rdos26t1-eng.pdf\" target=\"_blank\" rel=\"noreferrer\">Informe de resultados de enero a marzo de 2026<\u002Fa>. Mayo de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/01/rdos25t4-eng.pdf\" target=\"_blank\" rel=\"noreferrer\">Informe de resultados de 2025<\u002Fa>. Febrero de 2026.<\u002Fli>\n        <li><span class=\"who\">Teletime.<\u002Fspan> <a href=\"https://teletime.com.br/27/07/2026/vivo-segundo-trimestre/\" target=\"_blank\" rel=\"noreferrer\">Vivo gana R$ 1.570 M en el segundo trimestre<\u002Fa>. 27 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Minha Operadora.<\u002Fspan> <a href=\"https://www.minhaoperadora.com.br/2026/07/vivo-resultados-2t26.html\" target=\"_blank\" rel=\"noreferrer\">Resultados de Vivo del segundo trimestre de 2026<\u002Fa>. Julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Nord Investimentos.<\u002Fspan> <a href=\"https://www.nordinvestimentos.com.br/blog/telefonica-brasil-vivt3-resultados-1t26/\" target=\"_blank\" rel=\"noreferrer\">Resultados de Telefônica Brasil del primer trimestre de 2026<\u002Fa>. Mayo de 2026.<\u002Fli>\n        <li><span class=\"who\">Anatel.<\u002Fspan> <a href=\"https://www.gov.br/anatel/pt-br/assuntos/noticias/anatel-divulga-relatorio-de-monitoramento-da-competicao-do-segundo-trimestre-de-2026\" target=\"_blank\" rel=\"noreferrer\">Informe de seguimiento de la competencia del segundo trimestre de 2026<\u002Fa>. 15 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Teletime.<\u002Fspan> <a href=\"https://teletime.com.br/15/07/2026/anatel-mudanca-oligopolio-movel/\" target=\"_blank\" rel=\"noreferrer\">Cambios en el reparto del mercado móvil<\u002Fa>. 15 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Teletime.<\u002Fspan> <a href=\"https://teletime.com.br/20/05/2026/stf-retira-processo-das-taxas-do-fistel-da-pauta-de-julgamento/\" target=\"_blank\" rel=\"noreferrer\">El Supremo retira del orden del día el juicio sobre las tasas del Fistel<\u002Fa>. 20 de mayo de 2026.<\u002Fli>\n        <li><span class=\"who\">Teletime.<\u002Fspan> <a href=\"https://teletime.com.br/24/09/2026/telecom-se-prepara-para-fase-critica-da-reforma-tributaria-em-2027/\" target=\"_blank\" rel=\"noreferrer\">Las telecomunicaciones ante la fase crítica de la reforma tributaria<\u002Fa>. 24 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">TeleSíntese.<\u002Fspan> <a href=\"https://telesintese.com.br/telefonica-conclui-compra-fatia-restante-da-fibrasil-por-milhoes/\" target=\"_blank\" rel=\"noreferrer\">Telefônica completa la compra de FiBrasil por R$ 458,7 M<\u002Fa>. 18 de mayo de 2026.<\u002Fli>\n        <li><span class=\"who\">ADVFN.<\u002Fspan> <a href=\"https://br.advfn.com/jornal/2026/03/telefonica-brasil-aprova-reducao-de-capital-de-r-4-bilhoes-com-restituicao-de-r-1-25-por-acao-aos-acionistas\" target=\"_blank\" rel=\"noreferrer\">Devolución de capital de R$ 4.000 M<\u002Fa>. Marzo de 2026.<\u002Fli>\n        <li><span class=\"who\">Banco do Brasil, InvesTalk.<\u002Fspan> <a href=\"https://investalk.bb.com.br/noticias/economia/copom-setembro-2026\" target=\"_blank\" rel=\"noreferrer\">El Copom reduce la Selic al 13,75%<\u002Fa>. 16 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">InfoMoney.<\u002Fspan> <a href=\"https://www.infomoney.com.br/mercados/banco-central-divulga-calendario-das-reunioes-do-copom-para-2026/\" target=\"_blank\" rel=\"noreferrer\">Calendario de reuniones del Copom en 2026<\u002Fa>.<\u002Fli>\n        <li><span class=\"who\">TRE-SP.<\u002Fspan> <a href=\"https://www.tre-sp.jus.br/comunicacao/noticias/2026/Outubro/eleicoes-2026-lula-e-reeleito-presidente-da-republica-confira-resultado-do-2o-turno-em-sp\" target=\"_blank\" rel=\"noreferrer\">Lula, reelegido: resultado de la segunda vuelta<\u002Fa>. 25 de octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">CNN Brasil.<\u002Fspan> <a href=\"https://www.cnnbrasil.com.br/economia/money/mercado/mercado-financeiro-ibovespa-dolar-26-outubro-2026/\" target=\"_blank\" rel=\"noreferrer\">El dólar sube un 8% y la bolsa sufre su mayor caída desde la pandemia<\u002Fa>. 26 de octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">XTB.<\u002Fspan> <a href=\"https://www.xtb.com/es/analisis-de-mercado/las-acciones-de-telefonica-se-hunden-tras-la-victoria-de-lula-en-las-elecciones-de-brasil\" target=\"_blank\" rel=\"noreferrer\">Las acciones de Telefónica se hunden tras la victoria de Lula<\u002Fa>. 26 de octubre de 2026.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"filial\" data-f=\"vmo2\">\n<div class=\"wrap\">\n\n  <header class=\"top\"><span class=\"tlogo hq\"><span class=\"ring\">3T<\u002Fspan><span class=\"hq-t\">Resultados<br>2026<\u002Fspan><\u002Fspan>\n    <div>\n      <h1>Virgin Media O2 — Panel de situación<\u002Fh1>\n      <div class=\"sub\">Reino Unido · Resultados 3T 2026 publicados el 3 de noviembre<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hd-right\">\n      <span class=\"pill\">50% de Telefónica<\u002Fspan>\n      <div class=\"quote\">995 M£<\u002Fdiv>\n      <div class=\"quote-sub\">EBITDA ajustado del 3T 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav class=\"tabs\">\n    <button data-t=\"vision\" class=\"active\">Visión general<\u002Fbutton>\n    <button data-t=\"resumen\">Contexto<\u002Fbutton>\n    <button data-t=\"finanzas\">Situación financiera<\u002Fbutton>\n    <button data-t=\"mercado\">Mercado y clientes<\u002Fbutton>\n    <button data-t=\"riesgos\">Riesgos y oportunidades<\u002Fbutton>\n    <button data-t=\"acciones\">Calendario y fuentes<\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- ================= VISIÓN GENERAL ================= -->\n  <section class=\"panel active\" data-p=\"vision\">\n  <div class=\"kpis\">\n    <div class=\"kpi\">\n      <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 17 13.5 8.5 8.5 13.5 2 7\"><\u002Fpolyline><polyline points=\"16 17 22 17 22 11\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"nm\">Ingresos<\u002Fspan><\u002Fdiv>\n      <div class=\"val\">2.427 M£<\u002Fdiv><div class=\"vsub\"><span class=\"dn\">−5,7%<\u002Fspan> interanual ajustado<br>−7,9% en Q2 2026<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"kpi\">\n      <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">EBITDA ajustado<\u002Fspan><\u002Fdiv>\n      <div class=\"val\">995 M£<\u002Fdiv><div class=\"vsub\"><span class=\"dn\">−2,6%<\u002Fspan> interanual<br><span class=\"up\">41,0%<\u002Fspan> de margen<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"kpi warn\">\n      <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"><\u002Fline><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"><\u002Fline><polygon points=\"12 2 20 7 4 7\"><\u002Fpolygon><\u002Fsvg><\u002Fspan><span class=\"nm\">Deuda neta<\u002Fspan><\u002Fdiv>\n      <div class=\"val\">21.951 M£<\u002Fdiv><div class=\"vsub\">22.418 M£ brutos, sep-2026<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"kpi\">\n      <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"><\u002Fpath><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">Liquidez disponible<\u002Fspan><\u002Fdiv>\n      <div class=\"val\">1.809 M£<\u002Fdiv><div class=\"vsub\">431 M£ de caja<br>1.378 M£ de crédito no dispuesto<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"kpi\">\n      <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">Accesos de banda ancha de consumo<\u002Fspan><\u002Fdiv>\n      <div class=\"val\">5,40 M<\u002Fdiv><div class=\"vsub\">líneas contratadas por particulares<br><span class=\"dn\">−29.000<\u002Fspan> en el trimestre (ajustado; −22.100 reportado)<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"kpi\">\n      <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"14\" x=\"2\" y=\"5\" rx=\"2\"><\u002Frect><line x1=\"2\" x2=\"22\" y1=\"10\" y2=\"10\"><\u002Fline><\u002Fsvg><\u002Fspan><span class=\"nm\">Reparto a los socios<\u002Fspan><\u002Fdiv>\n      <div class=\"val\">En revisión<\u002Fdiv><div class=\"vsub\">≈ 200 M£ previstos<br>378 M£ en 2025<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n    <div class=\"sumcard\"><div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Resumen ejecutivo<\u002Fh2><\u002Fdiv>\n    <p class=\"lead\">El desempeño operativo de Virgin Media O2 es estable: el margen mejora y los ingresos caen menos que en el trimestre anterior. El 3 de noviembre la compañía anunció un <strong>plan de ahorro de ≈ 800 M£ anuales en 2029<\u002Fstrong>, que recorta cerca del 30% del coste de personal y suspende nuevas ampliaciones de fibra. La principal debilidad sigue siendo la <strong>estructura financiera<\u002Fstrong>: el apalancamiento baja a 4,19 veces, pero la caja libre es negativa en el año, el reparto a los socios está en revisión y los <strong>≈ 1.100 M£<\u002Fstrong> de la operación Netomnia están sujetos a incertidumbre: nexfibre no ha ofrecido compromisos a la autoridad de competencia británica, que decide el 15 de diciembre.<\u002Fp>\n    <p class=\"prose\">La caída del 5,7% en ingresos sigue amplificada por dos efectos con poco impacto en el beneficio: la menor facturación de obra civil a nexfibre y la racionalización deliberada de la cartera de empresas. La cuestión de fondo se sitúa en dos planos: una base de clientes que retrocede en precio y en volumen a la vez, y un balance cuya deuda cotiza con un descuento elevado desde julio.<\u002Fp>\n    <div class=\"listbox\">\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Apalancamiento algo menor.<\u002Fb> La deuda neta baja de 4,41 a 4,19 veces el EBITDA en el trimestre según la métrica contractual (5,56 veces con toda la deuda incluida), todavía por encima de las 4,00 de diciembre. Tres cuartas partes de la deuda financiera vencen entre 2029 y 2031.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Plan de ahorro.<\u002Fb> ≈ 800 M£ anuales en 2029 (400 M£ en 2027 y 600 M£ en 2028), con un coste de reestructuración de ≈ 250 M£.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-hi\"><\u002Fspan><span><b>Mercado de crédito tensionado.<\u002Fb> En julio el bono no garantizado de 925 M$ cayó de 78 a 57 céntimos y el garantizado de 1.400 M$, de 92 a 76. Refinanciar hoy la deuda garantizada costaría en torno al 11%, frente al 5,3% medio actual.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-hi\"><\u002Fspan><span><b>Netomnia, en riesgo.<\u002Fb> El 2 de octubre la autoridad de competencia británica (CMA) concluyó de forma provisional que la compra de Netomnia por nexfibre puede reducir la competencia. El 20 de octubre nexfibre rechazó ese análisis y no ofreció compromisos. La decisión final, de la que dependen ≈ 1.100 M£, se espera el 15 de diciembre.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Desempeño operativo estable.<\u002Fb> Margen de EBITDA del 41,0% (+1,2 p.p.), 1.809 M£ de liquidez y sin vencimientos de préstamos ni bonos hasta 2029. La pérdida de clientes de banda ancha se modera: −29.000 (ajustado; −22.100 reportado), frente a −31.000 en el trimestre anterior.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tefbox\" style=\"margin-top:4px;\">\n      <h2>Implicaciones para Telefónica<\u002Fh2>\n      <p class=\"intro\">Telefónica posee el 50% de Virgin Media O2 y la registra por puesta en equivalencia: la deuda del negocio conjunto no se suma a la deuda neta consolidada del grupo, pero el 50% de su beneficio o pérdida sí se incorpora a la cuenta de resultados de Telefónica. Su situación llega al accionista por cinco vías.<\u002Fp>\n      <div class=\"tefgrid\">\n        <div class=\"tf\"><span class=\"tl\">Dividendo<\u002Fspan><span class=\"tv\">En revisión<\u002Fspan><p>La mitad de los ≈ 200 M£ previstos para 2026 corresponde a Telefónica, frente a 189 M£ recibidos en 2025. La compañía informará en el primer trimestre de 2027.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Resultado del grupo<\u002Fspan><span class=\"tv\">≈ −170 M£<\u002Fspan><p>Telefónica registra en su cuenta de resultados el 50% de la pérdida de VMO2 hasta septiembre (−340,0 M£); en el tercer trimestre el resultado fue casi nulo (+1,5 M£). Es independiente del dividendo. Aproximación: la contabilidad del grupo aplica ajustes propios.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Valor de la participación<\u002Fspan><span class=\"tv\">Test de deterioro<\u002Fspan><p>Un empeoramiento de las perspectivas o de las valoraciones del sector obligaría a revisar el valor en libros. Impacto contable, no de caja.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Capital<\u002Fspan><span class=\"tv\">Riesgo de aportación<\u002Fspan><p>Si la situación financiera obligase a reestructurar la deuda, los socios podrían tener que aportar fondos, en competencia con el objetivo del grupo de 2,5× de apalancamiento en 2028.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Estrategia<\u002Fspan><span class=\"tv\">Mercado núcleo<\u002Fspan><p>Reino Unido es uno de los cuatro mercados núcleo del plan del grupo. Con la deuda cotizando muy por debajo de la par, un tercero podría adquirirla con descuento y ganar influencia en una eventual reestructuración.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"bottom\"><strong>En conjunto.<\u002Fstrong> El impacto inmediato es moderado y acotado: menos dividendo y un resultado por puesta en equivalencia negativo, sin efecto sobre la deuda del grupo. El riesgo relevante es indirecto: si la refinanciación de 2029–2031 se complica, Telefónica podría pasar de recibir dividendos de VMO2 a tener que aportarle fondos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CONTEXTO ================= -->\n  <section class=\"panel\" data-p=\"resumen\">\n    <p class=\"lead\">La valoración de Virgin Media O2 depende de que sus socios conviertan un ajuste defensivo, con menor coste, menor inversión y menor dividendo, en una estructura financiera sostenible antes de que se consolide la pérdida de clientes. La situación operativa es mejor de lo que indica la caída de ingresos; el factor decisivo es el calendario, que depende de la decisión de la CMA sobre nexfibre prevista para el 15 de diciembre. El cuadro siguiente recorre la actividad comercial, los resultados y la caja, el balance y las operaciones en curso.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Cuadro de seguimiento<\u002Fh2><\u002Fdiv>\n    <p class=\"prose\">Cada indicador publicado por la compañía se compara con una referencia explícita —la guía del ejercicio, el mismo trimestre del año anterior o el trimestre precedente— y la desviación mide la distancia entre ambos.<\u002Fp>\n    <div class=\"tw\">\n      <table class=\"dt mon\">\n        <thead><tr><th>Indicador<\u002Fth><th class=\"num\">Actual (Q3 2026)<\u002Fth><th>Referencia<\u002Fth><th>Desviación<\u002Fth><th>Estado<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr class=\"grp\"><td colspan=\"5\">Operación<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El margen de EBITDA ajustado fue del 41,0% en el tercer trimestre, 1,2 puntos más que el 39,8% del mismo trimestre de 2025.\"><td class=\"ind\">Margen de EBITDA ajustado<\u002Ftd><td class=\"num\">41,0%<\u002Ftd><td class=\"soft\">39,8% en Q3 2025<\u002Ftd><td class=\"soft\">+1,2 p.p.<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La caja operativa ajustada (EBITDA tras arrendamientos menos inversión) fue de 401,4 M£ en el tercer trimestre, frente a 429,3 M£ un año antes: −6,5%. Si se ajusta por la integración de Daisy, la caída es del 7,3%.\"><td class=\"ind\">OpCFaL ajustado (EBITDA tras arrendamientos menos inversión)<\u002Ftd><td class=\"num dn\">401,4 M£<\u002Ftd><td class=\"soft\">429,3 M£ en Q3 2025<\u002Ftd><td class=\"soft\">−7,3% ajustado por Daisy; −6,5% reportado<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La inversión en red y equipos suma 1.481,6 M£ hasta septiembre. La previsión anual es de 2.000 a 2.200 M£, por lo que ha alcanzado el 71% del punto medio en nueve meses.\"><td class=\"ind\">Inversión en red y equipos<\u002Ftd><td class=\"num\">1.481,6 M£ <span class=\"soft\">(ene–sep)<\u002Fspan><\u002Ftd><td class=\"soft\">Previsión anual de 2.000–2.200 M£<\u002Ftd><td class=\"soft\">71% del punto medio en nueve meses<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a la previsión anual<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El flujo de caja libre ajustado es de −433,8 M£ hasta septiembre. Para llegar a los ≈ +200 M£ previstos en el año necesita generar unos 634 M£ en el cuarto trimestre.\"><td class=\"ind\">Flujo de caja libre ajustado<\u002Ftd><td class=\"num dn\">−433,8 M£ <span class=\"soft\">(ene–sep)<\u002Fspan><\u002Ftd><td class=\"soft\">Previsión anual: ≈ +200 M£<\u002Ftd><td class=\"soft\">≈ 634 M£ por generar en el cuarto trimestre<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">depende del cuarto trimestre<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Comercial<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Perdió 29.000 líneas netas de banda ancha en el tercer trimestre (cifra ajustada; −22.100 reportadas), algo menos que en el segundo (−31.000): mejora, pero sigue en negativo.\"><td class=\"ind\">Altas netas de banda ancha<\u002Ftd><td class=\"num dn\">−29.000 <span class=\"soft\">(ajustado)<\u002Fspan><\u002Ftd><td class=\"soft\">−31.000 en Q2 2026<\u002Ftd><td class=\"soft\">+2.000<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">mejora frente a Q2, sigue en negativo; reportado −22.100<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El ingreso medio por cliente fijo fue de 45,83 £ al mes, un 5,0% menos que un año antes. La cifra de 2025 (≈ 48,24 £) está calculada a partir de la variación publicada.\"><td class=\"ind\">Ingreso medio por cliente fijo<\u002Ftd><td class=\"num\">45,83 £<\u002Ftd><td class=\"soft\">≈ 48,24 £ en Q3 2025<\u002Ftd><td class=\"soft\">−5,0%<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Perdió 7.800 líneas netas de móvil de contrato de consumo en el tercer trimestre, frente a 54.300 en el segundo: una mejora significativa, aunque el saldo sigue siendo negativo.\"><td class=\"ind\">Altas netas de móvil de contrato, consumo<\u002Ftd><td class=\"num dn\">−7.800<\u002Ftd><td class=\"soft\">−54.300 en Q2 2026<\u002Ftd><td class=\"soft\">+46.500<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">mejora frente a Q2, sigue en negativo<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Tiene 9,09 millones de conexiones mayoristas, 59.000 más que en junio (9,04 millones).\"><td class=\"ind\">Conexiones mayoristas<\u002Ftd><td class=\"num up\">9,09 M<\u002Ftd><td class=\"soft\">9,04 M en junio de 2026<\u002Ftd><td class=\"soft\">+59.000<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a junio 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Balance<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La deuda neta equivale a 4,19 veces el EBITDA según la métrica de sus contratos de deuda, frente a 4,41 en junio: −0,22. En diciembre de 2025 era 4,00.\"><td class=\"ind\">Deuda neta / EBITDA, métrica contractual<\u002Ftd><td class=\"num\">4,19×<\u002Ftd><td class=\"soft\">4,41× en junio de 2026 (4,00× en diciembre de 2025)<\u002Ftd><td class=\"soft\">−0,22×<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a junio 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Incluyendo la financiación de proveedores y los arrendamientos, la ratio es 5,56 veces, frente a 5,89 en junio: −0,33. En diciembre de 2025 era 5,39.\"><td class=\"ind\">Deuda neta / EBITDA, con proveedores y arrendamientos<\u002Ftd><td class=\"num\">5,56×<\u002Ftd><td class=\"soft\">5,89× en junio de 2026 (5,39× en diciembre de 2025)<\u002Ftd><td class=\"soft\">−0,33×<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a junio 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El bono no garantizado de 925 M$ (cupón del 5%, vence en 2030) cotizaba a 57 centavos por dólar el 30 de julio, frente a 78 el 1 de julio: 21 centavos menos (−27%). No hay dato posterior.\"><td class=\"ind\">Cotización del bono no garantizado de 925 M$ (5,000%, 2030)<\u002Ftd><td class=\"num dn\">57c <span class=\"soft\">(30-jul)<\u002Fspan><\u002Ftd><td class=\"soft\">78c el 1 de julio de 2026<\u002Ftd><td class=\"soft\">−21c (−27%)<\u002Ftd><td><span class=\"stt st-crit\">Muy desfavorable<\u002Fspan><span class=\"stref\">respecto a julio 2026; sin dato posterior<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Tiene 1.809 M£ de liquidez disponible, frente a 2.994 M£ de préstamos y bonos que vencen en 2029: cubre el 60%.\"><td class=\"ind\">Liquidez disponible<\u002Ftd><td class=\"num\">1.809 M£<\u002Ftd><td class=\"soft\">Vencimientos de préstamos y bonos en 2029: 2.994 M£<\u002Ftd><td class=\"soft\">Cubre el 60%<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">respecto a los vencimientos de 2029<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Estrategia<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La operación con Netomnia supondría cobrar unos 1.100 M£, unas 5,5 veces la caja libre prevista para 2026. Depende de la CMA, que decide el 15 de diciembre y ya emitió un informe provisional desfavorable; nexfibre no ha ofrecido compromisos.\"><td class=\"ind\">Operación Netomnia<\u002Ftd><td class=\"num\">1.100 M£ <span class=\"soft\">por cobrar<\u002Fspan><\u002Ftd><td class=\"soft\">Fecha límite de la CMA: 15 de diciembre de 2026<\u002Ftd><td class=\"soft\">5,5 veces la caja libre prevista para 2026; nexfibre no ofrece compromisos<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">informe provisional de la CMA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El plan de ahorro busca unos 800 M£ anuales en 2029, 200 M£ más que los ≈ 600 M£ que publicó el Financial Times en septiembre. Se ejecutará desde 2027.\"><td class=\"ind\">Plan de ahorro<\u002Ftd><td class=\"num\">≈ 800 M£ <span class=\"soft\">anuales en 2029<\u002Fspan><\u002Ftd><td class=\"soft\">≈ 600 M£ según el Financial Times en septiembre<\u002Ftd><td class=\"soft\">+200 M£<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">ejecución desde 2027<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Diagnóstico de conjunto<\u002Fh2><span class=\"st\">fortalezas frente a focos de atención<\u002Fspan><\u002Fdiv>\n    <div class=\"cards3\">\n      <div class=\"card\">\n        <h3 style=\"color:var(--blue-dark);\">Aspectos favorables<\u002Fh3>\n        <ul>\n          <li><strong>Eficiencia operativa.<\u002Fstrong> El margen mejora 1,2 puntos, hasta el 41,0%, pese al descenso de ingresos.<\u002Fli>\n          <li><strong>Negocio mayorista.<\u002Fstrong> Sigue creciendo: 9,09 millones de conexiones, 59.000 más en el trimestre.<\u002Fli>\n          <li><strong>Infraestructura.<\u002Fstrong> Gigabit en 18,8 millones de hogares y fibra en 9,4 millones, mayor huella nacional de 5G autónomo y primer servicio satelital al móvil del Reino Unido.<\u002Fli>\n          <li><strong>Plan de ahorro definido.<\u002Fstrong> ≈ 800 M£ anuales en 2029, con calendario: 400 M£ en 2027 y 600 M£ en 2028.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3 style=\"color:var(--red-dark);\">Focos de atención<\u002Fh3>\n        <ul>\n          <li><strong>Precio y volumen.<\u002Fstrong> El ingreso medio por cliente fijo cae un 5,0% al tiempo que se reduce la base: el descuento de retención neutraliza la subida de £4 mensuales.<\u002Fli>\n          <li><strong>Apalancamiento.<\u002Fstrong> 4,19 veces según la métrica contractual, por encima de las 4,00 de diciembre, y 5,56 veces incorporando financiación de proveedores y arrendamientos.<\u002Fli>\n          <li><strong>Caja libre negativa.<\u002Fstrong> −433,8 M£ hasta septiembre, frente a una previsión anual de ≈ +200 M£.<\u002Fli>\n          <li><strong>Percepción de crédito.<\u002Fstrong> En julio el bono no garantizado de 925 M$ retrocedió de 78 a 57 céntimos; no hay precio posterior en las fuentes consultadas.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Cuestiones abiertas<\u002Fh3>\n        <ul>\n          <li><strong>Reparto a los socios.<\u002Fstrong> La compañía revisa la distribución de 2026 e informará en el primer trimestre de 2027.<\u002Fli>\n          <li><strong>Ejecución del plan de ahorro.<\u002Fstrong> Recortar cerca del 30% del coste de personal y detener mejoras de fibra sin acelerar la pérdida de clientes.<\u002Fli>\n          <li><strong>Resolución de la CMA.<\u002Fstrong> La entrada de ≈ 1.100 M£ depende de la decisión del 15 de diciembre; nexfibre no ha ofrecido compromisos y no hay alternativa publicada.<\u002Fli>\n          <li><strong>Estructura de propiedad.<\u002Fstrong> Con el bono no garantizado a 57 céntimos, hoy resulta más barato tomar posición en la compañía comprando su deuda que su capital.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= FINANZAS ================= -->\n  <section class=\"panel\" data-p=\"finanzas\">\n    <p class=\"lead\">La estructura financiera es el principal condicionante de la compañía. No hay tensiones de liquidez a corto plazo: dispone de 1.809 M£ y no tiene vencimientos de préstamos o bonos hasta 2029. La exigencia se sitúa en la refinanciación a medio plazo: el apalancamiento se mantiene por encima de 4 veces, 13.514 M£ vencen entre 2029 y 2031, y en julio el mercado descontaba un coste en torno al 11% para la deuda garantizada, el doble del actual. La ejecución del plan de ahorro de ≈ 800 M£ y la resolución de la CMA sobre Netomnia determinarán en qué condiciones se produce esa refinanciación.<\u002Fp>\n    <div class=\"hl\">\n      <div class=\"hl-g\"><div class=\"hl-t\">Apalancamiento y vencimientos <span>30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">4,19×<\u002Fdiv><div class=\"hl-p\">Deuda neta / EBITDA<small>métrica contractual<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">5,56×<\u002Fdiv><div class=\"hl-p\">Deuda neta / EBITDA<small>con proveedores y arrendamientos<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">2.994 M£<\u002Fdiv><div class=\"hl-p\">Vencimientos en 2029<small>préstamos y bonos<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">60%<\u002Fdiv><div class=\"hl-p\">Del vencimiento de 2029<small>cubierto con la liquidez actual<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hl-g\"><div class=\"hl-t\">Caja y deuda <span>30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">1.809 M£<\u002Fdiv><div class=\"hl-p\">Liquidez disponible<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">21.951 M£<\u002Fdiv><div class=\"hl-p\">Deuda neta<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v neg\">−433,8 M£<\u002Fdiv><div class=\"hl-p\">Flujo de caja libre<small>enero–septiembre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">≈ 200 M£<\u002Fdiv><div class=\"hl-p\">Flujo de caja libre<small>previsión para 2026<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- LIQUIDEZ -->\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Liquidez disponible<\u002Fh2><span class=\"st\">30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"grid2 liqgrid\">\n      <div class=\"tw\" style=\"margin-bottom:0;\">\n        <table class=\"dt liqt\" style=\"min-width:0;\">\n          <thead><tr><th>Concepto<\u002Fth><th class=\"num\">Importe<\u002Fth><\u002Ftr><\u  a 18 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n    <p class=\"prose\">Toda la deuda cotizada de VMO2 se negocia por debajo de la par, de modo que la rentabilidad al peor escenario coincide con la rentabilidad a vencimiento y <strong>el rendimiento exigido hoy en el mercado secundario es la mejor aproximación al coste al que la compañía podría emitir<\u002Fstrong>. La curva se ordena por rango de garantía antes que por plazo: el tramo garantizado, que es el 75,6% del pasivo financiero, se mueve entre el 7,7% y el 11,4% según divisa y vencimiento, mientras que la financiación de proveedores y la deuda no garantizada cotizan a niveles que equivalen en la práctica a un mercado cerrado.<\u002Fp>\n    <div class=\"chart-card\">\n      <svg class=\"fig\" viewBox=\"0 0 1080 400\" role=\"img\" aria-label=\"Rentabilidad exigida a la deuda de Virgin Media O2 según años hasta el vencimiento, a 18 de septiembre de 2026. Los bonos garantizados se sitúan entre el 7,7% y el 11,4%; los préstamos sindicados entre el 9,5% y el 11,2%; la financiación de proveedores entre el 15,2% y el 17,3%; y los dos bonos no garantizados de 2030, en el 17,8% y el 19,2%. El coste medio actual de la deuda tras coberturas es del 5,3%.\">\n        <g stroke=\"#E4E7EC\" stroke-width=\"1\">\n          <line x1=\"70\" y1=\"300\" x2=\"1040\" y2=\"300\"><\u002Fline>\n          <line x1=\"70\" y1=\"235\" x2=\"1040\" y2=\"235\" stroke-dasharray=\"3 4\"><\u002Fline>\n          <line x1=\"70\" y1=\"170\" x2=\"1040\" y2=\"170\" stroke-dasharray=\"3 4\"><\u002Fline>\n          <line x1=\"70\" y1=\"105\" x2=\"1040\" y2=\"105\" stroke-dasharray=\"3 4\"><\u002Fline>\n          <line x1=\"70\" y1=\"40\" x2=\"1040\" y2=\"40\" stroke-dasharray=\"3 4\"><\u002Fline>\n        <\u002Fg>\n        <g font-size=\"11\" fill=\"#98A2B3\" text-anchor=\"end\">\n          <text x=\"60\" y=\"304\">4%<\u002Ftext><text x=\"60\" y=\"239\">8%<\u002Ftext><text x=\"60\" y=\"174\">12%<\u002Ftext><text x=\"60\" y=\"109\">16%<\u002Ftext>< td><td class=\"num\"><strong>10,05%<\u002Fstrong><\u002Ftd><td class=\"num soft\">—<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n        <p class=\"cap\" style=\"margin:0 0 14px;\">Los préstamos pagan tipo variable; la columna central los convierte a su equivalente a tipo fijo para poder compararlos con los bonos. La última columna recoge el mismo rendimiento llevado a libras, que es la divisa en la que la compañía genera su caja.<\u002Fp>\n\n        <div class=\"callout warn\" style=\"margin-bottom:14px;\"><svg class=\"ci\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><span><strong>Orden de magnitud.<\u002Fstrong> Refinanciar hoy a cinco años cuesta en torno al <strong>9,5%–11,5% en equivalente libra<\u002Fstrong> frente al 5,3% medio actual: unos 420–620 puntos básicos más. Aplicado a los 2.994 M£ que vencen en 2029, son unos <strong>135 M£ anuales adicionales de intereses<\u002Fstrong>; aplicado a los 13.514 M£ de 2029–2031, del orden de <strong>610 M£ al año<\u002Fstrong>, equivalentes al 16% del EBITDA de 2025. Es un ejercicio ilustrativo: los niveles pueden estrecharse si se cierra la operación Netomnia o si el plan de ahorro convence al mercado.<\u002Fspan><\u002Fdiv>\n\n        <div class=\"callout\"><svg class=\"ci\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg><span><strong>Contraste con la matriz.<\u002Fstrong> Telefónica emitiría hoy deuda senior en euros con un cupón indicativo del 4,29% a cinco años y del 4,86% a diez, y en libras a 109 puntos básicos sobre el bono británico. La diferencia con VMO2 supera los 500 puntos básicos y refleja que la deuda de la sociedad conjunta es <em>sin recurso<\u002Fem> al accionista y tiene calificación de alto rendimiento (Ba3 y B3) frente al grado de inversión del grupo (Baa3 / BBB).<\u002Fspan><\u002Fdiv>\n\n        <div class=\"callout\"><svg class=\"ci\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"m19 9-5 5-4-4-3 3\"><\u002Fpath><\u002Fsvg><span><strong>Deterioro en lo que va de año.<\u002Fstrong> El bono garantizado de $1.400m a 2031 ha perdido 12,9 puntos de precio desde enero y su rentabilidad exigida ha subido 3,84 puntos porcentuales. En el tramo no garantizado el movimiento es de otra escala: el bono de €500m a 2030 cede 31,1 puntos y su rentabilidad sube 12,37 puntos porcentuales.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MAGNITUDES -->\n    <div class=\"sec\" style=\"margin-top:10px;\"><span class=\"bar\"><\u002Fspan><h2>Principales magnitudes<\u002Fh2><span class=\"st\">millones de libras · variaciones ajustadas por Daisy<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Magnitud<\u002Fth><th class=\"num\">Q1 2026<\u002Fth><th class=\"num\">Q2 2026<\u002Fth><th class=\"num\">Q3 2026<\u002Fth><th class=\"num\">Var. Q3<\u002Fth><th class=\"num\">Ene–sep 2026<\u002Fth><th class=\"num\">FY 2025<\u002Fth><th>Previsión 2026<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Ingresos totales<\u002Ftd><td class=\"num\">2.390,1<\u002Ftd><td class=\"num\">2.398,9<\u002Ftd><td class=\"num\">2.426,7<\u002Ftd><td class=\"num dn\">−5,7%<\u002Ftd><td class=\"num\">7.215,7<\u002Ftd><td class=\"num\">10.113,1<\u002Ftd><td class=\"soft\">—<\u002Ftd><\u002Ftr>\n 02Ftd><td class=\"num dn\">−197,3<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num dn\">−433,8<\u002Ftd><td class=\"num\">393,1<\u002Ftd><td class=\"soft\">≈ 200<\u002Ftd><\u002Ftr>\n          <tr><td>Resultado neto<\u002Ftd><td class=\"num dn\">−30,5<\u002Ftd><td class=\"num dn\">−311,0<\u002Ftd><td class=\"num\">+1,5<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num dn\">−340,0<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"soft\">—<\u002Ftd><\u002Ftr>\n          <tr><td>Distribuciones a los socios<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">378,0<\u002Ftd><td class=\"soft\">≈ 200, en revisión<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div class=\"callout\"><svg class=\"ci\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg><span>La caída del 5,7% en ingresos del tercer trimestre no refleja solo el negocio subyacente: sigue incorporando la menor facturación de obra civil a nexfibre y la racionalización deliberada de la cartera de empresas. En el tercer trimestre la compañía publica la caja operativa con una medida nueva, el EBITDA tras arrendamientos menos inversión (401,4 M£), que puede no ser comparable con la de los trimestres anteriores. En la presentación de resultados, en euros, el mismo indicador ajustado del tercer trimestre es de 469 M€ (margen del 17%), frente a 497 M€ un año antes. Los ingresos de servicio de nueve meses son la suma de los tres trimestres.<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= MERCADO ================= -->\n  <section class=\"panel\" data-p=\"mercado\">\n    <p class=\"lead\">El mercado británico presenta dos dinámicas opuestas: la telefonía móvil se ha consolidado en tres operadores, mientras que la banda ancha fija se ha fragmentado con la entrada de operadores alternativos, que han pasado del 7,0% al 11,4% de cuota en año y medio. Virgin Media O2 dispone de cobertura gigabit en 18,8 millones de hogares, y las bajas se producen en el momento de la renovación, frente a esas ofertas alternativas. Con un margen reducido para nuevas subidas de tarifa, la defensa del ingreso en 2027 deberá apoyarse en la retención y en el negocio mayorista.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Altas netas por segmento<\u002Fh2><span class=\"st\">Q3 2026 · conexiones<\u002Fspan><\u002Fdiv>\n    <div class=\"fig-side\">\n    <div class=\"chart-card\">\n      <svg class=\"fig\" viewBox=\"180 0 480 178\" role=\"img\" aria-label=\"Altas netas del tercer trimestre de 2026: consumo móvil menos 7.800, banda ancha menos 29.000 (ajustado), empresas menos 19.500, mayorista más 59.000.\">\n        <line x1=\"380\" y1=\"12\" x2=\"380\" y2=\"172\" stroke=\"#CFD8E3\" stroke-width=\"1\"><\u002Fline>\n        <path d=\"M380,18H361.6Q353.6,18 353.6,26V38Q353.6,46 361.6,46H380Z\" fill=\"#E10A0A\"><\u002Fpath>\n        <text x=\"343.6\" y=\"36.5\" font-size=\"12.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"end\">Móvil consumo<\u002Ftext>\n        <text x=\"392\" y=\"36.5\" font-size=\"13\" font-weight=\"600\" fill=\"#A81C1C\">−7.800<\u002Ftext>\n        <path d=\"M380,58H313.1Q305.1,58 305.1,66V78Q305.1,86 313.1,86H380Z\" fill=\"#E10A0A\"><\u002Fpath>\n        <text x=\"295.1\" y=\"76.5\" font-size=\"12.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"end\">Banda ancha<\u002Ftext>\n        <text x=\"392\" y=\"76.5\" font-size=\"13\" font-weight=\"600\" fill=\"#A81C1C\">−29.000<\u002Ftext>\n        <path d=\"M380,98H321.9Q313.9,98 313.9,106V118Q313.9,126 321.9,126H380Z\" fill=\"#E10A0A\"><\u002Fpath>\n        <text x=\"303.9\" y=\"116.5\" font-size=\"12.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"end\">Móvil empresas<\u002Ftext>\n        <text x=\"392\" y=\"116.5\" font-size=\"13\" font-weight=\"600\" fill=\"#A81C1C\">−19.500<\u002Ftext>\n        <path d=\"M380,138H572Q580,138 580,146V158Q580,166 572,166H380Z\" fill=\"#0066FF\"><\u002Fpath>\n        <text x=\"370\" y=\"156.5\" font-size=\"12.5\" font-weight=\"600\" fill=\"#101828\" text-anchor=\"end\">Mayorista<\u002Ftext>\n        <text x=\"592\" y=\"156.5\" font-size=\"13\" font-weight=\"600\" fill=\"#00358A\">+59.000<\u002Ftext>\n      <\u002Fsvg>\n      <p class=\"fig-cap\">Origen en cero. Total de conexiones móviles del trimestre: −49.800.<\u002Fp>\n    <\u002Fdiv>\n    <p class=\"cap\">El segmento de consumo pierde 7.800 contratos, muchos menos que en el trimestre anterior (−54.300), y el mayorista suma 59.000. El total baja en 49.800 por la conectividad de máquinas (−109.400). <strong>No se publica qué proporción del crecimiento mayorista corresponde a mercado incremental y cuál a migración de la propia base<\u002Fstrong> hacia operadores virtuales de menor margen unitario.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Base de clientes<\u002Fh2><span class=\"st\">30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Segmento<\u002Fth><th class=\"num\">Conexiones<\u002Fth><th class=\"num\">Netas Q2<\u002Fth><th class=\"num\">Netas Q3<\u002Fth><th class=\"num\">Netas 2025<\u002Fth><th class=\"num\">ARPU mensual<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Banda ancha, consumo<\u002Ftd><td class=\"num\">5.395.800<\u002Ftd><td class=\"num dn\">−31.000<\u002Ftd><td class=\"num dn\">−29.000<\u002Ftd><td class=\"num dn\">−138.400<\u002Ftd><td class=\"num\">£45,83 <span class=\"dn\">(−5,0%)<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Móvil contrato, consumo<\u002Ftd><td class=\"num\">12.428.400<\u002Ftd><td class=\"num dn\">−54.300<\u002Ftd><td class=\"num dn\">−7.800<\u002Ftd><td class=\"num dn\">−397.500<\u002Ftd><td class=\"num\">£18,12 <span class=\"up\">(+2,0%)<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Móvil contrato, empresas<\u002Ftd><td class=\"num\">2.917.000<\u002Ftd><td class=\"num dn\">−8.700<\u002Ftd><td class=\"num dn\">−19.500<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><\u002Ftr>\n          <tr><td>Mayorista<\u002Ftd><td class=\"num\">9.094.900<\u002Ftd><td class=\"num up\">+33.800<\u002Ftd><td class=\"num up\">+59.000<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><\u002Ftr>\n          <tr><td>Prepago<\u002Ftd><td class=\"num\">7.914.800<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num up\">+27.900<\u002Ftd><td class=\"num dn\">−659.300<\u002Ftd><td class=\"num soft\">—<\u002Ftd><\u002Ftr>\n          <tr><td>Conectividad de máquinas<\u002Ftd><td class=\"num\">13.993.700<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num dn\">−109.400<\u002Ftd><td class=\"num up\">+899.600<\u002Ftd><td class=\"num soft\">—<\u002Ftd><\u002Ftr>\n          <tr><td><strong>Total conexiones móviles<\u002Fstrong><\u002Ftd><td class=\"num\"><strong>46.348.800<\u002Fstrong><\u002Ftd><td class=\"num dn\"><strong>−17.800<\u002Fstrong><\u002Ftd><td class=\"num dn\"><strong>−49.800<\u002Fstrong><\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p class=\"cap\" style=\"margin-top:-12px;\">La base de contrato de consumo baja en 37.900 líneas frente a junio, más que las altas netas publicadas (−7.800); las fuentes consultadas no explican la diferencia de 30.100 líneas. Las altas netas de banda ancha de Q3 (−29.000) y de Q2 (−31.000) son las de la presentación de resultados, que en el tercer trimestre excluye ajustes de accesos sin impacto en ingresos; el dato reportado de Q3 es −22.100.<\u002Fp>\n\n    <div class=\"callout warn\"><svg class=\"ci\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><span>El indicador más relevante del trimestre no son las bajas, sino su combinación con el precio: el ingreso medio por cliente fijo cae un 5,0% al tiempo que se pierden 22.100 clientes. Perder volumen a cambio de mayor valor por cliente sería una estrategia; el retroceso simultáneo de ambos indica que el descuento de retención está neutralizando la subida de tarifa de £4 mensuales.<\u002Fspan><\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Entorno competitivo y regulatorio<\u002Fh2><span class=\"st\">movimientos relevantes para la compañía<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Hecho<\u002Fth><th class=\"num\">Fecha<\u002Fth><th>Efecto<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Resultados del tercer trimestre y plan de ahorro de ≈ 800 M£ anuales en 2029<\u002Ftd><td class=\"num\">3 nov 2026<\u002Ftd><td class=\"soft\">400 M£ en 2027 y 600 M£ en 2028, con ≈ 250 M£ de coste de reestructuración. Afecta a cerca del 30% del coste de personal y suspende nuevas ampliaciones de fibra más allá de lo comprometido. El reparto a los socios queda en revisión. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Los accionistas de nexfibre rechazan las conclusiones provisionales de la CMA y no ofrecen compromisos<\u002Ftd><td class=\"num\">20 oct 2026<\u002Ftd><td class=\"soft\">InfraVia, Liberty Global y Telefónica califican el informe provisional de «fundamentalmente erróneo» en un comunicado conjunto. Sin compromisos, la operación depende de que la CMA cambie de criterio el 15 de diciembre. CityFibre apoyó que la CMA abriera la investigación a fondo. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>La CMA concluye de forma provisional que la compra de Netomnia por nexfibre puede reducir la competencia<\u002Ftd><td class=\"num\">2 oct 2026<\u002Ftd><td class=\"soft\">Considera que, sin la operación, CityFibre habría comprado Netomnia. Alegaciones hasta el 23 de octubre; decisión final el 15 de diciembre. Los accionistas de nexfibre rechazan el análisis. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Vodafone adquiere el 49% restante de VodafoneThree por £4.300m<\u002Ftd><td class=\"num\">31 jul 2026<\u002Ftd><td class=\"soft\">El mercado móvil queda en tres operadores con accionariado único. VodafoneThree pasa a ser la mayor red del país, con £11.000m de inversión comprometida ante la CMA y £700m de ahorros anuales previstos a 2030. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Los operadores alternativos alcanzan el 11,4% del mercado de banda ancha<\u002Ftd><td class=\"num\">Q2 2026<\u002Ftd><td class=\"soft\">Han ganado 4,4 puntos en dieciocho meses. Netomnia lidera con el 2,0%. La respuesta de la compañía consiste precisamente en adquirir al mayor de ellos a través de nexfibre. <strong>Adverso, con respuesta en curso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Ofcom publica la revisión de acceso 2026–2031<\u002Ftd><td class=\"num\">17 mar 2026<\u002Ftd><td class=\"soft\">Fija el marco regulatorio de la fibra para cinco años. Aporta visibilidad, si bien consolida a Openreach como referencia de precios mayoristas. <strong>Neutro.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Ofcom propone bloquear el principal descuento de Openreach<\u002Ftd><td class=\"num\">jul 2026<\u002Ftd><td class=\"soft\">La oferta bloqueada concedía hasta £9,50 mensuales durante treinta meses por captación nueva. Sí se autorizó un reembolso de £50 dirigido a zonas de Virgin Media. <strong>Favorable, parcial.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Revisión de precios en libras y peniques<\u002Ftd><td class=\"num\">oct 2025 / abr 2026<\u002Ftd><td class=\"soft\">Subida anual de £4 al mes en fijo y de £2,50 en móvil. Protegen el ingreso nominal, pero constituyen la causa señalada de la pérdida de clientes en renovación. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Constitución de O2 Daisy, sociedad conjunta 70/30 con Daisy Group<\u002Ftd><td class=\"num\">4 ago 2025<\u002Ftd><td class=\"soft\">£1.400m de ingresos proforma y sinergias de ~£70m anuales a 2030. A corto plazo resta: la racionalización de cartera explica buena parte del −8,7% del segmento empresarial. <strong>Favorable a medio plazo.<\u002Fstrong><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= RIESGOS ================= -->\n  <section class=\"panel\" data-p=\"riesgos\">\n    <p class=\"lead\">El perfil de riesgo está determinado por el apalancamiento, la dependencia de una resolución regulatoria y la erosión de la base de clientes. Estos riesgos son tangibles y de corto plazo, mientras que las principales palancas de valor, ligadas a la consolidación del mercado de fibra, son de medio plazo y están sujetas a autorización. Hasta que se resuelva esa incertidumbre, la generación de caja y la capacidad de inversión marcarán el margen de maniobra de la compañía.<\u002Fp>\n\n    <div class=\"cards3 roblk\">\n      <div class=\"card roc\">\n        <h3>Riesgos<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Resolución desfavorable de la CMA.<\u002Fb> Más probable desde que nexfibre renunció a ofrecer compromisos. Supondría la pérdida o el aplazamiento de £1.100m de caja y del traspaso a nexfibre de la inversión de 2,1 millones de hogares.<\u002Fli>\n          <li><b>Coste de refinanciación.<\u002Fb> Sin vencimientos hasta 2029, pero cada punto de coste sobre unos 17.600 M£ de préstamos y bonos equivale a unos 176 M£ anuales de caja.<\u002Fli>\n          <li><b>Erosión de la red por recorte de inversión.<\u002Fb> El plan de ahorro suspende nuevas ampliaciones de fibra más allá de lo comprometido, en plena migración de cable a fibra.<\u002Fli>\n          <li><b>Deterioro combinado de precio y volumen.<\u002Fb> Si la revisión de precios de abril de 2027 vuelve a costar base e ingreso medio, la guía resultaría insuficiente.<\u002Fli>\n          <li><b>Ejecución del plan de ahorro.<\u002Fb> Los ≈ 250 M£ de coste de reestructuración llegan antes que el ahorro, y el plan afecta a cerca del 30% del coste de personal.<\u002Fli>\n          <li><b>Desalineación entre los socios.<\u002Fb> En una estructura al 50% el desacuerdo no se dirime por mayoría, sino por bloqueo.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card roc\">\n        <h3>Oportunidades<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Alternativa mayorista con escala.<\u002Fb> Red propia, nexfibre y Netomnia se aproximan a 20 millones de inmuebles frente a Openreach.<\u002Fli>\n          <li><b>Inversión en fibra fuera del balance.<\u002Fb> nexfibre asume la actualización de 2,1 millones de hogares propios antes de finales de 2027.<\u002Fli>\n          <li><b>Ahorro de costes.<\u002Fb> ≈ 800 M£ anuales en 2029, en torno a una quinta parte del EBITDA de 2025.<\u002Fli>\n          <li><b>Negocio mayorista móvil.<\u002Fb> 9,09 millones de conexiones, más de un tercio de la base de contrato, sin coste de captación.<\u002Fli>\n          <li><b>Diferenciación por red.<\u002Fb> Mayor huella de 5G autónomo tras adquirir 78,8 MHz por £343m, y O2 Satellite, ya extendido al segmento empresarial.<\u002Fli>\n          <li><b>Sinergias de O2 Daisy.<\u002Fb> ~£70m anuales a 2030, con más de la mitad previstas en los tres primeros años.<\u002Fli>\n          <li><b>Activos monetizables.<\u002Fb> El 25,01% restante de la sociedad de torres, con precedentes a múltiplos próximos a 19 veces, y la cartera de conectividad de máquinas.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= ACCIONES ================= -->\n  <section class=\"panel\" data-p=\"acciones\">\n    <p class=\"lead\">El hito inmediato es la resolución de la CMA, el 15 de diciembre. El resto se concentra en el primer trimestre de 2027.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Calendario de hitos<\u002Fh2><span class=\"st\">próximos doce meses<\u002Fspan><\u002Fdiv>\n    <div class=\"rail\">\n      <div class=\"stop t-hot\"><span class=\"when\">15 de diciembre<\u002Fspan><h4>Resolución final de la CMA<\u002Fh4><p>De ella dependen la entrada de ≈ 1.100 M£ y la participación indirecta del 15% en nexfibre. nexfibre no ha ofrecido compromisos.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-hot\"><span class=\"when\">Primer trimestre de 2027<\u002Fspan><h4>Reparto a los socios<\u002Fh4><p>La compañía informará de la distribución de 2026, de ≈ 200 M£ previstos y hoy en revisión.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-mid\"><span class=\"when\">Febrero 2027<\u002Fspan><h4>Resultados anuales 2026<\u002Fh4><p>La previsión de caja libre (≈ 200 M£) exige ≈ 634 M£ en el cuarto trimestre.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-hot\"><span class=\"when\">2027<\u002Fspan><h4>Primer tramo del plan de ahorro<\u002Fh4><p>≈ 400 M£ de ahorro anual en 2027, 600 M£ en 2028 y 800 M£ en 2029, con ≈ 250 M£ de coste de reestructuración.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-mid\"><span class=\"when\">Enero – febrero<\u002Fspan><h4>Presupuesto 2027<\u002Fh4><p>Instrumento en el que se fija el nivel mínimo de inversión. La guía de 2026 se sitúa en £2.000–2.200m.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">Abril 2027<\u002Fspan><h4>Revisión anual de precios<\u002Fh4><p>Incremento de £4 mensuales en fijo y £2,50 en móvil. En 2026 se tradujo en pérdida de base y de ingreso medio.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Fuentes<\u002Fh2><span class=\"st\">información pública consultada entre el 11 de septiembre y el 12 de noviembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"listbox refs\">\n      <ol>\n        <li><span class=\"who\">Virgin Media O2.<\u002Fspan> <a href=\"https://news.virginmediao2.co.uk/wp-content/uploads/2026/11/Virgin-Media-O2-Q3-2026-Earnings-Release.pdf\" target=\"_blank\" rel=\"noreferrer\">Resultados del tercer trimestre de 2026 y plan de ahorro<\u002Fa>. 3 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Virgin Media O2.<\u002Fspan> <a href=\"https://news.virginmediao2.co.uk/2026-financial-results/q3/\" target=\"_blank\" rel=\"noreferrer\">Página de resultados del tercer trimestre de 2026<\u002Fa>. 3 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">ISPreview.<\u002Fspan> <a href=\"https://www.ispreview.co.uk/index.php/2026/11/virgin-media-o2s-uk-broadband-customers-fall-as-cost-cutting-strikes-and-fttp-upgrades-stop.html\" target=\"_blank\" rel=\"noreferrer\">Los clientes de banda ancha bajan mientras se recortan costes y se detienen las mejoras de fibra<\u002Fa>. Noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">ISPreview.<\u002Fspan> <a href=\"https://www.ispreview.co.uk/index.php/2026/10/nexfibre-and-virgin-media-o2s-2bn-netomnia-uk-broadband-deal-is-effectively-dead.html\" target=\"_blank\" rel=\"noreferrer\">La compra de Netomnia por nexfibre, en el aire tras renunciar a ofrecer compromisos<\u002Fa>. Octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telecompaper.<\u002Fspan> <a href=\"https://www.telecompaper.com/news/nexfibre-declines-to-offer-remedies-for-netomnia-takeover-competition-concerns--1586219\" target=\"_blank\" rel=\"noreferrer\">nexfibre no ofrece compromisos ante la CMA<\u002Fa>. Octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">Advanced Television.<\u002Fspan> <a href=\"https://www.advanced-television.com/2026/10/20/nexfibre-rejects-cmas-views-on-netomnia-takeover/\" target=\"_blank\" rel=\"noreferrer\">nexfibre rechaza las conclusiones de la CMA<\u002Fa>. 20 de octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">Virgin Media O2.<\u002Fspan> <a href=\"https://news.virginmediao2.co.uk/wp-content/uploads/2026/07/Virgin-Media-O2-Q2-2026-Earnings-Release.pdf\" target=\"_blank\" rel=\"noreferrer\">Resultados del segundo trimestre de 2026<\u002Fa>. 24 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Virgin Media O2.<\u002Fspan> <a href=\"https://news.virginmediao2.co.uk/wp-content/uploads/2026/04/Virgin-Media-O2-Q1-2026-Earnings-Release.pdf\" target=\"_blank\" rel=\"noreferrer\">Resultados del primer trimestre de 2026<\u002Fa>. Abril de 2026.<\u002Fli>\n        <li><span class=\"who\">Virgin Media O2.<\u002Fspan> <a href=\"https://news.virginmediao2.co.uk/wp-content/uploads/2026/02/Virgin-Media-O2-Q4-2025-Earnings-Release.pdf\" target=\"_blank\" rel=\"noreferrer\">Resultados del ejercicio 2025 y guía para 2026<\u002Fa>. Febrero de 2026.<\u002Fli>\n        <li><span class=\"who\">Liberty Global.<\u002Fspan> <a href=\"https://www.globenewswire.com/news-release/2026/07/24/3332822/34554/en/Liberty-Global-Reports-Q2-2026-Results.html\" target=\"_blank\" rel=\"noreferrer\">Resultados del segundo trimestre de 2026<\u002Fa>. 24 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Financial Times, recogido por ISPreview.<\u002Fspan> <a href=\"https://www.ispreview.co.uk/index.php/2026/09/shareholders-of-virgin-media-o2-uk-reportedly-target-600m-in-cost-cuts.html\" target=\"_blank\" rel=\"noreferrer\">Los accionistas plantean un plan de ahorro de £600 millones<\u002Fa>. 11 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Financial Times, recogido por Investing.com.<\u002Fspan> <a href=\"https://www.inve

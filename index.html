d><strong>OpCFaL<\u002Fstrong><\u002Ftd><td class=\"num\">221<\u002Ftd><td class=\"num\">205<\u002Ftd><td class=\"num\">133<\u002Ftd><td class=\"num\"><strong>426<\u002Fstrong><\u002Ftd><td class=\"num dn\"><strong>−13,6%<\u002Fstrong><\u002Ftd><td class=\"num\"><strong>785<\u002Fstrong><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p class=\"cap\" style=\"margin-top:-12px;\">Las cifras del tercer trimestre (ingresos 1.903, EBITDA 566 y caja operativa 133 M€) proceden de la presentación de resultados del grupo; las fuentes consultadas no recogen el acumulado de nueve meses ni el resto de magnitudes. El primer trimestre se obtiene restando el segundo al semestre. Los márgenes son cálculo propio, salvo el del segundo trimestre (32,7%), que es el publicado. Las variaciones son a tipo de cambio constante; en Alemania coinciden con las variaciones en euros.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Financiación<\u002Fh2><span class=\"st\">la filial se financia dentro del grupo · 30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"grid2 liqgrid\">\n      <div class=\"tw\" style=\"margin-bottom:0;\">\n        <table class=\"dt liqt\" style=\"min-width:0;\">\n          <thead><tr><th>Concepto (grupo Telefónica)<\u002Fth><th class=\"num\">Dato<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Deuda financiera neta del grupo<\u002Ftd><td class=\"num\">25.186 M€<\u002Ftd><\u002Ftr>\n            <tr><td>Deuda neta / EBITDAaL (apalancamiento)<\u002Ftd><td class=\"num\">2,63×<\u002Ftd><\u002Ftr>\n            <tr><td>Liquidez del grupo <span class=\"soft\">(a septiembre)<\u002Fspan><\u002Ftd><td class=\"num\">17.500 M€<\u002Ftd><\u002Ftr>\n            <tr class=\"tot\"><td>Vida media de la deuda del grupo <span class=\"soft\">(a septiembre)<\u002Fspan><\u002Ftd><td class=\"num\">11,2 años<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"listbox\" style=\"margin-bottom:0;\">\n        <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Sin riesgo de financiación a corto plazo.<\u002Fb> Al ser una filial del grupo, su financiación depende de Telefónica, S.A., que no tiene vencimientos relevantes que refinanciar hasta 2029.<\u002Fspan><\u002Fdiv>\n        <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>El coste del ajuste se financia con la caja de 2026.<\u002Fb> ≈ 420 M€ de coste frente a 426 M€ de caja operativa en el primer semestre.<\u002Fspan><\u002Fdiv>\n        <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Arrendamientos elevados.<\u002Fb> 403 M€ en el semestre, un tercio del EBITDA, porque la filial alquila las torres en las que instala sus antenas.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:24px;\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= MERCADO ================= -->\n  <section class=\"panel\" data-p=\"mercado\">\n    <p class=\"lead\">Alemania es el único gran país europeo con cuatro redes móviles: Telekom, Vodafone, O2 y 1&amp;1, cuya red sigue en construcción. El mercado permite además la reventa de servicios móviles sin red propia. Tras la migración de 1&amp;1 a la red de Vodafone, O2 ha perdido su principal fuente de ingresos mayoristas: su red registra menos uso y sus costes fijos se reparten entre menos clientes. Este es el argumento con el que la dirección defiende la consolidación del mercado; entretanto, la estrategia se orienta a proteger el margen de la base de clientes propia.<\u002Fp>\n\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Base de clientes<\u002Fh2><span class=\"st\">millones de líneas · 30 de junio de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"chart-card dark\">\n      <svg class=\"fig pie\" viewBox=\"0 0 620 222\" role=\"img\" aria-label=\"Base de clientes a 30 de junio de 2026: móvil de contrato 18,06 millones, menos 25,9% interanual; prepago 13,76 millones, menos 5,4%; conectividad de máquinas 3,28 millones, más 28,4%; banda ancha fija 2,40 millones, más 1,4%.\" style=\"max-width:780px;margin:0 auto;\">\n<text x=\"76\" y=\"34\" font-size=\"11.5\" fill=\"#AEB8CE\" text-anchor=\"middle\">Junio 2025<\u002Ftext><text x=\"226\" y=\"34\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\">Junio 2026<\u002Ftext>\n<path class=\"pie-s\" data-k=\"0\" style=\"transform-origin:76px 124px\" d=\"M76.00,56.00A68,68 0 1 1 52.58,187.84L61.88,162.49A41,41 0 1 0 76.00,83.00Z\" fill=\"#3A7CF6\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"1\" style=\"transform-origin:76px 124px\" d=\"M52.58,187.84A68,68 0 0 1 31.92,72.23L49.42,92.78A41,41 0 0 0 61.88,162.49Z\" fill=\"#86B5FF\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"2\" style=\"transform-origin:76px 124px\" d=\"M31.92,72.23A68,68 0 0 1 53.37,59.88L62.36,85.34A41,41 0 0 0 49.42,92.78Z\" fill=\"#C4CDE0\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"3\" style=\"transform-origin:76px 124px\" d=\"M53.37,59.88A68,68 0 0 1 76.00,56.00L76.00,83.00A41,41 0 0 0 62.36,85.34Z\" fill=\"#5E6B86\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"0\" style=\"transform-origin:226px 124px\" d=\"M226.00,56.00A68,68 0 0 1 233.84,191.55L230.73,164.73A41,41 0 0 0 226.00,83.00Z\" fill=\"#3A7CF6\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"1\" style=\"transform-origin:226px 124px\" d=\"M233.84,191.55A68,68 0 0 1 170.62,84.54L192.61,100.21A41,41 0 0 0 230.73,164.73Z\" fill=\"#86B5FF\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"2\" style=\"transform-origin:226px 124px\" d=\"M170.62,84.54A68,68 0 0 1 199.39,61.42L209.95,86.27A41,41 0 0 0 192.61,100.21Z\" fill=\"#C4CDE0\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"3\" style=\"transform-origin:226px 124px\" d=\"M199.39,61.42A68,68 0 0 1 226.00,56.00L226.00,83.00A41,41 0 0 0 209.95,86.27Z\" fill=\"#5E6B86\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<text x=\"76\" y=\"129\" font-size=\"16\" font-weight=\"700\" fill=\"#FFFFFF\" text-anchor=\"middle\">≈ 43,8 M<\u002Ftext><text x=\"76\" y=\"146\" font-size=\"10.5\" fill=\"#AEB8CE\" text-anchor=\"middle\">líneas<\u002Ftext>\n<text x=\"226\" y=\"129\" font-size=\"16\" font-weight=\"700\" fill=\"#FFFFFF\" text-anchor=\"middle\">37,5 M<\u002Ftext><text x=\"226\" y=\"146\" font-size=\"10.5\" fill=\"#AEB8CE\" text-anchor=\"middle\">líneas<\u002Ftext>\n<text x=\"500\" y=\"60\" font-size=\"10.5\" fill=\"#8D98B0\" text-anchor=\"end\">2025<\u002Ftext><text x=\"556\" y=\"60\" font-size=\"10.5\" fill=\"#8D98B0\" text-anchor=\"end\">2026<\u002Ftext><text x=\"612\" y=\"60\" font-size=\"10.5\" fill=\"#8D98B0\" text-anchor=\"end\">var.<\u002Ftext>\n<g class=\"pie-l\" data-k=\"0\"><rect x=\"310\" y=\"71\" width=\"310\" height=\"27\" fill=\"transparent\"><\u002Frect><circle cx=\"318\" cy=\"84\" r=\"5\" fill=\"#3A7CF6\"><\u002Fcircle><text x=\"332\" y=\"88\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"600\">Móvil de contrato<\u002Ftext><text x=\"500\" y=\"88\" font-size=\"12.5\" fill=\"#AEB8CE\" text-anchor=\"end\">≈ 24,37<\u002Ftext><text x=\"556\" y=\"88\" font-size=\"12.5\" fill=\"#FFFFFF\" text-anchor=\"end\" font-weight=\"600\">18,06<\u002Ftext><text x=\"612\" y=\"88\" font-size=\"12.5\" fill=\"#FF9C9C\" text-anchor=\"end\">−25,9%<\u002Ftext><line x1=\"318\" y1=\"97\" x2=\"612\" y2=\"97\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<g class=\"pie-l\" data-k=\"1\"><rect x=\"310\" y=\"101\" width=\"310\" height=\"27\" fill=\"transparent\"><\u002Frect><circle cx=\"318\" cy=\"114\" r=\"5\" fill=\"#86B5FF\"><\u002Fcircle><text x=\"332\" y=\"118\" font-size=\"12.5\" fill=\"#C4CDE0\">Prepago<\u002Ftext><text x=\"500\" y=\"118\" font-size=\"12.5\" fill=\"#AEB8CE\" text-anchor=\"end\">≈ 14,55<\u002Ftext><text x=\"556\" y=\"118\" font-size=\"12.5\" fill=\"#C4CDE0\" text-anchor=\"end\" font-weight=\"600\">13,76<\u002Ftext><text x=\"612\" y=\"118\" font-size=\"12.5\" fill=\"#FF9C9C\" text-anchor=\"end\">−5,4%<\u002Ftext><line x1=\"318\" y1=\"127\" x2=\"612\" y2=\"127\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<g class=\"pie-l\" data-k=\"2\"><rect x=\"310\" y=\"131\" width=\"310\" height=\"27\" fill=\"transparent\"><\u002Frect><circle cx=\"318\" cy=\"144\" r=\"5\" fill=\"#C4CDE0\"><\u002Fcircle><text x=\"332\" y=\"148\" font-size=\"12.5\" fill=\"#C4CDE0\">Máquinas (IoT)<\u002Ftext><text x=\"500\" y=\"148\" font-size=\"12.5\" fill=\"#AEB8CE\" text-anchor=\"end\">≈ 2,55<\u002Ftext><text x=\"556\" y=\"148\" font-size=\"12.5\" fill=\"#C4CDE0\" text-anchor=\"end\" font-weight=\"600\">3,28<\u002Ftext><text x=\"612\" y=\"148\" font-size=\"12.5\" fill=\"#7FD6CE\" text-anchor=\"end\">+28,4%<\u002Ftext><line x1=\"318\" y1=\"157\" x2=\"612\" y2=\"157\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<g class=\"pie-l\" data-k=\"3\"><rect x=\"310\" y=\"161\" width=\"310\" height=\"27\" fill=\"transparent\"><\u002Frect><circle cx=\"318\" cy=\"174\" r=\"5\" fill=\"#5E6B86\"><\u002Fcircle><text x=\"332\" y=\"178\" font-size=\"12.5\" fill=\"#C4CDE0\">Banda ancha fija<\u002Ftext><text x=\"500\" y=\"178\" font-size=\"12.5\" fill=\"#AEB8CE\" text-anchor=\"end\">≈ 2,37<\u002Ftext><text x=\"556\" y=\"178\" font-size=\"12.5\" fill=\"#C4CDE0\" text-anchor=\"end\" font-weight=\"600\">2,40<\u002Ftext><text x=\"612\" y=\"178\" font-size=\"12.5\" fill=\"#7FD6CE\" text-anchor=\"end\">+1,4%<\u002Ftext><line x1=\"318\" y1=\"187\" x2=\"612\" y2=\"187\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<text x=\"318\" y=\"210\" font-size=\"11\" fill=\"#8D98B0\">Millones de líneas; 2025, estimado.<\u002Ftext>\n<\u002Fsvg>\n    <\u002Fdiv>\n    <p class=\"cap\">La caída del 25,9% en contrato <strong>recoge la salida de los clientes de socios mayoristas, sobre todo 1&amp;1<\u002Fstrong>. La base de contrato propia de O2 crecía un 3% interanual en marzo, y sumó 30.000 altas netas en el segundo trimestre y 49.000 en el tercero.<\u002Fp>\n\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Servicio<\u002Fth><th class=\"num\">Líneas <span class=\"soft\">(junio)<\u002Fspan><\u002Fth><th class=\"num\">Altas netas Q3<\u002Fth><th class=\"num\">Altas netas Q2<\u002Fth><th class=\"num\">Altas netas Q1<\u002Fth><th class=\"num\">Var. interanual <span class=\"soft\">(junio)<\u002Fspan><\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Móvil de contrato<\u002Ftd><td class=\"num\">18.057.000<\u002Ftd><td class=\"num up\">+49.000<\u002Ftd><td class=\"num up\">+30.000<\u002Ftd><td class=\"num up\">+48.000<\u002Ftd><td class=\"num dn\">−25,9%<\u002Ftd><\u002Ftr>\n          <tr><td>Prepago<\u002Ftd><td class=\"num\">13.762.000<\u002Ftd><td class=\"num up\">+12.000<\u002Ftd><td class=\"num dn\">−10.000<\u002Ftd><td class=\"num dn\">−446.000<\u002Ftd><td class=\"num dn\">−5,4%<\u002Ftd><\u002Ftr>\n          <tr><td>Conectividad de máquinas (IoT)<\u002Ftd><td class=\"num\">3.279.000<\u002Ftd><td class=\"num up\">+204.000<\u002Ftd><td class=\"num up\">+134.000<\u002Ftd><td class=\"num up\">+175.000<\u002Ftd><td class=\"num up\">+28,4%<\u002Ftd><\u002Ftr>\n          <tr><td><strong>Total móvil<\u002Fstrong><\u002Ftd><td class=\"num\"><strong>35.097.000<\u002Fstrong><\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num up\"><strong>+153.000<\u002Fstrong><\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num dn\"><strong>−15,3%<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Banda ancha fija<\u002Ftd><td class=\"num\">2.395.000<\u002Ftd><td class=\"num up\">+13.000<\u002Ftd><td class=\"num up\">+14.000<\u002Ftd><td class=\"num up\">+15.000<\u002Ftd><td class=\"num up\">+1,4%<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Entorno competitivo<\u002Fh2><span class=\"st\">movimientos relevantes para la compañía<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Hecho<\u002Fth><th class=\"num\">Fecha<\u002Fth><th>Efecto<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Resultados del tercer trimestre: los ingresos caen un 2,9% y el EBITDA un 9,9%<\u002Ftd><td class=\"num\">12 nov 2026<\u002Ftd><td class=\"soft\">+49.000 contratos, frente a +322.000 de Deutsche Telekom y +10.000 de Vodafone. El plan de ajuste se encuentra en una fase avanzada y prevé nuevas medidas en 2027. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Simsalasim y Revolut usarán la red de O2 desde 2027<\u002Ftd><td class=\"num\">nov 2026<\u002Ftd><td class=\"soft\">Nuevos clientes mayoristas tras la salida de 1&amp;1. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>El consejero delegado, Santiago Argelich Hesse, defiende un mercado de tres operadores<\u002Ftd><td class=\"num\">28 sep 2026<\u002Ftd><td class=\"soft\">Señala que ningún otro gran país tiene cuatro redes y que el modelo alemán de proveedores de servicios es una excepción internacional. <strong>Pendiente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Plan de ajuste: ≈ 1.100 empleos y ≈ 60 de las ≈ 800 tiendas propias en 2026<\u002Ftd><td class=\"num\">29 jul 2026<\u002Ftd><td class=\"soft\">Salidas voluntarias (prejubilaciones e indemnizaciones). Segunda fase prevista en 2027 en atención al cliente y ventas. <strong>Favorable a medio plazo.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Contrato con UGG para llevar fibra a antenas móviles<\u002Ftd><td class=\"num\">1 jul 2026<\u002Ftd><td class=\"soft\">Telefónica Deutschland pasa a ser cliente de UGG, la sociedad de fibra participada al 50% por el grupo. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>El fundador de 1&amp;1, Ralph Dommermuth, se abre a estudiar una operación si Telefónica quisiera retirarse<\u002Ftd><td class=\"num\">19 ene 2026<\u002Ftd><td class=\"soft\">En una entrevista con Handelsblatt; añadió que, según su información, no hay nada previsto. 1&amp;1 tiene más de 12 millones de clientes móviles y unas 2.000 antenas, frente a más de 36.000 de Telekom y unas 27.000 de Vodafone. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>1&amp;1 completa la migración de sus clientes a la red de Vodafone<\u002Ftd><td class=\"num\">2025<\u002Ftd><td class=\"soft\">≈ 12 millones de clientes que usaban la red de O2. Es la principal causa de la caída de ingresos de 2025 y 2026. <strong>Adverso.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Estrategia de valor frente a volumen<\u002Ftd><td class=\"num\">2026<\u002Ftd><td class=\"soft\">Menos promociones y paquetes con precio mínimo de unos 30 € al mes: prioriza clientes rentables frente a crecer en número. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= RIESGOS ================= -->\n  <section class=\"panel\" data-p=\"riesgos\">\n    <p class=\"lead\">El perfil de riesgo es moderado y de carácter comercial y estratégico. La filial no tiene necesidades de financiación, pero sí una limitación de escala: su red está dimensionada para más clientes de los que tiene actualmente. El plan de ajuste mejora el margen y amplía el plazo disponible para actuar, pero no corrige ese desequilibrio. Las oportunidades de mayor alcance pasan por la consolidación del mercado, que no depende solo de Telefónica.<\u002Fp>\n\n    <div class=\"cards3 roblk\">\n      <div class=\"card roc\">\n        <h3>Riesgos<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Retraso en la vuelta al crecimiento.<\u002Fb> El EBITDA cae un 9,9% en el tercer trimestre; la previsión de volver a crecer a lo largo de 2027 depende de que el negocio propio compense el resto del efecto de 1&amp;1.<\u002Fli>\n          <li><b>Erosión del precio.<\u002Fb> El ingreso medio por cliente de contrato cayó en los dos primeros trimestres (−2,8% y −3,2%).<\u002Fli>\n          <li><b>Ejecución del ajuste.<\u002Fb> ≈ 420 M€ de coste en 2026 y una segunda fase en 2027 sin cifrar; el ahorro completo no llega hasta 2028.<\u002Fli>\n          <li><b>Inversión baja.<\u002Fb> Una inversión inferior al 10% de los ingresos protege la caja, pero puede afectar a la calidad de la red frente a Telekom.<\u002Fli>\n          <li><b>Conflicto con minoritarios.<\u002Fb> La protesta por los préstamos a la matriz puede derivar en reclamaciones, aunque el ≈ 6% restante no bloquea decisiones.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card roc\">\n        <h3>Oportunidades<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Consolidación a tres redes.<\u002Fb> Una integración con 1&amp;1 sumaría más de 12 millones de clientes a la red de O2 y reduciría la presión en precio.<\u002Fli>\n          <li><b>Base de comparación favorable.<\u002Fb> Desde finales de 2026, la comparación interanual ya no incluirá a 1&amp;1.<\u002Fli>\n          <li><b>Margen al alza.<\u002Fb> El ahorro de ≈ 185 M€ anuales equivaldría a unos 7 puntos de crecimiento del EBITDA sobre la cifra de 2025.<\u002Fli>\n          <li><b>Fijo y fibra.<\u002Fb> Cinco trimestres seguidos de altas netas en banda ancha, con acceso a la fibra de UGG para ampliar la oferta.<\u002Fli>\n          <li><b>Nuevos socios mayoristas.<\u002Fb> Simsalasim y Revolut desde 2027, que compensan en parte el tráfico perdido con la salida de 1&amp;1.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Opciones en el mercado alemán<\u002Fh2><span class=\"st\">sin probabilidad asignada: no hay información pública suficiente<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Vía<\u002Fth><th>Situación<\u002Fth><th>Qué supondría para Telefónica<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td><strong>Integración con 1&amp;1<\u002Fstrong><\u002Ftd><td class=\"soft\">Planteada públicamente por las dos partes en 2026, sin negociación anunciada.<\u002Ftd><td class=\"soft\">Más escala y una red mejor aprovechada; exige acuerdo de valoración y autorización de la autoridad de competencia alemana o de Bruselas.<\u002Ftd><\u002Ftr>\n          <tr><td><strong>Seguir a cuatro redes con ajuste de costes<\u002Fstrong><\u002Ftd><td class=\"soft\">Situación actual: plan de ajuste 2026–2028 y foco en la base propia.<\u002Ftd><td class=\"soft\">Margen protegido y crecimiento bajo; el valor depende de ejecutar el ahorro.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CALENDARIO Y FUENTES ================= -->\n  <section class=\"panel\" data-p=\"acciones\">\n    <p class=\"lead\">La caída de ingresos ya se modera. Los resultados de los próximos trimestres permitirán valorar si el ajuste restablece la rentabilidad.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Calendario de hitos<\u002Fh2><span class=\"st\">próximos doce meses y más allá<\u002Fspan><\u002Fdiv>\n    <div class=\"rail\">\n      <div class=\"stop t-hot\"><span class=\"when\">Segundo semestre<\u002Fspan><h4>Segunda provisión del ajuste<\u002Fh4><p>≈ 155 M€ adicionales previstos, con las salidas voluntarias y el cierre de tiendas.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-mid\"><span class=\"when\">Febrero 2027<\u002Fspan><h4>Resultados anuales 2026<\u002Fh4><p>Primera comparación sin el grueso del efecto de 1&amp;1 en el trimestre de cierre.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-hot\"><span class=\"when\">2027<\u002Fspan><h4>Segunda fase del ajuste y vuelta al crecimiento<\u002Fh4><p>Atención al cliente y ventas; la dirección prevé volver al crecimiento rentable a lo largo del año. Entrada de Simsalasim y Revolut en la red.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">2028<\u002Fspan><h4>Ahorro completo<\u002Fh4><p>≈ 185 M€ anuales de ahorro de costes.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Fuentes<\u002Fh2><span class=\"st\">información pública consultada el 12 de noviembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"listbox refs\">\n      <ol>\n        <li><span class=\"who\">dpa-AFX, recogido por finanzen.at.<\u002Fspan> <a href=\"https://www.finanzen.at/nachrichten/aktien/ein-ende-der-talfahrt-des-mobilfunkers-o2-ist-nicht-in-sicht-1036754433\" target=\"_blank\" rel=\"noreferrer\">No se ve el final de la caída de O2: resultados del tercer trimestre<\u002Fa>. 12 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">IT Boltwise.<\u002Fspan> <a href=\"https://www.it-boltwise.de/o2-telefonica-umsatz-sinkt-ebitda-faellt-1-100-stellen-sollen-2026-entlasten.html\" target=\"_blank\" rel=\"noreferrer\">O2 Telefónica: bajan los ingresos y el EBITDA<\u002Fa>. 12 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/es/sala-comunicacion/prensa/telefonica-obtiene-beneficio-neto-1-333-millones-euros-operaciones-continuadas-hasta-septiembre-216-revisa-al-alza-objetivos-ebitda-ajustado-opcfal-ajustado-flujo/\" target=\"_blank\" rel=\"noreferrer\">Resultados de enero a septiembre de 2026 del grupo<\u002Fa>. 12 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/06/rdos26t2-eng.pdf\" target=\"_blank\" rel=\"noreferrer\">Informe de resultados de enero a junio de 2026<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/06/rdos26t2-transcript.pdf\" target=\"_blank\" rel=\"noreferrer\">Transcripción de la conferencia de resultados del segundo trimestre<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/04/rdos26t1-eng.pdf\" target=\"_blank\" rel=\"noreferrer\">Informe de resultados de enero a marzo de 2026<\u002Fa>. Mayo de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/01/rdos25t4-eng.pdf\" target=\"_blank\" rel=\"noreferrer\">Informe de resultados de 2025<\u002Fa>. Febrero de 2026.<\u002Fli>\n        <li><span class=\"who\">Investing.com.<\u002Fspan> <a href=\"https://www.investing.com/news/earnings/telefonica-q2-profit-misses-on-german-restructuring-raises-2026-outlook-4818607\" target=\"_blank\" rel=\"noreferrer\">El beneficio del segundo trimestre, por debajo de lo esperado por la reestructuración alemana<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">teltarif.de.<\u002Fspan> <a href=\"https://www.teltarif.de/o2-telefonica-quartalszahlen-umsatz/news/105002.html\" target=\"_blank\" rel=\"noreferrer\">Resultados de O2 Telefónica en el segundo trimestre: empleo y tiendas<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Smartweb.<\u002Fspan> <a href=\"https://www.smartweb.de/news/handy/o2-mobilfunk-im-q2-2026-kann-sich-telefonica-deutschland-gesundbluten\" target=\"_blank\" rel=\"noreferrer\">Ingresos por línea de negocio y base de clientes del segundo trimestre<\u002Fa>. 2026.<\u002Fli>\n        <li><span class=\"who\">dpa, recogido por onvista.<\u002Fspan> <a href=\"https://www.onvista.de/news/2026/07-29-mobilfunker-o2-unter-druck-hoffnung-auf-2027-0-10-26537091\" target=\"_blank\" rel=\"noreferrer\">O2, bajo presión, confía en 2027<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">dpa, recogido por onvista.<\u002Fspan> <a href=\"https://www.onvista.de/news/2026/09-28-telefonica-deutschland-chef-drei-mobilfunk-anbieter-reichen-0-20-26557983\" target=\"_blank\" rel=\"noreferrer\">El consejero delegado de Telefónica Deutschland: tres operadores bastan<\u002Fa>. 28 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">inside digital.<\u002Fspan> <a href=\"https://www.inside-digital.de/news/neue-geruechte-um-o2-wie-ein-halbsatz-den-mobilfunkmarkt-veraendern-kann\" target=\"_blank\" rel=\"noreferrer\">Declaraciones del presidente de 1&amp;1 sobre O2<\u002Fa>. 19 de enero de 2026.<\u002Fli>\n        <li><span class=\"who\">WirtschaftsWoche.<\u002Fspan> <a href=\"https://www.wiwo.de/unternehmen/dienstleister/telefonica-deutschland-jetzt-begehren-die-letzten-aktionaere-auf/100237107.html\" target=\"_blank\" rel=\"noreferrer\">Protesta de los accionistas minoritarios<\u002Fa>. 2 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Spruchverfahren-direkt.<\u002Fspan> <a href=\"https://www.spruchverfahren-direkt.de/?p=3981\" target=\"_blank\" rel=\"noreferrer\">Exclusión de bolsa efectiva y participación de Telefónica (94,1%)<\u002Fa>. Abril de 2024.<\u002Fli>\n        <li><span class=\"who\">MarketScreener.<\u002Fspan> <a href=\"https://de.marketscreener.com/boerse-nachrichten/telef-nica-deutschland-holding-ag-meldet-jahresergebnis-fuer-das-geschaeftsjahr-zum-31-dezember-2025-ce7e5cd8db89f027\" target=\"_blank\" rel=\"noreferrer\">Resultado anual 2025 de Telefónica Deutschland Holding<\u002Fa>. 25 de febrero de 2026.<\u002Fli>\n        <li><span class=\"who\">Unsere Grüne Glasfaser.<\u002Fspan> <a href=\"https://unseregrueneglasfaser.de/blog/unsere-gruene-glasfaser-gewinnt-telefonica-deutschland-als-ftts-kunden-fuer-mobilfunkstandorte/\" target=\"_blank\" rel=\"noreferrer\">Contrato con Telefónica Deutschland para fibra a antenas<\u002Fa>. 1 de julio de 2026.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"filial\" data-f=\"br\">\n<div class=\"wrap\">\n\n  <header class=\"top\"><span class=\"tlogo hq\"><span class=\"ring\">3T<\u002Fspan><span class=\"hq-t\">Resultados<br>2026<\u002Fspan><\u002Fspan>\n    <div>\n      <h1>Vivo (Telefônica Brasil) — Panel de situación<\u002Fh1>\n      <div class=\"sub\">Brasil · Resultados 3T 2026 publicados el 10 de noviembre<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hd-right\">\n      <span class=\"pill\">77,1% de Telefónica<\u002Fspan>\n      <div class=\"quote\" style=\"color:var(--blue-dark);\">1.258 M€<\u002Fdiv>\n      <div class=\"quote-sub\">EBITDA ajustado del 3T 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav class=\"tabs\">\n    <button data-t=\"vision\" class=\"active\">Visión general<\u002Fbutton>\n    <button data-t=\"resumen\">Contexto<\u002Fbutton>\n    <button data-t=\"finanzas\">Situación financiera<\u002Fbutton>\n    <button data-t=\"mercado\">Mercado y clientes<\u002Fbutton>\n    <button data-t=\"riesgos\">Riesgos y oportunidades<\u002Fbutton>\n    <button data-t=\"acciones\">Calendario y fuentes<\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- ================= VISIÓN GENERAL ================= -->\n  <section class=\"panel active\" data-p=\"vision\">\n    <div class=\"kpis\">\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"><\u002Fpolyline><polyline points=\"16 7 22 7 22 13\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"nm\">Ingresos<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">7.907 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+7,4%<\u002Fspan> frente a ene–sep 2025 en reales<br>+13,5% en euros<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">EBITDA ajustado<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">3.473 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+9,9%<\u002Fspan> frente a ene–sep 2025 en reales<br>43,9% de margen<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"><\u002Fpath><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">OpCFaL<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">R$ 3.128 M<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+23,6%<\u002Fspan> frente a Q3 2025<br>≈ 530 M€ al cambio del trimestre<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"><\u002Fline><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"><\u002Fline><polygon points=\"12 2 20 7 4 7\"><\u002Fpolygon><\u002Fsvg><\u002Fspan><span class=\"nm\">Deuda neta / EBITDA<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">0,5×<\u002Fdiv><div class=\"vsub\">con arrendamientos<br>caja neta sin ellos<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">Líneas móviles de contrato<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">74,7 M<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+7,1%<\u002Fspan> frente a sep-2025<br>1,0% de bajas al mes<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"14\" x=\"2\" y=\"5\" rx=\"2\"><\u002Frect><line x1=\"2\" x2=\"22\" y1=\"10\" y2=\"10\"><\u002Fline><\u002Fsvg><\u002Fspan><span class=\"nm\">Pagado a los accionistas<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">R$ 6.990 M<\u002Fdiv><div class=\"vsub\">pagos hasta septiembre<br>R$ 325 M más el 15-dic<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sumcard\"><div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Resumen ejecutivo<\u002Fh2><\u002Fdiv>\n    <p class=\"lead\">Vivo es la filial que más crece del grupo y la que menos deuda tiene. En el tercer trimestre sus ingresos suben un 7,2% en reales, el EBITDA un 10% y el beneficio un 30,1%, ayudado por la venta de cobre y otros activos. En euros, los ingresos crecen un 13,5% hasta septiembre, impulsados por la apreciación interanual del real frente al euro. Los focos de atención son externos: tras <strong>la reelección de Lula el 25 de octubre<\u002Fstrong>, el dólar se ha apreciado un 9% frente al real y <strong>el banco central ha dejado de bajar los tipos de interés<\u002Fstrong>. Además, un litigio fiscal de R$ 7.500 M no figura en la deuda.<\u002Fp>\n    <p class=\"prose\">Telefônica Brasil cotiza en la bolsa de São Paulo y publica sus propias cuentas en reales. Este panel usa las cifras en euros que publica Telefónica para sus filiales, para poder compararlas con las de España y Alemania, y las cifras en reales de la propia Vivo para el detalle local. Las dos series no coinciden exactamente por diferencias de criterio (por ejemplo, el margen de EBITDA del tercer trimestre es del 46,4% en el grupo y del 44,5% en Vivo).<\u002Fp>\n    <div class=\"listbox\">\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Crecimiento por encima de la inflación.<\u002Fb> Ingresos +7,2% y EBITDA +10,0% en reales en el tercer trimestre, con el margen subiendo 1,1 puntos, hasta el 44,5%.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Clientes de más valor.<\u002Fb> Más líneas de contrato (+7,1%), más fibra (8,4 millones de hogares conectados, +10,8%) y más clientes convergentes (4,0 millones, +28%), con el ingreso medio móvil en récord: R$ 32,90 (+4,4%).<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Remuneración elevada.<\u002Fb> R$ 6.990 M pagados a los accionistas hasta septiembre y R$ 325 M más el 15 de diciembre, entre intereses sobre capital propio y una devolución de capital de R$ 4.000 M. El compromiso es repartir al menos el 100% del beneficio de 2026.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-hi\"><\u002Fspan><span><b>Real más débil y tipos sin bajar.<\u002Fb> El dólar pasó de R$ 5,04 el 23 de octubre a R$ 5,51 el 9 de noviembre (+9,4%). El 4 de noviembre el banco central mantuvo el tipo de interés en el 13,75%, tras cinco bajadas seguidas.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Litigio de la tasa del Fistel.<\u002Fb> R$ 7.500 M de tasas de fiscalización de 2020 a 2026 que Vivo no paga mientras el Supremo resuelve; el juicio se ha aplazado sin fecha.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tefbox\" style=\"margin-top:4px;\">\n      <h2>Implicaciones para Telefónica<\u002Fh2>\n      <p class=\"intro\">Telefónica posee el 77,13% de Telefônica Brasil y la consolida globalmente: sus ingresos y su EBITDA se suman íntegros a las cuentas del grupo, pero el 22,87% restante del beneficio y de los dividendos corresponde a otros accionistas y a la autocartera. Brasil es uno de los cuatro mercados núcleo y llega al grupo por cinco vías.<\u002Fp>\n      <div class=\"tefgrid\">\n        <div class=\"tf\"><span class=\"tl\">Ingresos del grupo<\u002Fspan><span class=\"tv\">31,9%<\u002Fspan><p>7.907 de los 24.825 M€ ingresados por el grupo entre enero y septiembre de 2026.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">EBITDA del grupo<\u002Fspan><span class=\"tv\">39,3%<\u002Fspan><p>3.473 de los 8.846 M€ de EBITDA ajustado, prácticamente igual que España (3.501 M€). Es el mercado que más crece.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Dividendos recibidos<\u002Fspan><span class=\"tv\">≈ 910 M€<\u002Fspan><p>El 77,13% de los R$ 6.990 M pagados en 2026, unos R$ 5.390 M, convertidos al tipo implícito del tercer trimestre (5,91 R$/€). Estimación propia.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Efecto divisa<\u002Fspan><span class=\"tv\">+8 p.p.<\u002Fspan><p>Los ingresos crecen un 15,4% en euros frente a un 7,2% en reales en el trimestre: la diferencia se debe a la apreciación interanual del real frente al euro. Con su caída desde el 26 de octubre, este efecto debería reducirse en el cuarto trimestre.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Deuda del grupo<\u002Fspan><span class=\"tv\">Sin carga<\u002Fspan><p>Vivo tiene caja neta si se excluyen los arrendamientos, por lo que no añade deuda financiera al grupo.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"bottom\"><strong>En conjunto.<\u002Fstrong> Brasil es la segunda mayor contribución al grupo y la filial que mejor combina crecimiento, margen y generación de caja. Su riesgo principal es de tipo de cambio y macroeconómico: el valor en euros de los resultados de Vivo dependerá de la política económica del nuevo mandato y de la evolución de los tipos de interés.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CONTEXTO ================= -->\n  <section class=\"panel\" data-p=\"resumen\">\n    <p class=\"lead\">Vivo reúne los rasgos que el grupo busca en sus mercados núcleo: crecimiento por encima de la inflación, mejora del margen, bajo endeudamiento y una remuneración elevada al accionista. Su evolución depende menos de la gestión que del entorno: el tipo de cambio, los tipos de interés y la resolución del litigio sobre las tasas del Fistel. El cuadro siguiente desarrolla estos puntos desde la actividad comercial hasta los resultados, la caja y el balance.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Cuadro de seguimiento<\u002Fh2><\u002Fdiv>\n    <p class=\"prose\">Cada indicador compara un dato publicado con una referencia explícita —el mismo periodo del año anterior, el trimestre precedente o la posición de la competencia— y la desviación mide la distancia entre ambos. Las variaciones operativas son en reales (moneda constante), salvo que se indique lo contrario.<\u002Fp>\n    <div class=\"tw\">\n      <table class=\"dt mon\">\n        <thead><tr><th>Indicador<\u002Fth><th class=\"num\">Actual<\u002Fth><th>Referencia<\u002Fth><th>Desviación<\u002Fth><th>Estado<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr class=\"grp\"><td colspan=\"5\">Operación<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Los ingresos de Vivo de enero a septiembre suman 7.907 M€, frente a 6.966 M€ un año antes: +13,5% en euros. Sin el efecto del tipo de cambio, es decir, en reales, crecen un 7,4%.\"><td class=\"ind\">Ingresos<\u002Ftd><td class=\"num\">7.907 M€ <span class=\"soft\">(ene–sep 2026)<\u002Fspan><\u002Ftd><td class=\"soft\">6.966 M€ en ene–sep 2025<\u002Ftd><td class=\"soft\">+13,5% en euros; +7,4% en reales<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a ene–sep 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El EBITDA ajustado de enero a septiembre suma 3.473 M€, frente a 2.990 M€ un año antes: +16,2% en euros y +9,9% en reales.\"><td class=\"ind\">EBITDA ajustado<\u002Ftd><td class=\"num\">3.473 M€<\u002Ftd><td class=\"soft\">2.990 M€ en ene–sep 2025<\u002Ftd><td class=\"soft\">+16,2% en euros; +9,9% en reales<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a ene–sep 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El margen de EBITDA de Vivo, en reales, fue del 44,5% en el tercer trimestre, 1,1 puntos más que el 43,4% de un año antes.\"><td class=\"ind\">Margen de EBITDA <span class=\"soft\">(Vivo, en reales)<\u002Fspan><\u002Ftd><td class=\"num\">44,5% <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">43,4% en Q3 2025<\u002Ftd><td class=\"soft\">+1,1 p.p.<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Vivo invirtió el 16,0% de sus ingresos en el tercer trimestre, frente al 17,4% de un año antes: 1,4 puntos menos.\"><td class=\"ind\">Inversión sobre ingresos<\u002Ftd><td class=\"num\">16,0% <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">17,4% en Q3 2025<\u002Ftd><td class=\"soft\">−1,4 p.p.<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La caja operativa (OpCFaL) del tercer trimestre fue de R$ 3.128 M, un 23,6% más que en el mismo trimestre de 2025.\"><td class=\"ind\">OpCFaL<\u002Ftd><td class=\"num\">R$ 3.128 M <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">Q3 2025<\u002Ftd><td class=\"soft\">+23,6%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El beneficio neto del tercer trimestre fue de R$ 2.456 M, un 14,8% por encima de los R$ 2.140 M que esperaba el consenso de analistas.\"><td class=\"ind\">Beneficio neto<\u002Ftd><td class=\"num\">R$ 2.456 M <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">Consenso de analistas: R$ 2.140 M<\u002Ftd><td class=\"soft\">+14,8%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto al consenso<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Comercial<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Vivo tiene 74,7 millones de líneas móviles de contrato, frente a 69,8 millones en septiembre de 2025: un 7,1% más.\"><td class=\"ind\">Líneas móviles de contrato<\u002Ftd><td class=\"num\">74,7 M<\u002Ftd><td class=\"soft\">69,8 M en septiembre de 2025<\u002Ftd><td class=\"soft\">+7,1%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a septiembre 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El ingreso medio por cliente móvil fue de R$ 32,90 al mes en el tercer trimestre, frente a R$ 31,5 un año antes: +4,4%.\"><td class=\"ind\">Ingreso medio por cliente móvil<\u002Ftd><td class=\"num\">R$ 32,90<\u002Ftd><td class=\"soft\">R$ 31,5 en Q3 2025<\u002Ftd><td class=\"soft\">+4,4%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Hay 8,4 millones de hogares conectados a la fibra de Vivo, frente a 7,6 millones en septiembre de 2025: +10,8%.\"><td class=\"ind\">Hogares conectados a fibra<\u002Ftd><td class=\"num\">8,4 M<\u002Ftd><td class=\"soft\">7,6 M en septiembre de 2025<\u002Ftd><td class=\"soft\">+10,8%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a septiembre 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Los ingresos de prepago fueron R$ 1.324 M en el tercer trimestre, un 2,9% menos que un año antes.\"><td class=\"ind\">Ingresos de prepago<\u002Ftd><td class=\"num dn\">R$ 1.324 M<\u002Ftd><td class=\"soft\">Q3 2025<\u002Ftd><td class=\"soft\">−2,9%<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Vivo tiene el 37,8% de las líneas móviles de Brasil, cuatro décimas menos que un año antes (38,2%), y sigue siendo el operador líder.\"><td class=\"ind\">Cuota de líneas móviles<\u002Ftd><td class=\"num\">37,8%<\u002Ftd><td class=\"soft\">38,2% un año antes<\u002Ftd><td class=\"soft\">−0,4 p.p.<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a un año antes; sigue líder<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"En banda ancha fija, Vivo tiene el 15,1% del mercado en el segundo trimestre, 4,4 puntos por debajo del líder, Claro (19,5%).\"><td class=\"ind\">Cuota de banda ancha fija <span class=\"soft\">(Q2)<\u002Fspan><\u002Ftd><td class=\"num\">15,1%<\u002Ftd><td class=\"soft\">Claro: 19,5%<\u002Ftd><td class=\"soft\">−4,4 p.p.<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto al líder<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Balance y caja<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La deuda neta equivale a 0,5 veces el EBITDA, una décima más que en junio (≈ 0,4 veces). Se mantiene en un nivel reducido.\"><td class=\"ind\">Deuda neta / EBITDA<\u002Ftd><td class=\"num\">0,5×<\u002Ftd><td class=\"soft\">≈ 0,4× en junio de 2026<\u002Ftd><td class=\"soft\">+0,1×<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a junio 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El flujo de caja libre del tercer trimestre fue de R$ 2.426 M, un 37,7% más que los R$ 1.762 M del mismo trimestre de 2025.\"><td class=\"ind\">Flujo de caja libre<\u002Ftd><td class=\"num\">R$ 2.426 M <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">R$ 1.762 M en Q3 2025<\u002Ftd><td class=\"soft\">+37,7%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Vivo litiga en el Supremo (ADI 7787) unas tasas del Fistel de R$ 7.500 M que no figuran en su deuda. El juicio está aplazado sin fecha.\"><td class=\"ind\">Tasas del Fistel no incluidas en la deuda<\u002Ftd><td class=\"num\">R$ 7.500 M<\u002Ftd><td class=\"soft\">Recurso en el Supremo (ADI 7787)<\u002Ftd><td class=\"soft\">Juicio aplazado sin fecha<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">decisión del Supremo<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p class=\"cap\" style=\"margin-top:-12px;\">El margen y la inversión sobre ingresos de Q3 2025 se obtienen a partir de las variaciones publicadas. La cuota de banda ancha fija es la del informe del regulador del segundo trimestre.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Diagnóstico de conjunto<\u002Fh2><span class=\"st\">fortalezas frente a focos de atención<\u002Fspan><\u002Fdiv>\n    <div class=\"cards3\">\n      <div class=\"card\">\n        <h3 style=\"color:var(--blue-dark);\">Aspectos favorables<\u002Fh3>\n        <ul>\n          <li><strong>Crecimiento por encima de la inflación.<\u002Fstrong> Ingresos y EBITDA crecen más que los precios, y el beneficio sube un 23,3% hasta septiembre.<\u002Fli>\n          <li><strong>Líder en móvil.<\u002Fstrong> 37,8% de cuota de líneas, según el regulador, e ingreso medio por cliente en máximos.<\u002Fli>\n          <li><strong>Fibra y convergencia.<\u002Fstrong> 32,4 millones de hogares pasados, 8,4 millones conectados y 4,0 millones de clientes con fibra y móvil juntos.<\u002Fli>\n          <li><strong>Endeudamiento reducido.<\u002Fstrong> Caja neta de R$ 2.420 M sin arrendamientos y deuda de 0,5 veces el EBITDA con ellos.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3 style=\"color:var(--red-dark);\">Focos de atención<\u002Fh3>\n        <ul>\n          <li><strong>Banda ancha fija fragmentada.<\u002Fstrong> Vivo tiene el 15,1%; los proveedores regionales y otros operadores suman cerca del 60% del mercado.<\u002Fli>\n          <li><strong>Prepago a la baja.<\u002Fstrong> Los ingresos de prepago caen un 2,9%, en línea con la migración de clientes al contrato.<\u002Fli>\n          <li><strong>Beneficio impulsado por ingresos extraordinarios.<\u002Fstrong> El +30,1% del trimestre incluye R$ 366 M por la venta de cobre y otros activos; sin ella, crecería en torno a un 11%. Además, la presentación de resultados cuantifica el impacto de la migración a autorización en +61 M€ de EBITDA en el tercer trimestre y +109 M€ en los nueve meses.<\u002Fli>\n          <li><strong>Deuda bruta al alza.<\u002Fstrong> Sube un 21,1%, hasta R$ 4.820 M, al asumir R$ 900 M de deuda de FiBrasil.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Cuestiones abiertas<\u002Fh3>\n        <ul>\n          <li><strong>Política fiscal y tipos de interés.<\u002Fstrong> El banco central mantuvo el 13,75% el 4 de noviembre; vuelve a reunirse el 8 y 9 de diciembre.<\u002Fli>\n          <li><strong>Fistel.<\u002Fstrong> Si el Supremo diera la razón al Gobierno, Vivo tendría que pagar hasta R$ 7.500 M de tasas atrasadas.<\u002Fli>\n          <li><strong>Reforma tributaria.<\u002Fstrong> Desde 2027 entran los nuevos impuestos sobre el consumo (CBS e IBS); el sector espera un efecto favorable, pero con dos sistemas conviviendo hasta 2033.<\u002Fli>\n          <li><strong>Recompra de acciones.<\u002Fstrong> Programa de hasta R$ 1.000 M hasta febrero de 2027, todavía sin utilizar.<\u002Fli>\n          <li><strong>Vero.<\u002Fstrong> Conversaciones preliminares para comprar este proveedor regional de fibra.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= FINANZAS ================= -->\n  <section class=\"panel\" data-p=\"finanzas\">\n    <p class=\"lead\">La posición financiera de Vivo es sólida. El EBITDA crece a doble dígito, la compañía mantiene caja neta si se excluyen los arrendamientos, que son su único endeudamiento relevante, y su política de remuneración distribuye al menos la totalidad del beneficio sin deteriorar el balance. La caja neta se redujo en el trimestre de R$ 3.787 M a R$ 2.420 M por los pagos a los accionistas y la incorporación de la deuda de FiBrasil. La principal contingencia es el litigio del Fistel, cuyo importe, R$ 7.500 M, equivale a unas tres veces la caja neta.<\u002Fp>\n    <div class=\"hl\">\n      <div class=\"hl-g\"><div class=\"hl-t\">Crecimiento en reales <span>sin el efecto del tipo de cambio · frente a un año antes<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">+7,4%<\u002Fdiv><div class=\"hl-p\">Ingresos<small>enero–septiembre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+9,9%<\u002Fdiv><div class=\"hl-p\">EBITDA ajustado<small>enero–septiembre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+30,1%<\u002Fdiv><div class=\"hl-p\">Beneficio neto<small>tercer trimestre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+37,7%<\u002Fdiv><div class=\"hl-p\">Flujo de caja libre<small>tercer trimestre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hl-g\"><div class=\"hl-t\">Cifras <span>enero–septiembre de 2026 en euros · caja en reales a 30 de septiembre<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">7.907 M€<\u002Fdiv><div class=\"hl-p\">Ingresos<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">3.473 M€<\u002Fdiv><div class=\"hl-p\">EBITDA ajustado<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">43,9%<\u002Fdiv><div class=\"hl-p\">Margen de EBITDA<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">R$ 2.420 M<\u002Fdiv><div class=\"hl-p\">Caja neta<small>sin arrendamientos<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n\n    <div class=\"grid2\">\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Ingresos y EBITDA ajustado<\u002Fh2><span class=\"st\">M€ por trimestre · 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card\">\n          <svg class=\"fig\" viewBox=\"0 0 520 240\" role=\"img\" aria-label=\"Ingresos y EBITDA ajustado de Vivo en euros por trimestre en 2026. Primer trimestre: 2.511 y 1.047 millones de euros. Segundo trimestre: 2.684 y 1.168. Tercer trimestre: 2.712 y 1.258.\">\n            <g stroke=\"#E4E7EC\" stroke-width=\"1\">\n              <line x1=\"50\" y1=\"195\" x2=\"510\" y2=\"195\"><\u002Fline>\n              <line x1=\"50\" y1=\"157.5\" x2=\"510\" y2=\"157.5\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"120\" x2=\"510\" y2=\"120\" stroke-dasharray=\"3 4\"><\u002Fline>\

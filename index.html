CDE0\">MasOrange<\u002Ftext><text x=\"496\" y=\"83\" font-size=\"12.5\" fill=\"#C4CDE0\" text-anchor=\"end\" font-weight=\"600\">41%<\u002Ftext><line x1=\"250\" y1=\"92\" x2=\"496\" y2=\"92\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<g class=\"pie-l\" data-k=\"2\"><rect x=\"242\" y=\"93\" width=\"262\" height=\"27\" fill=\"transparent\"><\u002Frect><circle cx=\"250\" cy=\"106\" r=\"5\" fill=\"#8D98B0\"><\u002Fcircle><text x=\"264\" y=\"110\" font-size=\"12.5\" fill=\"#C4CDE0\">Vodafone<\u002Ftext><text x=\"496\" y=\"110\" font-size=\"12.5\" fill=\"#C4CDE0\" text-anchor=\"end\" font-weight=\"600\">19%<\u002Ftext><line x1=\"250\" y1=\"119\" x2=\"496\" y2=\"119\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<g class=\"pie-l\" data-k=\"3\"><rect x=\"242\" y=\"120\" width=\"262\" height=\"27\" fill=\"transparent\"><\u002Frect><circle cx=\"250\" cy=\"133\" r=\"5\" fill=\"#5E6B86\"><\u002Fcircle><text x=\"264\" y=\"137\" font-size=\"12.5\" fill=\"#C4CDE0\">Digi<\u002Ftext><text x=\"496\" y=\"137\" font-size=\"12.5\" fill=\"#C4CDE0\" text-anchor=\"end\" font-weight=\"600\">13%<\u002Ftext><line x1=\"250\" y1=\"146\" x2=\"496\" y2=\"146\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<g class=\"pie-l\" data-k=\"4\"><rect x=\"242\" y=\"147\" width=\"262\" height=\"27\" fill=\"transparent\"><\u002Frect><circle cx=\"250\" cy=\"160\" r=\"5\" fill=\"#2E3A57\"><\u002Fcircle><text x=\"264\" y=\"164\" font-size=\"12.5\" fill=\"#C4CDE0\">Otros<\u002Ftext><text x=\"496\" y=\"164\" font-size=\"12.5\" fill=\"#C4CDE0\" text-anchor=\"end\" font-weight=\"600\">1%<\u002Ftext><line x1=\"250\" y1=\"173\" x2=\"496\" y2=\"173\" stroke=\"#FFFFFF\" stroke-opacity=\".08\"><\u002Fline><\u002Fg>\n<\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cap\">Datos de la CNMC de julio de 2026, recogidos por la prensa. <strong>Telefónica tiene menos cuota que MasOrange en los dos mercados<\u002Fstrong>, pero es junto con Digi el único gran operador con saldo positivo de portabilidades en julio. Una fusión con Vodafone la llevaría a cerca del 44% en banda ancha y el 45% en móvil, suma aritmética de cuotas que no tiene en cuenta los clientes que se perderían ni las posibles condiciones del regulador.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Base de clientes<\u002Fh2><span class=\"st\">30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Servicio<\u002Fth><th class=\"num\">Accesos<\u002Fth><th class=\"num\">Altas netas Q3<\u002Fth><th class=\"num\">Var. interanual<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Banda ancha fija<\u002Ftd><td class=\"num\">&gt; 6,2 M<\u002Ftd><td class=\"num up\">+46.000<\u002Ftd><td class=\"num up\">+2,2%<\u002Ftd><\u002Ftr>\n          <tr><td>Móvil de contrato<\u002Ftd><td class=\"num\">&gt; 16,0 M<\u002Ftd><td class=\"num up\">+134.000<\u002Ftd><td class=\"num up\">+2,5%<\u002Ftd><\u002Ftr>\n          <tr><td>Televisión (Movistar Plus+)<\u002Ftd><td class=\"num\">≈ 3,97 M<\u002Ftd><td class=\"num up\">+26.000<\u002Ftd><td class=\"num up\">+5,9%<\u002Ftd><\u002Ftr>\n          <tr><td>Clientes convergentes<\u002Ftd><td class=\"num soft\">no publicado<\u002Ftd><td class=\"num up\">+20.000<\u002Ftd><td class=\"num up\">+1,3%<\u002Ftd><\u002Ftr>\n          <tr><td>Internet de las cosas (líneas IoT)<\u002Ftd><td class=\"num\">26 M<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num up\">+111,1%<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Entorno competitivo y regulatorio<\u002Fh2><span class=\"st\">movimientos relevantes para la compañía<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Hecho<\u002Fth><th class=\"num\">Fecha<\u002Fth><th>Efecto<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Resultados de enero a septiembre: la mayor subida de ingresos en ese periodo en más de 15 años<\u002Ftd><td class=\"num\">12 nov 2026<\u002Ftd><td class=\"soft\">Ingresos +2,5% y EBITDA +2,3%. El negocio mayorista cae un 4,5% en el trimestre, frente al −7,9% del anterior. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>El consejo aprueba reorganizar Telefónica España en tres unidades: B2B, B2C y Mayorista<\u002Ftd><td class=\"num\">30 sep 2026<\u002Ftd><td class=\"soft\">Telefónica Tech se integra por completo en B2B España; las funciones de soporte pasan a las áreas corporativas del grupo y España se eleva al mismo nivel directivo que Alemania, Brasil y Reino Unido. <strong>Favorable a medio plazo.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Telefónica retoma las conversaciones con Zegona para comprar Vodafone España<\u002Ftd><td class=\"num\">14 sep 2026<\u002Ftd><td class=\"soft\">Fase preliminar, sin oferta formal. Telefónica valoraría la compañía en unos 8.000 M€; Zegona, en 15.000 M€ (11.100 M€ de capital y 3.600 M€ de deuda neta). <strong>Pendiente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Movistar Plus+ asegura el 100% de LaLiga de 2027/28 a 2031/32<\u002Ftd><td class=\"num\">sep 2026<\u002Ftd><td class=\"soft\">Lote propio por 2.635,85 M€ en cinco temporadas (527,17 M€ cada una) y acuerdo con DAZN por 1.650 M€ (330 M€ por temporada) para emitir también sus partidos. Asegura el principal contenido de la televisión de pago, a mayor coste. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Digi suma más de 1,18 millones de portabilidades entre enero y agosto<\u002Ftd><td class=\"num\">2026<\u002Ftd><td class=\"soft\">+14,7% respecto al mismo periodo de 2025. En julio, solo Movistar y Digi tuvieron saldo positivo; Vodafone, MasOrange y los operadores virtuales, negativo. <strong>Adverso, aunque Movistar mantiene un saldo positivo.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Subida de tarifas de Movistar, Vodafone y Orange; Digi congela precios<\u002Ftd><td class=\"num\">ene 2026<\u002Ftd><td class=\"soft\">Protege el ingreso medio por cliente, pero amplía la diferencia de precio con Digi. <strong>Ambivalente.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>ERE con 4.525 salidas en siete sociedades del grupo en España<\u002Ftd><td class=\"num\">22 dic 2025<\u002Ftd><td class=\"soft\">2.925 en Telefónica de España y 720 en Telefónica Móviles, las dos operadoras principales. Coste estimado por la prensa de unos 1.300 M€. <strong>Favorable a medio plazo.<\u002Fstrong><\u002Ftd><\u002Ftr>\n          <tr><td>Acuerdo mayorista con Digi hasta 2040<\u002Ftd><td class=\"num\">jul 2024<\u002Ftd><td class=\"soft\">Digi usa la red móvil de Telefónica (itinerancia nacional y compartición de red) desde el 1 de enero de 2025 durante dieciséis años, con un coste menor para Digi. Da estabilidad al ingreso mayorista. <strong>Favorable.<\u002Fstrong><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= RIESGOS ================= -->\n  <section class=\"panel\" data-p=\"riesgos\">\n    <p class=\"lead\">El perfil de riesgo de la filial es moderado y no incluye riesgos financieros inmediatos. Los riesgos identificados son comerciales, por la presión en precios y la caída del negocio mayorista, y de asignación de capital, por el coste de los derechos de fútbol y una posible consolidación. Con valoraciones de Vodafone España que difieren en unos 7.000 M€, cualquier acuerdo se evaluará frente al objetivo de apalancamiento del grupo de 2,5× en 2028.<\u002Fp>\n\n    <div class=\"cards3 roblk\">\n      <div class=\"card roc\">\n        <h3>Riesgos<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Competencia en precios.<\u002Fb> Digi no subió tarifas en 2026 y gana cuota en las portabilidades; si el mercado se mueve hacia el precio, el ARPU de 90,4 € es el más expuesto.<\u002Fli>\n          <li><b>Caída del negocio mayorista.<\u002Fb> El −4,5% del trimestre resta ingresos de alto margen, aunque el descenso se modera.<\u002Fli>\n          <li><b>Coste del contenido.<\u002Fb> Unos 857 M€ anuales por LaLiga desde 2027/28; si los abonados no crecen, el margen de la televisión se reduce.<\u002Fli>\n          <li><b>Riesgo de la consolidación.<\u002Fb> Una compra de Vodafone España exigiría pagar entre 8.000 y 15.000 M€ y autorización de Bruselas, probablemente con condiciones (venta de clientes o espectro a un tercero).<\u002Fli>\n          <li><b>Ejecución del ahorro.<\u002Fb> El ERE debe aportar 250 M€ en 2026; en el primer semestre se llevaban unos 90 M€.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card roc\">\n        <h3>Oportunidades<\u002Fh3>\n        <ul class=\"rol\">\n          <li><b>Consolidación a tres operadores.<\u002Fb> Con Vodafone, Telefónica sumaría escala y reduciría la presión en precio, con ahorros de red y de estructura.<\u002Fli>\n          <li><b>Ahorro del ERE.<\u002Fb> A partir de 2027, el ahorro anual completo debería empezar a mejorar el margen.<\u002Fli>\n          <li><b>Empresas y servicios digitales.<\u002Fb> Ya son más de la mitad de los ingresos del segmento de empresas y crecen más que la conectividad.<\u002Fli>\n          <li><b>Internet de las cosas.<\u002Fb> 26 millones de líneas, el doble que hace un año: volumen que todavía aporta poco ingreso por línea, pero abre nuevas fuentes de negocio.<\u002Fli>\n          <li><b>Televisión.<\u002Fb> Movistar Plus+ crece un 5,9% y retiene al cliente convergente; el fútbol asegurado hasta 2032 refuerza esa ventaja.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Opciones en el mercado español<\u002Fh2><span class=\"st\">sin probabilidad asignada: no hay información pública suficiente<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Vía<\u002Fth><th>Situación<\u002Fth><th>Qué supondría para Telefónica<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td><strong>Compra de Vodafone España<\u002Fstrong><\u002Ftd><td class=\"soft\">Conversaciones preliminares con Zegona desde septiembre de 2026, sin oferta y con valoraciones de 8.000 y 15.000 M€.<\u002Ftd><td class=\"soft\">Más escala y menos competencia, a cambio de más deuda, de un proceso regulatorio largo y probablemente de condiciones impuestas por Bruselas.<\u002Ftd><\u002Ftr>\n          <tr><td><strong>Mantener el mercado a cuatro<\u002Fstrong><\u002Ftd><td class=\"soft\">Situación actual. Telefónica crece con precio y retención; Digi crece con volumen.<\u002Ftd><td class=\"soft\">Crecimiento moderado sin desembolso; la caja se destina a dividendo y a reducir deuda.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CALENDARIO Y FUENTES ================= -->\n  <section class=\"panel\" data-p=\"acciones\">\n    <p class=\"lead\">Los próximos meses concentran los hitos que marcarán la evolución de la filial. El más relevante, la negociación por Vodafone España, no tiene fecha pública.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Calendario de hitos<\u002Fh2><span class=\"st\">próximos doce meses y más allá<\u002Fspan><\u002Fdiv>\n    <div class=\"rail\">\n      <div class=\"stop t-hot\"><span class=\"when\">En curso<\u002Fspan><h4>Conversaciones con Zegona<\u002Fh4><p>Retomadas en septiembre de 2026, en fase preliminar y sin oferta formal.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-hot\"><span class=\"when\">Octubre – diciembre<\u002Fspan><h4>Nueva organización en tres unidades<\u002Fh4><p>B2B (con Telefónica Tech), B2C y Mayorista, aprobada el 30 de septiembre.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-mid\"><span class=\"when\">Enero 2027<\u002Fspan><h4>Posible revisión de tarifas<\u002Fh4><p>En 2026 Movistar, Vodafone y Orange subieron precios en enero; no hay anuncio para 2027.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-mid\"><span class=\"when\">Febrero 2027<\u002Fspan><h4>Resultados anuales 2026<\u002Fh4><p>Cierre del primer año del plan Transform &amp; Grow y del objetivo de 250 M€ de ahorro del ERE.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">Agosto 2027<\u002Fspan><h4>Nuevo ciclo de LaLiga<\u002Fh4><p>Empieza el contrato 2027/28–2031/32, con un coste de unos 857 M€ por temporada.<\u002Fp><\u002Fdiv>\n      <div class=\"stop t-low\"><span class=\"when\">2028<\u002Fspan><h4>Objetivos del plan<\u002Fh4><p>Apalancamiento del grupo de 2,5× y hasta 2.300 M€ de ahorro bruto anual.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Fuentes<\u002Fh2><span class=\"st\">información pública consultada el 12 de noviembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"listbox refs\">\n      <ol>\n        <li><span class=\"who\">Europa Press (Diario Siglo XXI).<\u002Fspan> <a href=\"https://www.diariosigloxxi.com/texto-ep/mostrar/20261112081618/telefonica-espana-ingresa-25-hasta-septiembre-mayor-alza-ese-periodo-15-anos\" target=\"_blank\" rel=\"noreferrer\">Telefónica España ingresa un 2,5% más hasta septiembre<\u002Fa>. 12 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/es/sala-comunicacion/prensa/telefonica-obtiene-beneficio-neto-1-333-millones-euros-operaciones-continuadas-hasta-septiembre-216-revisa-al-alza-objetivos-ebitda-ajustado-opcfal-ajustado-flujo/\" target=\"_blank\" rel=\"noreferrer\">Resultados de enero a septiembre de 2026 y previsiones revisadas<\u002Fa>. 12 de noviembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/es/wp-content/uploads/sites/4/2026/07/resultados-telefonica-2t-2026-nota-de-prensa.pdf\" target=\"_blank\" rel=\"noreferrer\">Nota de prensa de resultados de enero a junio de 2026<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/communication-room/press-room/telefonica-posts-an-adjusted-ebitda-of-e5768-million-in-the-first-half-of-the-year-and-upgrades-its-operating-cash-flow-forecast-for-2026/\" target=\"_blank\" rel=\"noreferrer\">Resultados del primer semestre de 2026 y previsiones revisadas<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/wp-content/uploads/sites/5/2026/06/rdos26t2-transcript.pdf\" target=\"_blank\" rel=\"noreferrer\">Transcripción de la conferencia de resultados del segundo trimestre<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/es/wp-content/uploads/sites/4/2026/05/resultados-telefonica-1t-2026-nota-de-prensa.pdf\" target=\"_blank\" rel=\"noreferrer\">Nota de prensa de resultados de enero a marzo de 2026<\u002Fa>. 14 de mayo de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/communication-room/press-room/telefonica-transforms-to-grow/\" target=\"_blank\" rel=\"noreferrer\">Plan estratégico Transform &amp; Grow 2026–2030<\u002Fa>. 4 de noviembre de 2025.<\u002Fli>\n        <li><span class=\"who\">Estrategias de Inversión.<\u002Fspan> <a href=\"https://www.estrategiasdeinversion.com/actualidad/noticias/bolsa-espana/telefonica-redefine-su-estructura-en-espana-para-n-955921\" target=\"_blank\" rel=\"noreferrer\">Telefónica redefine su estructura en España<\u002Fa>. 30 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Telefónica.<\u002Fspan> <a href=\"https://www.telefonica.com/en/shareholders-investors/calendar/\" target=\"_blank\" rel=\"noreferrer\">Calendario de accionistas e inversores<\u002Fa>.<\u002Fli>\n        <li><span class=\"who\">Forbes España.<\u002Fspan> <a href=\"https://forbes.es/economia/879285/telefonica-destaca-los-resultados-extraordinarios-en-espana-en-2025/\" target=\"_blank\" rel=\"noreferrer\">Resultados de Telefónica España en 2025<\u002Fa>. 24 de febrero de 2026.<\u002Fli>\n        <li><span class=\"who\">El Español.<\u002Fspan> <a href=\"https://www.elespanol.com/invertia/empresas/tecnologia/20260729/telefonica-espana-supera-millones-clientes-banda-ancha-roza-abonados-movistar/1003744337600_0.html\" target=\"_blank\" rel=\"noreferrer\">Telefónica España supera los 6,2 millones de clientes de banda ancha<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Press Digital.<\u002Fspan> <a href=\"https://www.pressdigital.es/articulo/economia/2026-07-29/5968687-telefonica-espana-sube-25-ingresos-junio-marca-mejor-avance-desde-2023-segundo-trimestre\" target=\"_blank\" rel=\"noreferrer\">Inversión, caja operativa y altas netas del primer semestre<\u002Fa>. 29 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">ADSLZone.<\u002Fspan> <a href=\"https://www.adslzone.net/noticias/operadores/resultados-telefonica-primer-trimestre-2026-espana/\" target=\"_blank\" rel=\"noreferrer\">Resultados de Telefónica España en el primer trimestre de 2026<\u002Fa>. Mayo de 2026.<\u002Fli>\n        <li><span class=\"who\">CNMC.<\u002Fspan> <a href=\"https://www.cnmc.es/prensa/datos-telecos-julio-20260923\" target=\"_blank\" rel=\"noreferrer\">Datos de telecomunicaciones de julio de 2026<\u002Fa>. 23 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Merca2.<\u002Fspan> <a href=\"https://www.merca2.es/2026/09/28/telefonica-digi-cnmc-portabilidad-2461983/\" target=\"_blank\" rel=\"noreferrer\">Cuotas de mercado y portabilidades por operador<\u002Fa>. 28 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Bolsamanía.<\u002Fspan> <a href=\"https://www.bolsamania.com/noticias/empresas/telefonica-retoma-conversaciones-con-zegona-para-adquirir-vodafone-espana--23561898.html\" target=\"_blank\" rel=\"noreferrer\">Telefónica retoma las conversaciones con Zegona por Vodafone España<\u002Fa>. 14 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Zona Movilidad.<\u002Fspan> <a href=\"https://www.zonamovilidad.es/telefonica-retoma-contactos-zegona-explorar-compra-vodafone-espana\" target=\"_blank\" rel=\"noreferrer\">Valoraciones de Telefónica y Zegona<\u002Fa>. 14 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Movistar Plus+.<\u002Fspan> <a href=\"https://www.movistarplus.es/comunicacion/notas-de-prensa/telefonica-se-adjudica-uno-de-los-paquetes-principales-de-laliga-hasta-2032/\" target=\"_blank\" rel=\"noreferrer\">Telefónica se adjudica uno de los paquetes principales de LaLiga hasta 2032<\u002Fa>. 2026.<\u002Fli>\n        <li><span class=\"who\">Advanced Television.<\u002Fspan> <a href=\"https://www.advanced-television.com/2026/09/15/spain-telefonica-dazn-seal-e1-65bn-laliga-deal/\" target=\"_blank\" rel=\"noreferrer\">Acuerdo de Telefónica y DAZN por 1.650 M€<\u002Fa>. 15 de septiembre de 2026.<\u002Fli>\n        <li><span class=\"who\">Infobae.<\u002Fspan> <a href=\"https://www.infobae.com/espana/2025/12/22/telefonica-reduce-su-plantilla-un-26-tras-llegar-a-un-acuerdo-con-los-sindicatos-4525-salidas-en-el-ere/\" target=\"_blank\" rel=\"noreferrer\">Acuerdo del ERE: 4.525 salidas<\u002Fa>. 22 de diciembre de 2025.<\u002Fli>\n        <li><span class=\"who\">The Objective.<\u002Fspan> <a href=\"https://theobjective.com/economia/telecomunicaciones/2024-07-09/telefonica-acuerdo-mayorista-digi-2040/\" target=\"_blank\" rel=\"noreferrer\">Acuerdo de red móvil con Digi hasta 2040<\u002Fa>. 9 de julio de 2024.<\u002Fli>\n        <li><span class=\"who\">Xataka.<\u002Fspan> <a href=\"https://www.xataka.com/empresas-y-economia/2026-sera-mazazo-bolsillo-tienes-fibra-movil-salvo-que-uses-digi\" target=\"_blank\" rel=\"noreferrer\">Subidas de tarifas de 2026 y congelación de Digi<\u002Fa>.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"filial\" data-f=\"de\">\n<div class=\"wrap\">\n\n  <header class=\"top\"><span class=\"tlogo hq\"><span class=\"ring\">3T<\u002Fspan><span class=\"hq-t\">Resultados<br>2026<\u002Fspan><\u002Fspan>\n    <div>\n      <h1>Telefónica Deutschland — Panel de situación<\u002Fh1>\n      <div class=\"sub\">Alemania · Resultados 3T 2026 publicados el 12 de noviembre (parciales)<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hd-right\">\n      <span class=\"pill\">≈ 94% de Telefónica<\u002Fspan>\n      <div class=\"quote\">566 M€<\u002Fdiv>\n      <div class=\"quote-sub\">EBITDA ajustado del 3T 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav class=\"tabs\">\n    <button data-t=\"vision\" class=\"active\">Visión general<\u002Fbutton>\n    <button data-t=\"resumen\">Contexto<\u002Fbutton>\n    <button data-t=\"finanzas\">Situación financiera<\u002Fbutton>\n    <button data-t=\"mercado\">Mercado y clientes<\u002Fbutton>\n    <button data-t=\"riesgos\">Riesgos y oportunidades<\u002Fbutton>\n    <button data-t=\"acciones\">Calendario y fuentes<\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- ================= VISIÓN GENERAL ================= -->\n  <section class=\"panel active\" data-p=\"vision\">\n    <div class=\"kpis\">\n      <div class=\"kpi warn\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 17 13.5 8.5 8.5 13.5 2 7\"><\u002Fpolyline><polyline points=\"16 17 22 17 22 11\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"nm\">Ingresos<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">1.903 M€<\u002Fdiv><div class=\"vsub\"><span class=\"dn\">−2,9%<\u002Fspan> frente a Q3 2025<br>−11,1% en Q2 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi warn\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">EBITDA ajustado<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">566 M€<\u002Fdiv><div class=\"vsub\"><span class=\"dn\">−9,9%<\u002Fspan> frente a Q3 2025<br>−7,2% en Q2 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi warn\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"><\u002Fpath><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">OpCFaL<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">426 M€<\u002Fdiv><div class=\"vsub\"><span class=\"dn\">−13,6%<\u002Fspan> frente a H1 2025<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"><\u002Fline><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"><\u002Fline><polygon points=\"12 2 20 7 4 7\"><\u002Fpolygon><\u002Fsvg><\u002Fspan><span class=\"nm\">Inversión en red y equipos<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">349 M€<\u002Fdiv><div class=\"vsub\">9,4% de los ingresos<br>−14,4% frente a H1 2025<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">Altas netas de contrato móvil<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">+49.000<\u002Fdiv><div class=\"vsub\">+30.000 en Q2<br>+12.000 en prepago<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi warn\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><line x1=\"16\" x2=\"16\" y1=\"2\" y2=\"6\"><\u002Fline><line x1=\"8\" x2=\"8\" y1=\"2\" y2=\"6\"><\u002Fline><line x1=\"3\" x2=\"21\" y1=\"10\" y2=\"10\"><\u002Fline><\u002Fsvg><\u002Fspan><span class=\"nm\">Provisión de reestructuración<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">265 M€<\u002Fdiv><div class=\"vsub\">≈ 1.100 empleos y 60 tiendas en 2026<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sumcard\"><div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Resumen ejecutivo<\u002Fh2><\u002Fdiv>\n    <p class=\"lead\">Telefónica Deutschland sigue en un año de transición. En el tercer trimestre sus ingresos caen un 2,9%, frente al 11,1% del segundo, porque la salida de <strong>1&amp;1, su mayor cliente mayorista<\u002Fstrong>, deja de afectar a la comparación interanual. <strong>El EBITDA, en cambio, cae un 9,9%<\u002Fstrong>, por un mayor gasto comercial y por ingresos extraordinarios del año anterior. La compañía mantiene su <strong>plan de ajuste<\u002Fstrong> (unos 1.100 empleos y 60 tiendas menos en 2026, con nuevas medidas en 2027) y prevé volver a crecer a lo largo del próximo año.<\u002Fp>\n    <p class=\"prose\">Telefónica Deutschland dejó de cotizar en bolsa en abril de 2024, cuando Telefónica superó el 94% del capital. Las cifras trimestrales proceden de los resultados del grupo Telefónica; los hechos posteriores, de comunicados y de la prensa económica alemana.<\u002Fp>\n    <div class=\"listbox\">\n      <div class=\"li\"><span class=\"dot d-hi\"><\u002Fspan><span><b>Salida de 1&amp;1.<\u002Fb> El operador, que usaba la red de O2 para dar servicio a sus clientes, terminó en 2025 su migración a Vodafone. Es la principal causa de la caída de ingresos, que se modera en el tercer trimestre (−2,9% frente al −11,1% del segundo).<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-hi\"><\u002Fspan><span><b>Rentabilidad a la baja.<\u002Fb> El EBITDA cae un 9,9% en el tercer trimestre, más que en el segundo (−7,2%), por el mayor gasto en marketing y por efectos extraordinarios que mejoraron el año anterior.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Plan de ajuste.<\u002Fb> Provisión de 265 M€ en el segundo trimestre y otros ≈ 155 M€ previstos en el segundo semestre, a cambio de un ahorro anual de ≈ 185 M€ a partir de 2028. La compañía lo da por muy avanzado y prevé más recortes en 2027.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Mejor trimestre comercial del año.<\u002Fb> +49.000 contratos móviles, +12.000 líneas de prepago y +13.000 de banda ancha fija, quinto trimestre seguido de subida. Desde 2027, Simsalasim y Revolut usarán la red de O2.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Consolidación en debate.<\u002Fb> El consejero delegado, Santiago Argelich, defendió el 28 de septiembre que el mercado alemán estaría mejor estructurado con tres operadores de red. En enero, el fundador de 1&amp;1, Ralph Dommermuth, dijo que lo estudiarían si Telefónica quisiera retirarse.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tefbox\" style=\"margin-top:4px;\">\n      <h2>Implicaciones para Telefónica<\u002Fh2>\n      <p class=\"intro\">Telefónica posee en torno al 94% de su filial alemana y la consolida globalmente: sus ingresos, su EBITDA y su caja se suman íntegros a las cuentas del grupo, y la parte de los accionistas minoritarios se descuenta en el beneficio. Alemania es uno de los cuatro mercados núcleo y llega al grupo por cinco vías.<\u002Fp>\n      <div class=\"tefgrid\">\n        <div class=\"tf\"><span class=\"tl\">Ingresos del grupo<\u002Fspan><span class=\"tv\">22,6%<\u002Fspan><p>1.903 de los 8.433 M€ ingresados por el grupo en el tercer trimestre de 2026.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">EBITDA del grupo<\u002Fspan><span class=\"tv\">18,4%<\u002Fspan><p>566 de los 3.078 M€ de EBITDA ajustado del trimestre. Es la única filial consolidada globalmente cuyo EBITDA cae.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Beneficio del grupo<\u002Fspan><span class=\"tv\">−265 M€<\u002Fspan><p>La provisión del segundo trimestre explica que el beneficio neto del grupo (161 M€) quedara muy por debajo de lo que esperaba el mercado (≈ 484 M€).<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Retorno del ajuste<\u002Fspan><span class=\"tv\">≈ 2,3 años<\u002Fspan><p>≈ 420 M€ de coste total en 2026 frente a ≈ 185 M€ de ahorro anual desde 2028. Cálculo propio, sin descontar.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Estrategia<\u002Fspan><span class=\"tv\">Mercado a tres<\u002Fspan><p>Una integración con 1&amp;1 cambiaría el mercado; no hay negociación anunciada y necesitaría autorización de competencia.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"bottom\"><strong>En conjunto.<\u002Fstrong> Alemania resta crecimiento al grupo en 2026. El principal impacto, la salida de 1&amp;1, está dejando de afectar a la comparación interanual y la caída de ingresos se modera, aunque la rentabilidad aún no se recupera. La decisión relevante es estratégica: seguir compitiendo en un mercado de cuatro redes o promover su consolidación.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CONTEXTO ================= -->\n  <section class=\"panel\" data-p=\"resumen\">\n    <p class=\"lead\">Telefónica Deutschland sigue sumando clientes propios, pero ha perdido escala tras la salida de 1&amp;1, el mayor cliente mayorista de su red, en un mercado con cuatro redes. El plan de ajuste protege el margen, pero no recupera los ingresos perdidos. En el tercer trimestre la caída de ingresos se modera y las altas de contrato aumentan, mientras que el EBITDA todavía retrocede. El cuadro siguiente sigue ese mismo orden: actividad comercial, resultados y caja, y medidas de ajuste.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Cuadro de seguimiento<\u002Fh2><\u002Fdiv>\n    <p class=\"prose\">Cada indicador compara un dato publicado con una referencia explícita —el mismo periodo del año anterior, el trimestre precedente o el objetivo que se fijó la compañía— y la desviación mide la distancia entre ambos.<\u002Fp>\n    <div class=\"tw\">\n      <table class=\"dt mon\">\n        <thead><tr><th>Indicador<\u002Fth><th class=\"num\">Actual<\u002Fth><th>Referencia<\u002Fth><th>Desviación<\u002Fth><th>Estado<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr class=\"grp\"><td colspan=\"5\">Operación<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Los ingresos del tercer trimestre fueron 1.903 M€, un 2,9% menos que los 1.960 M€ del mismo trimestre de 2025.\"><td class=\"ind\">Ingresos<\u002Ftd><td class=\"num dn\">1.903 M€ <span class=\"soft\">(Q3 2026)<\u002Fspan><\u002Ftd><td class=\"soft\">1.960 M€ en Q3 2025<\u002Ftd><td class=\"soft\">−2,9%<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La caída de ingresos se ha moderado: −2,9% en el tercer trimestre frente al −11,1% del segundo, 8,2 puntos mejor, porque la salida de 1&amp;1 empieza a desaparecer de la comparación.\"><td class=\"ind\">Ritmo de caída de los ingresos<\u002Ftd><td class=\"num\">−2,9% <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">−11,1% en Q2 2026<\u002Ftd><td class=\"soft\">+8,2 p.p.<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q2 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El EBITDA ajustado del tercer trimestre fue de 566 M€, un 9,9% menos que los 628 M€ del mismo trimestre de 2025.\"><td class=\"ind\">EBITDA ajustado<\u002Ftd><td class=\"num dn\">566 M€ <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">628 M€ en Q3 2025<\u002Ftd><td class=\"soft\">−9,9%<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La caída del EBITDA se ha acentuado: −9,9% en el tercer trimestre frente al −7,2% del segundo, 2,7 puntos peor.\"><td class=\"ind\">Ritmo de caída del EBITDA<\u002Ftd><td class=\"num dn\">−9,9% <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">−7,2% en Q2 2026<\u002Ftd><td class=\"soft\">−2,7 p.p.<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a Q2 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Alemania invirtió el 9,4% de sus ingresos en el primer semestre, frente al 11,8% de 2025: 2,4 puntos menos. Mejora la generación de caja, pero un nivel sostenido tan bajo podría afectar a la calidad de la red.\"><td class=\"ind\">Inversión sobre ingresos<\u002Ftd><td class=\"num\">9,4% <span class=\"soft\">(H1)<\u002Fspan><\u002Ftd><td class=\"soft\">11,8% en 2025<\u002Ftd><td class=\"soft\">−2,4 p.p.<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">mejora la caja; riesgo para la calidad de la red<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La caja operativa (OpCFaL) del primer semestre fue de 426 M€, un 13,6% menos que un año antes. La cifra de 2025 (≈ 493 M€) está calculada a partir de la variación publicada; aún no hay dato de nueve meses.\"><td class=\"ind\">OpCFaL<\u002Ftd><td class=\"num dn\">426 M€ <span class=\"soft\">(H1)<\u002Fspan><\u002Ftd><td class=\"soft\">≈ 493 M€ en H1 2025<\u002Ftd><td class=\"soft\">−13,6%<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto a H1 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Comercial<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"En el tercer trimestre sumó 49.000 líneas móviles de contrato netas, 19.000 más que en el segundo (30.000).\"><td class=\"ind\">Altas netas de contrato móvil<\u002Ftd><td class=\"num up\">+49.000 <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">+30.000 en Q2 2026<\u002Ftd><td class=\"soft\">+19.000<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q2 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Frente a sus competidores, sus 49.000 altas de contrato quedan lejos de las 322.000 de Deutsche Telekom (273.000 menos) y por encima de las 10.000 de Vodafone: segundo de tres operadores.\"><td class=\"ind\">Altas netas de contrato frente a competidores<\u002Ftd><td class=\"num\">+49.000 <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">Deutsche Telekom: +322.000 · Vodafone: +10.000<\u002Ftd><td class=\"soft\">−273.000 frente a Telekom<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">segundo de tres operadores<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Sumó 13.000 líneas netas de banda ancha fija en el tercer trimestre, 1.000 menos que en el segundo (14.000).\"><td class=\"ind\">Altas netas de banda ancha fija<\u002Ftd><td class=\"num up\">+13.000 <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">+14.000 en Q2 2026<\u002Ftd><td class=\"soft\">−1.000<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a Q2 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La tasa de bajas mensual de contrato de O2 fue del 1,2% en el segundo trimestre, una décima más que en el primero (1,1%). Es el último dato publicado.\"><td class=\"ind\">Tasa de bajas mensual de contrato O2<\u002Ftd><td class=\"num\">1,2% <span class=\"soft\">(Q2)<\u002Fspan><\u002Ftd><td class=\"soft\">1,1% en Q1 2026<\u002Ftd><td class=\"soft\">+0,1 p.p.<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a Q1 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El ingreso medio por cliente de contrato de O2 cayó un 3,1% en el tercer trimestre, una décima menos que en el segundo (−3,2%): sigue en negativo.\"><td class=\"ind\">Ingreso medio por cliente (ARPU) de contrato O2<\u002Ftd><td class=\"num dn\">−3,1% <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">−3,2% en Q2 2026<\u002Ftd><td class=\"soft\">+0,1 p.p.<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a Q2 2026; sigue en negativo<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Costes y estrategia<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El plan de ajuste cuesta unos 420 M€ en 2026 y debe ahorrar unos 185 M€ al año desde 2028, por lo que el coste se recuperaría en unos 2,3 años. Está en ejecución.\"><td class=\"ind\">Coste del plan de ajuste en 2026<\u002Ftd><td class=\"num\">≈ 420 M€<\u002Ftd><td class=\"soft\">Ahorro anual de ≈ 185 M€ a partir de 2028<\u002Ftd><td class=\"soft\">Recuperación en ≈ 2,3 años<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">ejecución del plan<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El plan suprime unos 1.100 puestos, un 16% de los 6.820 empleados a tiempo completo de comienzos de 2026, mediante salidas voluntarias que siguen en curso.\"><td class=\"ind\">Plantilla<\u002Ftd><td class=\"num\">−1.100 puestos<\u002Ftd><td class=\"soft\">6.820 a tiempo completo a comienzos de 2026<\u002Ftd><td class=\"soft\">−16%<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">salidas voluntarias en curso<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El director financiero prevé, en declaraciones del 12 de noviembre, que Alemania vuelva a crecer a lo largo de 2027. No hay una cifra con la que medirlo.\"><td class=\"ind\">Vuelta al crecimiento<\u002Ftd><td class=\"num\">A lo largo de 2027<\u002Ftd><td class=\"soft\">Previsión del director financiero, 12 de noviembre<\u002Ftd><td class=\"soft\">—<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">respecto a la previsión<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p class=\"cap\" style=\"margin-top:-12px;\">Del tercer trimestre solo se conocen cifras redondeadas de ingresos y EBITDA y las altas netas; los indicadores marcados con Q2 o H1 mantienen el último dato disponible. El coste del ajuste suma la provisión del segundo trimestre (265 M€) y la prevista para el segundo semestre (≈ 155 M€).<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Diagnóstico de conjunto<\u002Fh2><span class=\"st\">fortalezas frente a focos de atención<\u002Fspan><\u002Fdiv>\n    <div class=\"cards3\">\n      <div class=\"card\">\n        <h3 style=\"color:var(--blue-dark);\">Aspectos favorables<\u002Fh3>\n        <ul>\n          <li><strong>Moderación de la caída de ingresos.<\u002Fstrong> −2,9% en el tercer trimestre frente al −11,1% del segundo: la salida de 1&amp;1 empieza a desaparecer de la comparación.<\u002Fli>\n          <li><strong>Clientes propios al alza.<\u002Fstrong> +49.000 contratos en el trimestre, el mejor dato del año y por encima de Vodafone (+10.000).<\u002Fli>\n          <li><strong>Fijo en crecimiento.<\u002Fstrong> +13.000 líneas de banda ancha, quinto trimestre seguido de altas netas.<\u002Fli>\n          <li><strong>Red y socios.<\u002Fstrong> Cobertura 5G del 99% de la población y dos nuevos clientes mayoristas desde 2027, Simsalasim y Revolut.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3 style=\"color:var(--red-dark);\">Focos de atención<\u002Fh3>\n        <ul>\n          <li><strong>Rentabilidad en caída.<\u002Fstrong> El EBITDA baja un 9,9% en el trimestre, más que en el anterior: es la única filial consolidada globalmente que retrocede.<\u002Fli>\n          <li><strong>Distancia con el líder.<\u002Fstrong> Deutsche Telekom sumó 322.000 contratos en el trimestre, más de seis veces los de O2.<\u002Fli>\n          <li><strong>Precio por cliente.<\u002Fstrong> El ingreso medio por cliente de contrato caía un 3,2% en el segundo trimestre, último dato disponible, por el peso creciente de segundas y terceras líneas, más baratas.<\u002Fli>\n          <li><strong>Coste del ajuste.<\u002Fstrong> ≈ 420 M€ en 2026, con una segunda fase prevista en 2027 en atención al cliente y ventas.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Cuestiones abiertas<\u002Fh3>\n        <ul>\n          <li><strong>Consolidación.<\u002Fstrong> El consejero delegado defiende un mercado de tres redes; no hay operación anunciada ni negociación conocida.<\u002Fli>\n          <li><strong>Accionistas minoritarios.<\u002Fstrong> Según WirtschaftsWoche (julio de 2026), el ≈ 6% restante protesta por los préstamos de la filial a la matriz; no se publican importes.<\u002Fli>\n          <li><strong>Segunda fase del ajuste.<\u002Fstrong> Prevista para 2027, sin cifras de coste ni de ahorro todavía.<\u002Fli>\n          <li><strong>Inversión.<\u002Fstrong> Está por determinar el efecto sobre la calidad de la red si la inversión se mantiene por debajo del 10% de los ingresos.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= FINANZAS ================= -->\n  <section class=\"panel\" data-p=\"finanzas\">\n    <p class=\"lead\">La filial atraviesa una fase de ajuste sin tensión financiera. Sigue generando caja, aunque en menor cuantía: la caja operativa cae más que el EBITDA porque los arrendamientos no se reducen al mismo ritmo que los ingresos. El plan de reestructuración se registra como coste en 2026 y no alcanzará su ahorro completo hasta 2028, por lo que su efecto sobre la caja es negativo a corto plazo. Del tercer trimestre solo se han publicado los ingresos y el EBITDA; los datos de caja, inversión y desglose de ingresos de esta página corresponden al primer semestre.<\u002Fp>\n    <div class=\"hl\">\n      <div class=\"hl-g\"><div class=\"hl-t\">Crecimiento <span>frente al mismo periodo del año anterior<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v neg\">−2,9%<\u002Fdiv><div class=\"hl-p\">Ingresos<small>tercer trimestre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v neg\">−9,9%<\u002Fdiv><div class=\"hl-p\">EBITDA ajustado<small>tercer trimestre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v neg\">−13,6%<\u002Fdiv><div class=\"hl-p\">Caja operativa<small>OpCFaL · primer semestre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">−14,4%<\u002Fdiv><div class=\"hl-p\">Inversión<small>primer semestre<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hl-g\"><div class=\"hl-t\">Cifras <span>tercer trimestre de 2026 · cifras ajustadas<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">1.903 M€<\u002Fdiv><div class=\"hl-p\">Ingresos<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">566 M€<\u002Fdiv><div class=\"hl-p\">EBITDA ajustado<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">29,7%<\u002Fdiv><div class=\"hl-p\">Margen de EBITDA<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">133 M€<\u002Fdiv><div class=\"hl-p\">Caja operativa<small>OpCFaL<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n\n    <div class=\"grid2\">\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Ingresos y EBITDA ajustado<\u002Fh2><span class=\"st\">M€ por trimestre · 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card\">\n          <svg class=\"fig\" viewBox=\"0 0 520 240\" role=\"img\" aria-label=\"Ingresos y EBITDA ajustado de Telefónica Deutschland por trimestre en 2026. Primer trimestre: 1.879 y 586 millones de euros. Segundo trimestre: 1.814 y 592. Tercer trimestre: en torno a 1.900 y 600, cifras redondeadas.\">\n            <g stroke=\"#E4E7EC\" stroke-width=\"1\">\n              <line x1=\"50\" y1=\"195\" x2=\"510\" y2=\"195\"><\u002Fline>\n              <line x1=\"50\" y1=\"165\" x2=\"510\" y2=\"165\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"135\" x2=\"510\" y2=\"135\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"105\" x2=\"510\" y2=\"105\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"75\" x2=\"510\" y2=\"75\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"45\" x2=\"510\" y2=\"45\" stroke-dasharray=\"3 4\"><\u002Fline>\n            <\u002Fg>\n            <g font-size=\"10.5\" fill=\"#98A2B3\" text-anchor=\"end\">\n              <text x=\"44\" y=\"198\">0<\u00 0\" height=\"10\" rx=\"3\" fill=\"#0066FF\"><\u002Frect><text x=\"66\" y=\"234\" font-size=\"11\" fill=\"#475467\">Ingresos<\u002Ftext>\n            <rect x=\"150\" y=\"225\" width=\"10\" height=\"10\" rx=\"3\" fill=\"#5C9BFF\"><\u002Frect><text x=\"166\" y=\"234\" font-size=\"11\" fill=\"#475467\">EBITDA ajustado<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <p class=\"cap\">Cifras del tercer trimestre según la presentación de resultados del grupo (1.903 y 566 M€). <strong>Los ingresos se estabilizan en torno a 1.900 M€ por trimestre<\u002Fstrong>; frente a un año antes bajan un 2,9% y el EBITDA, un 9,9%.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Del EBITDA a la caja operativa<\u002Fh2><span class=\"st\">M€ · H1 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card\">\n          <svg class=\"fig\" viewBox=\"0 0 520 218\" role=\"img\" aria-label=\"Del EBITDA ajustado a la caja operativa en el primer semestre de 2026: EBITDA ajustado 1.178 millones de euros, menos 403 de arrendamientos, EBITDAaL 775, menos 349 de inversión, OpCFaL 426.\">\n            <g stroke=\"#E4E7EC\" stroke-width=\"1\">\n              <line x1=\"50\" y1=\"195\" x2=\"510\" y2=\"195\"><\u002Fline>\n              <line x1=\"50\" y1=\"165\" x2=\"510\" y2=\"165\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"135\" x2=\"510\" y2=\"135\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"105\" x2=\"510\" y2=\"105\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"75\" x2=\"510\" y2=\"75\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"45\" x2=\"510\" y2=\"45\" stroke-dasharray=\"3 4\"><\u002Fline>\n            <\u002Fg>\n            <g font-size=\"10.5\" fill=\"#98A2B3\" text-anchor=\"end\">\n              <text x=\"44\" y=\"198\">0<\u002Ftext><text x=\"44\" y=\"168\">250<\u002Ftext><text x=\"44\" y=\"138\">500<\

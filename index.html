ados brasileños a la elección<\u002Fa>. 26 de octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">Capital Madrid.<\u002Fspan> <a href=\"https://www.capitalmadrid.com/2026/10/5/72527/fitch-mantiene-la-calificacion-bbb-de-telefonica-y-su-perspectiva-estable.html\" target=\"_blank\" rel=\"noreferrer\">Fitch mantiene el BBB de Telefónica<\u002Fa>. 5 de octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">Merca2.<\u002Fspan> <a href=\"https://www.merca2.es/2026/10/05/telefonica-berenberg-fusiones-2466218/\" target=\"_blank\" rel=\"noreferrer\">Berenberg ve improbable la compra de Vodafone España<\u002Fa>. 5 de octubre de 2026.<\u002Fli>\n        <li><span class=\"who\">El Español.<\u002Fspan> <a href=\"https://www.elespanol.com/invertia/empresas/20260702/bbva-diluyo-telefonica-bolsa-alejando-fantasma-irrupcion-nuevo-gran-accionista/1003744306746_0.html\" target=\"_blank\" rel=\"noreferrer\">Accionariado de Telefónica tras la salida parcial de BBVA<\u002Fa>. 2 de julio de 2026.<\u002Fli>\n        <li><span class=\"who\">Investing.com (EFE).<\u002Fspan> <a href=\"https://es.investing.com/news/stock-market-news/murtra-no-se-cierra-a-una-ampliacion-de-capital-en-telefonica-si-la-operacion-es-buena-3572704\" target=\"_blank\" rel=\"noreferrer\">Murtra no se cierra a una ampliación de capital si la operación es buena<\u002Fa>. Marzo de 2026.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"filial\" data-f=\"es\">\n<div class=\"wrap\">\n\n  <header class=\"top\"><span class=\"tlogo hq\"><span class=\"ring\">3T<\u002Fspan><span class=\"hq-t\">Resultados<br>2026<\u002Fspan><\u002Fspan>\n    <div>\n      <h1>Telefónica España — Panel de situación<\u002Fh1>\n      <div class=\"sub\">España · Resultados 3T 2026 publicados el 12 de noviembre<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hd-right\">\n      <span class=\"pill\">100% de Telefónica<\u002Fspan>\n      <div class=\"quote\" style=\"color:var(--blue-dark);\">1.199 M€<\u002Fdiv>\n      <div class=\"quote-sub\">EBITDA ajustado del 3T 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav class=\"tabs\">\n    <button data-t=\"vision\" class=\"active\">Visión general<\u002Fbutton>\n    <button data-t=\"resumen\">Contexto<\u002Fbutton>\n    <button data-t=\"finanzas\">Situación financiera<\u002Fbutton>\n    <button data-t=\"mercado\">Mercado y clientes<\u002Fbutton>\n    <button data-t=\"riesgos\">Riesgos y oportunidades<\u002Fbutton>\n    <button data-t=\"acciones\">Calendario y fuentes<\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- ================= VISIÓN GENERAL ================= -->\n  <section class=\"panel active\" data-p=\"vision\">\n    <div class=\"kpis\">\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"><\u002Fpolyline><polyline points=\"16 7 22 7 22 13\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"nm\">Ingresos<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">9.828 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+2,5%<\u002Fspan> frente a ene–sep 2025<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">EBITDA ajustado<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">3.501 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+2,3%<\u002Fspan> frente a ene–sep 2025<br>35,6% de margen<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"><\u002Fpath><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">OpCFaL<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">1.918 M€<\u002Fdiv><div class=\"vsub\"><span class=\"up\">+2,9%<\u002Fspan> frente a ene–sep 2025<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"><\u002Fline><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"><\u002Fline><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"><\u002Fline><polygon points=\"12 2 20 7 4 7\"><\u002Fpolygon><\u002Fsvg><\u002Fspan><span class=\"nm\">Inversión en red y equipos<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">1.100 M€<\u002Fdiv><div class=\"vsub\">11,2% de los ingresos<br>+1,5% frente a ene–sep 2025<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"nm\">Tasa de bajas (churn)<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">0,7%<\u002Fdiv><div class=\"vsub\">media mensual<br>igual que en Q2 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi\">\n        <div class=\"lbl\"><span class=\"ico\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"14\" x=\"2\" y=\"5\" rx=\"2\"><\u002Frect><line x1=\"2\" x2=\"22\" y1=\"10\" y2=\"10\"><\u002Fline><\u002Fsvg><\u002Fspan><span class=\"nm\">Ingreso por cliente convergente<\u002Fspan><\u002Fdiv>\n        <div class=\"val\">90,4 €<\u002Fdiv><div class=\"vsub\">al mes<br>+1,2% frente a Q3 2025<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sumcard\"><div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Resumen ejecutivo<\u002Fh2><\u002Fdiv>\n    <p class=\"lead\">Telefónica España mantiene una evolución comercial favorable: los ingresos crecen un 2,5% hasta septiembre, la mayor subida en ese periodo en más de 15 años, y la tasa de bajas sigue en el 0,7%. Los focos de atención son tres: <strong>el negocio mayorista cae un 4,5%<\u002Fstrong> en el trimestre, aunque menos que en el anterior; el <strong>coste del fútbol sube<\u002Fstrong> a partir de la temporada 2027/28; y la <strong>posible compra de Vodafone España<\u002Fstrong>, en conversaciones preliminares con Zegona, cambiaría el perfil financiero del grupo.<\u002Fp>\n    <p class=\"prose\">Telefónica España no es una sociedad con deuda propia: es un segmento del grupo y su financiación la gestiona centralmente Telefónica, S.A. Por ello, este panel mide su situación financiera por la rentabilidad y la caja que genera, y no por su endeudamiento. Las cifras proceden de los resultados trimestrales del grupo; los hechos posteriores, de comunicados, de la CNMC (Comisión Nacional de los Mercados y la Competencia, el regulador) y de la prensa económica.<\u002Fp>\n    <div class=\"listbox\">\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Crecimiento simultáneo.<\u002Fb> En el tercer trimestre los ingresos y el EBITDA ajustado suben un 2,6%, con un margen del 36,2%. El OpCFaL crece un 2,9% hasta septiembre.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Base de clientes en máximos.<\u002Fb> En el trimestre suma 134.000 contratos móviles, 46.000 líneas de banda ancha y 26.000 abonados a Movistar Plus+, con la tasa de bajas en el 0,7% mensual.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Moderación de la caída mayorista.<\u002Fb> Los ingresos por alquilar la red a otros operadores caen un 4,5% en el trimestre, frente al −7,9% del anterior. El negocio minorista (venta directa al cliente final) crece un 4,1%.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Fútbol más caro desde 2027/28.<\u002Fb> Movistar Plus+ mantiene el 100% de LaLiga hasta 2032 por unos 857 M€ por temporada: 527 M€ de su propio lote y 330 M€ por los partidos de DAZN, frente a 280 M€ por estos últimos en el ciclo actual.<\u002Fspan><\u002Fdiv>\n      <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Consolidación abierta.<\u002Fb> Telefónica ha retomado las conversaciones con Zegona por Vodafone España. No hay oferta formal y las valoraciones se separan casi al doble: unos 8.000 M€ frente a 15.000 M€.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tefbox\" style=\"margin-top:4px;\">\n      <h2>Implicaciones para Telefónica<\u002Fh2>\n      <p class=\"intro\">Telefónica posee el 100% de su filial española y la consolida globalmente: sus ingresos, su EBITDA y su caja se suman íntegros a las cuentas del grupo. Es el mayor de los cuatro mercados núcleo del plan Transform &amp; Grow y llega al grupo por cinco vías.<\u002Fp>\n      <div class=\"tefgrid\">\n        <div class=\"tf\"><span class=\"tl\">Ingresos del grupo<\u002Fspan><span class=\"tv\">39,6%<\u002Fspan><p>9.828 de los 24.825 M€ ingresados por el grupo entre enero y septiembre de 2026.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">EBITDA del grupo<\u002Fspan><span class=\"tv\">39,6%<\u002Fspan><p>3.501 de los 8.846 M€ de EBITDA ajustado del grupo hasta septiembre. Brasil aporta 3.473 M€, una cifra prácticamente igual.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Generación de caja<\u002Fspan><span class=\"tv\">1.918 M€<\u002Fspan><p>OpCFaL hasta septiembre. Es una medida antes de intereses e impuestos, por eso no es comparable con el flujo de caja libre del grupo (1.963 M€).<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Ahorro de costes<\u002Fspan><span class=\"tv\">250 M€ en 2026<\u002Fspan><p>Objetivo de ahorro del expediente de regulación de empleo (ERE) de diciembre de 2025: 4.525 salidas en siete sociedades. En el primer semestre se habían logrado cerca de 90 M€.<\u002Fp><\u002Fdiv>\n        <div class=\"tf\"><span class=\"tl\">Consolidación<\u002Fspan><span class=\"tv\">8.000–15.000 M€<\u002Fspan><p>Rango de valoraciones de Vodafone España que maneja la prensa. Si se pagase íntegramente con deuda, la deuda neta del grupo (25.186 M€) aumentaría entre un 32% y un 60%.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"bottom\"><strong>En conjunto.<\u002Fstrong> España es la principal fuente de caja del plan: un crecimiento moderado y estable que financia el dividendo y la reducción de deuda. El riesgo se concentra en la asignación de esa caja: el mayor coste de los derechos de fútbol y, en particular, una adquisición de Vodafone España podrían absorber una parte relevante de la caja que genera la filial durante varios años.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CONTEXTO ================= -->\n  <section class=\"panel\" data-p=\"resumen\">\n    <p class=\"lead\">España ha pasado de varios años de estancamiento a un crecimiento moderado y estable, apoyado en la retención de clientes y en el ingreso medio más que en el volumen. La estrategia se sostiene mientras Digi no gane terreno en el segmento de mayor valor. La decisión relevante para los próximos años es de carácter corporativo: consolidar el mercado mediante una adquisición o seguir compitiendo con cuatro operadores. El cuadro siguiente recorre esta secuencia: actividad comercial, resultados y caja, y costes y decisiones estratégicas.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Cuadro de seguimiento<\u002Fh2><\u002Fdiv>\n    <p class=\"prose\">Cada indicador compara un dato publicado con una referencia explícita —el mismo periodo del año anterior, el trimestre precedente o el objetivo que se fijó la compañía— y la desviación mide la distancia entre ambos.<\u002Fp>\n    <div class=\"tw\">\n      <table class=\"dt mon\">\n        <thead><tr><th>Indicador<\u002Fth><th class=\"num\">Actual<\u002Fth><th>Referencia<\u002Fth><th>Desviación<\u002Fth><th>Estado<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr class=\"grp\"><td colspan=\"5\">Operación<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Los ingresos de enero a septiembre suman 9.828 M€, un 2,5% más que en el mismo periodo de 2025. La cifra de 2025 (≈ 9.588 M€) está calculada a partir de la variación publicada.\"><td class=\"ind\">Ingresos<\u002Ftd><td class=\"num\">9.828 M€ <span class=\"soft\">(ene–sep 2026)<\u002Fspan><\u002Ftd><td class=\"soft\">≈ 9.588 M€ en ene–sep 2025<\u002Ftd><td class=\"soft\">+2,5%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a ene–sep 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El EBITDA ajustado de enero a septiembre suma 3.501 M€, un 2,3% más que un año antes. La cifra de 2025 (≈ 3.422 M€) está calculada a partir de la variación publicada.\"><td class=\"ind\">EBITDA ajustado<\u002Ftd><td class=\"num\">3.501 M€<\u002Ftd><td class=\"soft\">≈ 3.422 M€ en ene–sep 2025<\u002Ftd><td class=\"soft\">+2,3%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a ene–sep 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El margen de EBITDA ajustado es del 35,6% hasta septiembre, frente a un 35,7% aproximado un año antes: prácticamente estable, una décima menos.\"><td class=\"ind\">Margen de EBITDA ajustado<\u002Ftd><td class=\"num\">35,6%<\u002Ftd><td class=\"soft\">≈ 35,7% en ene–sep 2025<\u002Ftd><td class=\"soft\">≈ −0,1 p.p.<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a ene–sep 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"España invierte el 11,2% de sus ingresos hasta septiembre. No tiene previsión propia; la referencia es la del grupo para 2026, en torno al 12%, de la que queda 0,8 puntos por debajo.\"><td class=\"ind\">Inversión sobre ingresos<\u002Ftd><td class=\"num\">11,2%<\u002Ftd><td class=\"soft\">Previsión del grupo para 2026: ≈ 12%<\u002Ftd><td class=\"soft\">−0,8 p.p.<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto a la previsión del grupo<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La caja operativa (OpCFaL, EBITDA tras arrendamientos menos inversión) suma 1.918 M€ hasta septiembre, un 2,9% más que un año antes. La cifra de 2025 (≈ 1.864 M€) está calculada a partir de la variación publicada.\"><td class=\"ind\">OpCFaL<\u002Ftd><td class=\"num\">1.918 M€<\u002Ftd><td class=\"soft\">≈ 1.864 M€ en ene–sep 2025<\u002Ftd><td class=\"soft\">+2,9%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a ene–sep 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Comercial<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"La tasa de bajas mensual fue del 0,7% en el tercer trimestre, una décima menos que la media de 2025 (0,8%): se reducen las bajas.\"><td class=\"ind\">Tasa de bajas mensual<\u002Ftd><td class=\"num\">0,7% <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">0,8% de media en 2025<\u002Ftd><td class=\"soft\">−0,1 p.p.<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Cada cliente convergente (fibra, móvil y televisión en un mismo paquete) paga 90,4 € al mes, un 1,2% más que un año antes. La cifra de 2025 (≈ 89,3 €) está calculada a partir de la variación publicada.\"><td class=\"ind\">Ingreso medio por cliente convergente<\u002Ftd><td class=\"num\">90,4 €<\u002Ftd><td class=\"soft\">≈ 89,3 € en Q3 2025<\u002Ftd><td class=\"soft\">+1,2%<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q3 2025<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"En el tercer trimestre sumó 134.000 líneas móviles de contrato netas, 23.000 más que en el segundo trimestre (+21%).\"><td class=\"ind\">Altas netas de contrato móvil<\u002Ftd><td class=\"num up\">+134.000<\u002Ftd><td class=\"soft\">+111.000 en Q2 2026<\u002Ftd><td class=\"soft\">+23.000 (+21%)<\u002Ftd><td><span class=\"stt st-ok\">Favorable<\u002Fspan><span class=\"stref\">respecto a Q2 2026<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Los ingresos mayoristas, los que Telefónica cobra a otros operadores por usar su red, cayeron un 4,5% en el tercer trimestre, mientras los minoristas crecieron un 4,1%: 8,6 puntos de diferencia.\"><td class=\"ind\">Ingresos mayoristas<\u002Ftd><td class=\"num dn\">−4,5% <span class=\"soft\">(Q3)<\u002Fspan><\u002Ftd><td class=\"soft\">Ingresos minoristas: +4,1%<\u002Ftd><td class=\"soft\">−8,6 p.p.<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto al negocio minorista<\u002Fspan><\u002Ftd><\u002Ftr>\n\n          <tr class=\"grp\"><td colspan=\"5\">Costes y estrategia<\u002Ftd><\u002Ftr>\n          <tr data-exp=\"El expediente de regulación de empleo (ERE) de diciembre de 2025 debe ahorrar 250 M€ en 2026. En el primer semestre llevaba unos 90 M€, el 36% del objetivo anual.\"><td class=\"ind\">Ahorro del ERE<\u002Ftd><td class=\"num\">≈ 90 M€ <span class=\"soft\">(H1)<\u002Fspan><\u002Ftd><td class=\"soft\">Objetivo de 250 M€ en 2026<\u002Ftd><td class=\"soft\">36% del objetivo en el primer semestre<\u002Ftd><td><span class=\"stt st-in\">En línea<\u002Fspan><span class=\"stref\">respecto al objetivo anual<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"Desde la temporada 2027/28, LaLiga costará unos 857 M€ por temporada. La parte que pagaba DAZN en el ciclo 2022–2027 (280 M€) sube 50 M€, un 17,9%.\"><td class=\"ind\">Coste de LaLiga por temporada, desde 2027/28<\u002Ftd><td class=\"num\">≈ 857 M€<\u002Ftd><td class=\"soft\">Parte de DAZN: 280 M€ en el ciclo actual<\u002Ftd><td class=\"soft\">Parte de DAZN: +50 M€ (+17,9%)<\u002Ftd><td><span class=\"stt st-bad\">Desfavorable<\u002Fspan><span class=\"stref\">respecto al ciclo 2022–2027<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr data-exp=\"No hay oferta formal por Vodafone España. Las valoraciones que maneja la prensa van de 8.000 M€ (Telefónica) a 15.000 M€ (Zegona), una diferencia de 7.000 M€ que mantiene la negociación abierta.\"><td class=\"ind\">Compra de Vodafone España<\u002Ftd><td class=\"num\">Sin oferta<\u002Ftd><td class=\"soft\">Valoraciones: 8.000 M€ (Telefónica) y 15.000 M€ (Zegona)<\u002Ftd><td class=\"soft\">Diferencia de 7.000 M€<\u002Ftd><td><span class=\"stt st-watch\">Pendiente<\u002Fspan><span class=\"stref\">negociación con Zegona<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p class=\"cap\" style=\"margin-top:-12px;\">Las referencias de 2025 marcadas con ≈ se obtienen a partir de las cifras de 2026 y de las variaciones publicadas; pueden diferir en unos pocos millones de las cifras originales por redondeo.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Diagnóstico de conjunto<\u002Fh2><span class=\"st\">fortalezas frente a focos de atención<\u002Fspan><\u002Fdiv>\n    <div class=\"cards3\">\n      <div class=\"card\">\n        <h3 style=\"color:var(--blue-dark);\">Aspectos favorables<\u002Fh3>\n        <ul>\n          <li><strong>Crecimiento en todas las métricas.<\u002Fstrong> 2025 fue el primer año desde 2008 con ingresos, EBITDA y caja operativa creciendo a la vez, y los nueve primeros meses de 2026 mantienen la tendencia.<\u002Fli>\n          <li><strong>Fidelidad del cliente.<\u002Fstrong> Tasa de bajas del 0,7% mensual y altas netas positivas en los cuatro servicios principales en el trimestre.<\u002Fli>\n          <li><strong>Ingreso por cliente al alza con una base estable.<\u002Fstrong> 90,4 € al mes por cliente convergente, un 1,2% más que un año antes, con la base de contratos móviles en máximos.<\u002Fli>\n          <li><strong>Empresas y servicios digitales.<\u002Fstrong> Los servicios digitales (nube, ciberseguridad, IoT) ya son más de la mitad de los ingresos del segmento de empresas, y las líneas IoT se duplican en un año, hasta 26 millones.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3 style=\"color:var(--red-dark);\">Focos de atención<\u002Fh3>\n        <ul>\n          <li><strong>Negocio mayorista.<\u002Fstrong> Cae un 4,5% en el trimestre, menos que el −7,9% del anterior. Es un ingreso de margen elevado, al apoyarse en una red ya desplegada.<\u002Fli>\n          <li><strong>Presión de Digi.<\u002Fstrong> El operador de bajo coste sumó más de 1,18 millones de portabilidades entre enero y agosto de 2026 (+14,7%) y no subió precios en 2026.<\u002Fli>\n          <li><strong>Margen estable, no creciente.<\u002Fstrong> El margen hasta septiembre es del 35,6%, casi igual que un año antes: el ahorro del ERE todavía no se refleja en una mejora visible.<\u002Fli>\n          <li><strong>Coste del contenido.<\u002Fstrong> Desde la temporada 2027/28, unos 857 M€ anuales por LaLiga, equivalentes al 6,6% de los ingresos de 2025.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Cuestiones abiertas<\u002Fh3>\n        <ul>\n          <li><strong>Vodafone España.<\u002Fstrong> Conversaciones preliminares, sin oferta; Banco Sabadell no espera movimientos corporativos antes de 2027.<\u002Fli>\n          <li><strong>Posición de Bruselas.<\u002Fstrong> Cualquier fusión a tres operadores necesitaría autorización de la Comisión Europea, que no ha fijado aún un criterio claro para el sector.<\u002Fli>\n          <li><strong>Causa de la caída mayorista.<\u002Fstrong> No se detalla qué contratos o clientes explican el descenso.<\u002Fli>\n          <li><strong>Subida de precios de 2027.<\u002Fstrong> No se ha anunciado todavía si habrá revisión de tarifas en enero, como en 2026.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= FINANZAS ================= -->\n  <section class=\"panel\" data-p=\"finanzas\">\n    <p class=\"lead\">La filial no tiene deuda propia que atender y genera caja de forma estable: unos 2.500 M€ anuales de caja operativa, con una inversión contenida en torno al 11% de los ingresos. Esa caja financia el dividendo y la reducción de deuda del grupo. La cuestión financiera relevante es de asignación de capital: qué parte se destina a la remuneración del accionista y a la reducción de deuda, y qué parte a contenidos o a una adquisición en el mercado español.<\u002Fp>\n    <div class=\"hl\">\n      <div class=\"hl-g\"><div class=\"hl-t\">Crecimiento <span>enero–septiembre de 2026 frente al mismo periodo de 2025<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">+2,5%<\u002Fdiv><div class=\"hl-p\">Ingresos<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+2,3%<\u002Fdiv><div class=\"hl-p\">EBITDA ajustado<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+2,5%<\u002Fdiv><div class=\"hl-p\">EBITDAaL<small>tras arrendamientos<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">+2,9%<\u002Fdiv><div class=\"hl-p\">Caja operativa<small>OpCFaL<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hl-g\"><div class=\"hl-t\">Cifras <span>enero–septiembre de 2026 · cifras ajustadas<\u002Fspan><\u002Fdiv>\n        <div class=\"hl-row\">\n          <div class=\"hl-i\"><div class=\"hl-v\">3.501 M€<\u002Fdiv><div class=\"hl-p\">EBITDA ajustado<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">35,6%<\u002Fdiv><div class=\"hl-p\">Margen de EBITDA<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">11,2%<\u002Fdiv><div class=\"hl-p\">Inversión / ingresos<\u002Fdiv><\u002Fdiv>\n          <div class=\"hl-i\"><div class=\"hl-v\">1.918 M€<\u002Fdiv><div class=\"hl-p\">Caja operativa<small>OpCFaL<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n\n    <div class=\"grid2\">\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Ingresos y EBITDA ajustado<\u002Fh2><span class=\"st\">M€ por trimestre · 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card\">\n          <svg class=\"fig\" viewBox=\"0 0 520 240\" role=\"img\" aria-label=\"Ingresos y EBITDA ajustado de Telefónica España por trimestre en 2026. Primer trimestre: 3.233 y 1.150 millones de euros. Segundo trimestre: 3.279 y 1.151. Tercer trimestre: 3.316 y 1.199.\">\n            <g stroke=\"#E4E7EC\" stroke-width=\"1\">\n              <line x1=\"50\" y1=\"195\" x2=\"510\" y2=\"195\"><\u002Fline>\n              <line x1=\"50\" y1=\"157.5\" x2=\"510\" y2=\"157.5\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"120\" x2=\"510\" y2=\"120\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"82.5\" x2=\"510\" y2=\"82.5\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"45\" x2=\"51  2026<\u002Ftext><text x=\"290\" y=\"211\">Q2 2026<\u002Ftext><text x=\"430\" y=\"211\">Q3 2026<\u002Ftext><\u002Fg>\n            <rect x=\"50\" y=\"225\" width=\"10\" height=\"10\" rx=\"3\" fill=\"#0066FF\"><\u002Frect><text x=\"66\" y=\"234\" font-size=\"11\" fill=\"#475467\">Ingresos<\u002Ftext>\n            <rect x=\"150\" y=\"225\" width=\"10\" height=\"10\" rx=\"3\" fill=\"#5C9BFF\"><\u002Frect><text x=\"166\" y=\"234\" font-size=\"11\" fill=\"#475467\">EBITDA ajustado<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <p class=\"cap\">Los ingresos suben trimestre a trimestre en 2026. <strong>El EBITDA del tercer trimestre, 1.199 M€, es el más alto del año<\u002Fstrong>, con un margen del 36,2%.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Del EBITDA a la caja operativa<\u002Fh2><span class=\"st\">M€ · ene–sep 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card\">\n          <svg class=\"fig\" viewBox=\"0 0 520 218\" role=\"img\" aria-label=\"Del EBITDA ajustado a la caja operativa entre enero y septiembre de 2026: EBITDA ajustado 3.501 millones de euros, menos 483 de arrendamientos, EBITDAaL 3.018, menos 1.100 de inversión, OpCFaL 1.918.\">\n            <g stroke=\"#E4E7EC\" stroke-width=\"1\">\n              <line x1=\"50\" y1=\"195\" x2=\"510\" y2=\"195\"><\u002Fline>\n              <line x1=\"50\" y1=\"157.5\" x2=\"510\" y2=\"157.5\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"120\" x2=\"510\" y2=\"120\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"82.5\" x2=\"510\" y2=\"82.5\" stroke-dasharray=\"3 4\"><\u002Fline>\n              <line x1=\"50\" y1=\"45\" x2=\"510\" y2=\"45\" stroke-dasharray=\"3 4\"><\u002Fline>\n            <\u002Fg>\n            <g font-size=\"10.5\" fill=\"#98A2B3\" text-anchor=\"end\">\n              <text x=\"44\" y=\"198\">0<\u002Ftext><text x=\"44\" y=\"160.5\">1.000<\u002Ftext><text x=\"44\" EBITDAaL<\u002Ftext><text x=\"372\" y=\"211\">Inversión<\u002Ftext><text x=\"464\" y=\"211\">Caja operativa<\u002Ftext><\u002Fg>\n          <\u002Fsvg>\n          <p class=\"fig-cap\">Arrendamientos deducidos por diferencia entre el EBITDA y el EBITDAaL publicados.<\u002Fp>\n        <\u002Fdiv>\n        <p class=\"cap\">De cada 100 € de EBITDA, unos 14 € se destinan a arrendamientos y 31 € a inversión. <strong>Resultan 55 € de caja operativa<\u002Fstrong>, que es lo que la filial aporta al grupo para pagar intereses, impuestos y dividendos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Principales magnitudes<\u002Fh2><span class=\"st\">millones de euros · cifras ajustadas<\u002Fspan><\u002Fdiv>\n    <div class=\"tw\">\n      <table class=\"dt\">\n        <thead><tr><th>Magnitud<\u002Fth><th class=\"num\">Q1 2026<\u002Fth><th class=\"num\">Q2 2026<\u002Fth><th class=\"num\">Q3 2026<\u002Fth><th class=\"num\">Ene–sep 2026<\u002Fth><th class=\"num\">Var. ene–sep<\u002Fth><th class=\"num\">FY 2025<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Ingresos totales<\u002Ftd><td class=\"num\">3.233<\u002Ftd><td class=\"num\">3.279<\u002Ftd><td class=\"num\">3.316<\u002Ftd><td class=\"num\">9.828<\u002Ftd><td class=\"num up\">+2,5%<\u002Ftd><td class=\"num\">13.012<\u002Ftd><\u002Ftr>\n          <tr><td class=\"soft\">variación interanual<\u002Ftd><td class=\"num soft\">+2,0%<\u002Ftd><td class=\"num soft\">+2,9%<\u002Ftd><td class=\"num soft\">+2,6%<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">+1,7%<\u002Ftd><\u002Ftr>\n          <tr><td>EBITDA ajustado<\u002Ftd><td class=\"num\">1.150<\u002Ftd><td class=\"num\">1.151<\u002Ftd><td class=\"num\">1.199<\u002Ftd><td class=\"num\">3.501<\u002Ftd><td class=\"num up\">+2,3%<\u002Ftd><td class=\"num\">4.691<\u002Ftd><\u002Ftr>\n          <tr><td>Margen de EBITDA<\u002Ftd><td class=\"num\">35,6%<\u002Ftd><td class=\"num\">35,1%<\u002Ftd><td class=\"num\">36,2%<\u002Ftd><td class=\"num\">35,6%<\u002Ftd><td class=\"num soft\">≈ −0,1 p.p.<\u002Ftd><td class=\"num\">36,1%<\u002Ftd><\u002Ftr>\n          <tr><td>EBITDAaL <span class=\"soft\">(tras arrendamientos)<\u002Fspan><\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">1.036<\u002Ftd><td class=\"num\">3.018<\u002Ftd><td class=\"num up\">+2,5%<\u002Ftd><td class=\"num\">4.047<\u002Ftd><\u002Ftr>\n          <tr><td>Inversión en red y equipos<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">380<\u002Ftd><td class=\"num\">1.100<\u002Ftd><td class=\"num soft\">+1,5%<\u002Ftd><td class=\"num\">1.522<\u002Ftd><\u002Ftr>\n          <tr><td>Inversión / ingresos<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">11,5%<\u002Ftd><td class=\"num\">11,2%<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\">11,7%<\u002Ftd><\u002Ftr>\n          <tr><td><strong>OpCFaL<\u002Fstrong><\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num soft\">—<\u002Ftd><td class=\"num\"><strong>656<\u002Fstrong><\u002Ftd><td class=\"num\"><strong>1.918<\u002Fstrong><\u002Ftd><td class=\"num up\"><strong>+2,9%<\u002Fstrong><\u002Ftd><td class=\"num\"><strong>2.525<\u002Fstrong><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p class=\"cap\" style=\"margin-top:-12px;\">Los márgenes son cálculo propio (EBITDA entre ingresos). La inversión y la caja operativa del tercer trimestre se obtienen restando el primer semestre de la cifra de nueve meses.<\u002Fp>\n\n    <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Financiación del grupo<\u002Fh2><span class=\"st\">la filial se financia a través de Telefónica, S.A. · 30 de septiembre de 2026<\u002Fspan><\u002Fdiv>\n    <div class=\"grid2 liqgrid\">\n      <div class=\"tw\" style=\"margin-bottom:0;\">\n        <table class=\"dt liqt\" style=\"min-width:0;\">\n          <thead><tr><th>Concepto<\u002Fth><th class=\"num\">Dato<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Deuda financiera neta del grupo<\u002Ftd><td class=\"num\">25.186 M€<\u002Ftd><\u002Ftr>\n            <tr><td>Variación interanual<\u002Ftd><td class=\"num up\">−10,8%<\u002Ftd><\u002Ftr>\n            <tr><td>Deuda neta / EBITDAaL (apalancamiento)<\u002Ftd><td class=\"num\">2,63×<\u002Ftd><\u002Ftr>\n            <tr><td>Coste de la deuda total sin arrendamientos <span class=\"soft\">(a septiembre)<\u002Fspan><\u002Ftd><td class=\"num\">2,85%<\u002Ftd><\u002Ftr>\n            <tr class=\"tot\"><td>Objetivo de apalancamiento para 2028<\u002Ftd><td class=\"num\">2,5×<\u002Ftd><\u002Ftr>\n            <tr class=\"pm\"><td><b>Pro memoria · financiación captada en 2026.<\u002Fb> Cinco operaciones a largo plazo, entre ellas el primer bono del grupo en dólares australianos.<\u002Ftd><td class=\"num\">4.500 M€<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"listbox\" style=\"margin-bottom:0;\">\n        <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Sin vencimientos que refinanciar hasta 2029.<\u002Fb> Según la dirección financiera del grupo, la liquidez es holgada y no hay deuda relevante que renovar en los próximos dos años y medio.<\u002Fspan><\u002Fdiv>\n        <div class=\"li\"><span class=\"dot d-op\"><\u002Fspan><span><b>Deuda a la baja.<\u002Fb> La deuda neta se ha reducido un 10,8% en doce meses, hasta 25.186 M€. El coste de la deuda total, sin arrendamientos, es del 2,85% a septiembre, frente al 3,05% de un año antes.<\u002Fspan><\u002Fdiv>\n        <div class=\"li\"><span class=\"dot d-md\"><\u002Fspan><span><b>Una consolidación alteraría la posición financiera.<\u002Fb> Una compra de Vodafone España financiada con deuda alejaría al grupo del objetivo de 2,5× en 2028, salvo que se combine con otras fuentes de financiación.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:24px;\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= MERCADO ================= -->\n  <section class=\"panel\" data-p=\"mercado\">\n    <p class=\"lead\">El mercado español cuenta con cuatro grandes operadores tras la fusión de Orange y MásMóvil en MasOrange. Telefónica es el segundo por cuota y, según la propia compañía, el de mayor ingreso por cliente. Digi es el operador que más crece, con una oferta de precios bajos y utilizando la red de Telefónica, mientras Vodafone, MasOrange y los operadores virtuales pierden clientes en las portabilidades. La evolución del ingreso medio por cliente y del ingreso mayorista procedente de Digi serán los indicadores que midan la sostenibilidad de esta posición.<\u002Fp>\n\n\n    <div class=\"grid2\">\n      <div>\n        <div class=\"sec\"><span class=\"bar\"><\u002Fspan><h2>Cuota de banda ancha fija<\u002Fh2><span class=\"st\">% de líneas · julio de 2026<\u002Fspan><\u002Fdiv>\n        <div class=\"chart-card dark\">\n      <svg class=\"fig pie\" viewBox=\"0 0 520 214\" role=\"img\" aria-label=\"Cuota de líneas de banda ancha fija en julio de 2026: MasOrange 35%, Telefónica 31%, Digi 15%, Vodafone 13%.\">\n<path class=\"pie-s\" data-k=\"0\" style=\"transform-origin:112px 100px\" d=\"M112.00,10.00A90,90 0 0 1 195.68,133.13L162.21,119.88A54,54 0 0 0 112.00,46.00Z\" fill=\"#3A7CF6\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"1\" style=\"transform-origin:112px 100px\" d=\"M195.68,133.13A90,90 0 0 1 36.01,148.22L66.41,128.93A54,54 0 0 0 162.21,119.88Z\" fill=\"#C4CDE0\" stroke=\"#161E36\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\u002Fpath>\n<path class=\"pie-s\" data-k=\"2\" style=\"transform-origin:112px 100px\" d=\"M36.01,148.22A90,90 0 0 1 28.32,66.87L61.79,80.12A54,54 0 0 0 66.41,128.93Z\" fill=\"#5E6B86\" stroke=\"#161E36\" stroke-width=\"
